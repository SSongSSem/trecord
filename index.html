<meta charset="utf-8">
<title>평가 기록 도우미 — 근거로 쌓는 학기말 기록</title>

<style>
:root{
  --ground:#E9F2FA; --surface:#FFFFFF; --raise:#F4F9FD; --sink:#DDEAF5;
  --rule:#D8E4EF; --rule-strong:#B9CCDD;
  --ink:#1A2733; --ink-2:#55677C; --ink-3:#7C8DA0;
  --accent:#1E6FD9; --accent-deep:#1558B0; --accent-soft:#E3EEFB; --accent-line:#A9C8EE;
  --on-accent:#FFFFFF;
  --warm:#9C5324; --warm-soft:#FFEFE3; --warm-line:#EFC8A6;
  --low:#B3372A; --mid:#8F6410; --good:#1E7A55;
  --low-soft:#FBE9E5; --mid-soft:#FAF0DC; --good-soft:#E5F3EC;
  --shadow-card:0 1px 3px rgba(30,111,217,.06), 0 4px 16px rgba(30,111,217,.07);
  --shadow-pop:0 4px 12px rgba(30,111,217,.10), 0 12px 32px rgba(30,111,217,.12);
  --sans:'Pretendard Variable',Pretendard,'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  --mono:ui-monospace,'Cascadia Mono','D2Coding',Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme:dark){
  :root{
  --ground:#0E1621; --surface:#17212E; --raise:#1D2938; --sink:#101923;
  --rule:#2C3B4D; --rule-strong:#3E5065;
  --ink:#E8EFF7; --ink-2:#A9B9CB; --ink-3:#7B8CA0;
  --accent:#7FB4F2; --accent-deep:#9CC5F6; --accent-soft:#1A2D45; --accent-line:#2E4A6B;
  --on-accent:#0E1621;
  --warm:#F0B183; --warm-soft:#33241A; --warm-line:#57402D;
  --low:#EE8F7E; --mid:#E0B45C; --good:#63C094;
  --low-soft:#35201C; --mid-soft:#322817; --good-soft:#16301F;
  --shadow-card:0 1px 3px rgba(0,0,0,.30), 0 4px 16px rgba(0,0,0,.35);
  --shadow-pop:0 4px 12px rgba(0,0,0,.40), 0 12px 32px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1621; --surface:#17212E; --raise:#1D2938; --sink:#101923;
  --rule:#2C3B4D; --rule-strong:#3E5065;
  --ink:#E8EFF7; --ink-2:#A9B9CB; --ink-3:#7B8CA0;
  --accent:#7FB4F2; --accent-deep:#9CC5F6; --accent-soft:#1A2D45; --accent-line:#2E4A6B;
  --on-accent:#0E1621;
  --warm:#F0B183; --warm-soft:#33241A; --warm-line:#57402D;
  --low:#EE8F7E; --mid:#E0B45C; --good:#63C094;
  --low-soft:#35201C; --mid-soft:#322817; --good-soft:#16301F;
  --shadow-card:0 1px 3px rgba(0,0,0,.30), 0 4px 16px rgba(0,0,0,.35);
  --shadow-pop:0 4px 12px rgba(0,0,0,.40), 0 12px 32px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --ground:#E9F2FA; --surface:#FFFFFF; --raise:#F4F9FD; --sink:#DDEAF5;
  --rule:#D8E4EF; --rule-strong:#B9CCDD;
  --ink:#1A2733; --ink-2:#55677C; --ink-3:#7C8DA0;
  --accent:#1E6FD9; --accent-deep:#1558B0; --accent-soft:#E3EEFB; --accent-line:#A9C8EE;
  --on-accent:#FFFFFF;
  --warm:#9C5324; --warm-soft:#FFEFE3; --warm-line:#EFC8A6;
  --low:#B3372A; --mid:#8F6410; --good:#1E7A55;
  --low-soft:#FBE9E5; --mid-soft:#FAF0DC; --good-soft:#E5F3EC;
  --shadow-card:0 1px 3px rgba(30,111,217,.06), 0 4px 16px rgba(30,111,217,.07);
  --shadow-pop:0 4px 12px rgba(30,111,217,.10), 0 12px 32px rgba(30,111,217,.12);
}

*{box-sizing:border-box}
/* display를 지정한 요소는 hidden 속성이 먹지 않는다 — 한 줄로 막아 둔다 */
[hidden]{display:none !important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
     font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:650}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"⌄";margin-left:5px;font-size:11px;color:var(--ink-3)}
details[open]>summary::after{content:"⌃"}

/* 라벨 — 화면의 모든 작은 제목은 이 하나로 통일 */
.lab{font-size:13px;font-weight:600;color:var(--ink-2)}

/* ── 상단 ── */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--rule-strong)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 18px 0;display:flex;align-items:baseline;gap:12px}
.brand{font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.brand em{font-style:normal;color:var(--accent)}
.klass{font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--rule);
       padding:4px 8px;border-radius:999px;max-width:230px}
.klass:hover{border-color:var(--accent-line);color:var(--accent)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.saved{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.tabs{max-width:1120px;margin:0 auto;padding:0 18px;display:flex;gap:4px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px 8px;
     font-size:13.5px;font-weight:600;color:var(--ink-3)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover:not(:disabled){color:var(--ink)}
.tab:disabled{opacity:.4;cursor:not-allowed}
.tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--mid);
          vertical-align:2px;margin-left:5px}

.wrap{max-width:1120px;margin:0 auto;padding:16px 18px 72px}

/* 버튼 */
.ghost{background:var(--surface);border:1px solid var(--rule-strong);
       padding:6px 12px;font-size:12.5px;color:var(--ink-2);border-radius:12px}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.primary{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);
         border-radius:12px;padding:7px 18px;font-size:13.5px;font-weight:600}
.primary:hover:not(:disabled){background:var(--accent-deep);border-color:var(--accent-deep)}
.primary:disabled{opacity:.4;cursor:not-allowed}
.danger{color:var(--low);border-color:var(--rule-strong)}
.danger:hover{border-color:var(--low);color:var(--low)}
.link{background:none;border:0;color:var(--accent);font-size:12.5px;padding:0;text-decoration:underline}

select,input[type=text],textarea{background:var(--surface);border:1px solid var(--rule-strong);
  border-radius:12px;padding:7px 11px;font-size:13.5px}
select:focus,input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
textarea{line-height:1.7}

/* 패널 */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow-card)}
.ph{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--rule)}
.ph h2{font-size:15px;font-weight:650;letter-spacing:-.01em}
.ph .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.pb{padding:20px}
.stack{display:flex;flex-direction:column;gap:20px}

/* ── 2단 ── */
.cols{display:grid;grid-template-columns:206px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}

/* 명렬표 */
.roster{max-height:calc(100vh - 190px);overflow:auto}
.rrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto 16px;gap:8px;align-items:center;width:100%;
      background:none;border:0;padding:0 10px 0 12px;height:32px;border-radius:8px;
      text-align:left;font-size:13px;color:var(--ink);cursor:pointer}
.rrow:hover{background:var(--raise)}
.rrow .x{background:none;border:0;color:var(--ink-3);font-size:15px;line-height:1;padding:0;
         opacity:0;transition:opacity .1s}
.rrow:hover .x,.rrow[aria-current="true"] .x,.rrow .x:focus-visible{opacity:1}
.rrow .x:hover{color:var(--low)}
@media (prefers-reduced-motion:reduce){.rrow .x{transition:none}}
.rrow[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.rrow .no{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.rrow .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.rrow[aria-current="true"] .cnt{color:var(--accent)}

/* 학생 추가 줄 */
.addstu{display:flex;gap:5px;padding:8px 10px;border-top:1px solid var(--rule);background:var(--sink)}
.addstu input{flex:1;min-width:0;background:var(--surface)}
.addstu button{font-family:var(--mono);font-weight:700;padding:6px 10px;border-radius:12px}

/* 말풍선 도움말 */
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);
  width:210px;background:var(--ink);color:var(--surface);font-family:var(--sans);font-weight:400;
  font-size:11.5px;line-height:1.5;padding:6px 8px;border-radius:3px;text-align:left;
  opacity:0;visibility:hidden;transition:opacity .12s;z-index:40;pointer-events:none}
.tip:hover::after,.tip:focus-visible::after{opacity:1;visibility:visible}
@media (prefers-reduced-motion:reduce){.tip::after{transition:none}}

/* 학생 머리 */
.shead{padding:14px 16px 12px;border-bottom:1px solid var(--rule);display:flex;
       align-items:baseline;gap:12px;flex-wrap:wrap}
.shead .nm{font-size:20px;font-weight:700;letter-spacing:-.02em}
.shead .meta{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.shead .r{margin-left:auto;display:flex;gap:6px;align-items:baseline}

/* 슬롯 */
.slots{display:flex;flex-wrap:wrap;gap:4px;padding:10px 16px;border-bottom:1px solid var(--rule);
       background:var(--sink)}
/* 축 하나와 그 하위 선택을 한 덩어리로 — 고른 축만 옆으로 펼쳐진다 */
.slotgrp{display:inline-flex;gap:4px;align-items:center;border-radius:999px}
.slotgrp.on{background:var(--surface);border:1px solid var(--accent-line);padding:3px 4px 3px 3px}
.slotgrp.on select{border-radius:999px;padding:4px 10px;font-size:12px;height:28px}
.slot{background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;
      font-size:12px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.slot:hover{border-color:var(--accent-line)}
.slot b{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-3)}
.slot .ok{width:5px;height:5px;border-radius:50%;background:var(--good)}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);
                           color:var(--accent);font-weight:600}
.slot[aria-pressed="true"] b{color:var(--accent)}

/* 구역 */
.sec{padding:14px 16px;border-bottom:1px solid var(--rule)}
.sec:last-child{border-bottom:0}
.sechead{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.sechead .r{margin-left:auto;display:flex;gap:14px;align-items:baseline}

/* 관찰 담기 */
.catch{border:1px solid var(--rule);border-radius:16px;background:var(--raise);padding:16px}
.catch-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:7px}
.catch-top .where{font-size:12px;font-weight:600;color:var(--accent)}
.catch-in{display:flex;gap:6px}
.catch-in input{flex:1;background:var(--surface)}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--accent-line);
      background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 9px;
      font-size:11px;font-family:var(--mono)}
.chip.std{gap:6px;max-width:100%;font-family:var(--sans);font-size:11.5px;white-space:normal}
.chip.std b{font-family:var(--mono);font-weight:600}
.chip button{background:none;border:0;color:inherit;padding:0 0 0 2px;line-height:1}

/* 키워드 */
.kw{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.kw select{flex:0 0 auto;max-width:170px}
.kw button{flex:0 0 auto;white-space:nowrap}
.kwchips{display:flex;flex-wrap:wrap;gap:5px;max-height:62px;overflow-y:auto;padding-right:2px}
.kwc{background:var(--surface);border:1px solid var(--rule);border-radius:999px;
     padding:2px 10px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.kwc:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
/* 수준 — 축(파랑)도 근거(살구)도 경고(의미색)도 아니다. 중성으로 남긴다.
   의미색·게이지·정렬을 여기 쓰면 §5 색 전용권이 무너진다. */
.lv{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:7px}
.lvc{background:var(--surface);border:1px solid var(--rule);border-radius:999px;
     padding:3px 12px;font-size:12px;color:var(--ink-2)}
.lvc:hover{border-color:var(--rule-strong);color:var(--ink)}
.lvc[aria-pressed="true"]{border-color:var(--rule-strong);color:var(--ink);font-weight:600;background:var(--raise)}
.lvtag{font-size:11.5px;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;
       padding:1px 8px;white-space:nowrap}

/* 관찰 목록 */
.memo{display:grid;grid-template-columns:42px 68px minmax(0,1fr) 22px;gap:10px;align-items:baseline;
      padding:6px 0 8px}
.memo .dt{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.memo .src{font-size:11.5px;color:var(--warm);background:var(--warm-soft);border:1px solid var(--warm-line);border-radius:999px;
           padding:1px 9px;justify-self:start;white-space:nowrap}
.memo .body{word-break:break-word;line-height:1.65}
.memo .body{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.memo .code{font-family:var(--mono);font-size:11px;color:var(--accent)}
.memo .code.legacy{color:var(--warm)}
.memo .code em{font-style:normal;font-size:10px;border:1px solid var(--warm-line);border-radius:999px;padding:0 5px}
.memo .stdinline{font-size:11.5px;color:var(--ink-3)}
.memo .obs{flex-basis:100%;line-height:1.6}
.ic{width:15px;height:15px;flex:0 0 auto;vertical-align:-2px}
.kwai{display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:var(--on-accent);
      border:1px solid var(--accent);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600}
.kwai:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.chip.std.legacy{border-color:var(--warm-line);background:var(--warm-soft);color:var(--warm)}
.slot.sub{font-size:11.5px;padding:4px 10px}
.log{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
.loghead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.loghead .link{margin-left:auto}
.logrow{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:baseline;
        padding:4px 0 8px;font-size:13px}
.logrow .dt{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.logrow .t{line-height:1.6}
.logrow .b{display:flex;gap:6px;opacity:0;transition:opacity .1s}
.logrow:hover .b,.logrow:focus-within .b{opacity:1}
.rub{display:flex;flex-direction:column;gap:6px}
.rrow2{display:grid;grid-template-columns:88px minmax(0,1fr);gap:6px}
.rubbox{flex-basis:100%;margin-top:6px;font-size:12.5px}
.rubbox summary{color:var(--ink-3);font-size:12px}
.rubbox>div{padding-top:6px}
.rubbox p{margin:0 0 6px;color:var(--ink-2)}
.rline{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;padding:2px 0;color:var(--ink-2)}
.rline b{color:var(--accent);font-weight:600;font-size:12px}
.memo .task{font-size:11px;color:var(--ink-3);margin-right:6px}
.memo .clip{background:none;border:0;padding:0 0 0 6px;font-size:12px;line-height:1;opacity:.75}
.memo .clip:hover{opacity:1}
.memo .del{background:none;border:0;color:var(--ink-3);font-size:13px;padding:0;opacity:0}
.memo:hover .del{opacity:1}
.memo .del:hover{color:var(--low)}
.empty{color:var(--ink-3);font-size:12.5px;padding:14px 0;text-align:center}
.empty b{display:block;color:var(--ink-2);font-weight:600;margin-bottom:2px}

/* 문장 */
textarea.draft{width:100%;min-height:132px;resize:vertical;font-size:15px;line-height:1.9}
.meter{display:flex;gap:14px;align-items:baseline;margin-top:7px;font-size:11.5px;color:var(--ink-3)}
.meter b{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);font-weight:600}

/* 검사 */
.scan{margin-top:12px}
.scan-head{display:flex;align-items:baseline;gap:10px;padding-bottom:7px}
.tally{font-family:var(--mono);font-size:12px}
.tally .b{color:var(--low);font-weight:700}
.tally .w{color:var(--mid);font-weight:700}
.tally .none{color:var(--good);font-weight:600;font-family:var(--sans);font-size:12.5px}
.f{border-top:1px solid var(--rule)}
.f summary{display:flex;align-items:baseline;gap:8px;padding:6px 2px;font-size:13px}
.f summary:hover{background:var(--raise)}
.f .mk{font-size:9px;line-height:1.9}
.f.block .mk{color:var(--low)} .f.warn .mk{color:var(--mid)}
.f .hit{font-family:var(--mono);font-size:12px;padding:0 4px;border-radius:2px}
.f.block .hit{background:var(--low-soft);color:var(--low)}
.f.warn .hit{background:var(--mid-soft);color:var(--mid)}
.f .to{color:var(--ink-2);font-size:12.5px}
.f .r{margin-left:auto;display:flex;gap:8px;align-items:baseline}
.f.done .mk{color:var(--good)}
.f.done .hit{background:var(--good-soft);color:var(--good)}
.f.done summary{opacity:.85}
.f .why{padding:2px 2px 9px 26px;font-size:12px;color:var(--ink-2)}
.f .basis{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.fix{background:var(--surface);border:1px solid var(--accent-line);color:var(--accent);
     border-radius:8px;padding:1px 8px;font-size:11.5px}

/* 게이트 */
.gate{margin-top:16px;background:var(--sink);border:1.5px solid var(--rule-strong);border-radius:8px;padding:16px 20px}
.gate .row{display:flex;flex-wrap:wrap;gap:6px 14px;margin:7px 0 10px}
.gate label{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-3);cursor:pointer}
.gate label.on{color:var(--ink)}
.gate input{accent-color:var(--accent)}
.gate .note{font-size:12.5px;color:var(--ink-2);margin:0 0 10px}
.gate .foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gate .msg{font-size:11.5px;color:var(--ink-3)}
.gate .msg.warn{color:var(--low)}

/* 짚어주기 */
.pt{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:baseline;
    padding:12px 16px;border-bottom:1px solid var(--rule);font-size:14px}
.pt:last-child{border-bottom:0}
.pt .mk{font-size:10px;line-height:1.7}
.pt.high .mk{color:var(--low)} .pt.mid .mk{color:var(--mid)} .pt.low .mk{color:var(--ink-3)}
.pt .who{font-size:12px;color:var(--ink-3);margin-top:1px}
.pt .go{white-space:nowrap}
.clear{padding:16px 14px;font-size:13px;color:var(--good);display:flex;gap:8px;align-items:baseline}
.clear span{color:var(--ink-3);font-size:12px}

/* 표 */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--rule)}
th{font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
/* 진행 표 — 글자 칩 대신 근거유형 아이콘, 퍼센트 대신 원형 게이지 */
.srcs{display:flex;gap:7px;align-items:center;color:var(--warm)}
.srcs .ic{width:14px;height:14px}
.srcs .tot{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:2px}
.gau{width:18px;height:18px;vertical-align:-4px}
/* 관찰이 3회 미만인 행 — 짚어주기 계열이므로 의미색을 쓴다 */
tr.thin td:first-child{box-shadow:inset 3px 0 0 var(--low)}
.tsum{padding:10px 20px;font-size:12.5px;color:var(--ink-2)}
/* 과제 행 펼침 — 루브릭 전문과 수준별 인원. 숫자는 무색이고 학생 단위로 세지 않는다 */
.trow{cursor:pointer}
.tdetail td{background:var(--raise);padding:10px 14px}
.tcount{margin-top:8px;font-size:12px;color:var(--ink-2)}
.stu{display:flex;gap:8px;align-items:baseline}
.stu .no{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
/* 행 hover에서만 드러나는 조작 버튼 */
tr .rowact{opacity:0;transition:opacity .1s}
tr:hover .rowact,tr:focus-within .rowact{opacity:1}
@media (prefers-reduced-motion:reduce){tr .rowact{transition:none}}
.muted{color:var(--ink-3);font-size:12.5px}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.help{margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.help summary{font-size:12px;color:var(--ink-3)}
.help div{padding-top:8px;line-height:1.7}
.help p{margin:0 0 7px}

/* 문서 올리기 */
.drop{border:1px dashed var(--rule-strong);border-radius:12px;padding:18px 14px;text-align:center;
      background:var(--raise);color:var(--ink-3);font-size:12.5px}
.drop.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.drop b{display:block;color:var(--ink-2);font-size:13.5px;font-weight:600;margin-bottom:3px}

/* 설정 */
.setup{max-width:560px;margin:28px auto}
.field{margin-bottom:16px}
.field>.lab{display:block;margin-bottom:5px}
.inline{display:flex;gap:10px;align-items:flex-end}
.subjgrid{display:flex;flex-wrap:wrap;gap:5px}
.subjgrid label{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--rule-strong);
                border-radius:3px;padding:3px 9px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.subjgrid label.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
textarea.big{width:100%;min-height:120px;font-family:var(--mono);font-size:13px}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.steps{display:flex;gap:18px;font-size:12px;color:var(--ink-3);margin-bottom:14px;flex-wrap:wrap}
.steps .n{color:var(--accent);font-family:var(--mono);font-weight:700;margin-right:6px}

/* 성취기준 창 */
dialog{border:1px solid var(--rule-strong);border-radius:16px;box-shadow:var(--shadow-pop);background:var(--surface);color:var(--ink);
       padding:0;width:min(700px,94vw);max-height:86vh}
dialog::backdrop{background:rgba(8,12,20,.45)}
.dh{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--rule)}
.dh strong{font-size:13px}
.dh input[type=text]{flex:1}
.dtask{padding:12px 14px;border-bottom:1px solid var(--rule);background:var(--raise);
       max-height:66vh;overflow:auto}
.dtask input,.dtask textarea{width:100%}
.dtask .rl{width:100%}
.fieldhead{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.fieldhead .r{margin-left:auto;display:flex;gap:6px;align-items:center}
/* 고른 성취기준과 그 영역 — 영역은 고르는 것이 아니라 따라 나온다(읽기 전용) */
#dlg-picked{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:10px}
#dlg-picked .subj{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-right:2px}
.abadge{background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);
        border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600}
.abadge.none{background:var(--sink);border-color:var(--rule);color:var(--ink-3);font-weight:400}
/* 관찰 관점 칩 — 토글 */
.kwc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.kwc[aria-pressed="true"]:hover{background:var(--accent-deep);border-color:var(--accent-deep);color:var(--on-accent)}
#dlg-kw{max-height:96px}
/* 뼈대 고르기 — 축을 고르면 빈칸만 채운다 */
#dlg-skelmenu{display:flex;flex-direction:column;gap:4px;margin:6px 0 8px;
              border:1px solid var(--rule-strong);border-radius:12px;padding:6px;background:var(--surface)}
.skelopt{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:6px 9px}
.skelopt:hover{background:var(--raise)}
.skelopt b{font-size:13px;font-weight:600;color:var(--ink)}
.skelopt span{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.5}
/* 루브릭 점검 — 확인(▲)만. 등급 1도 잠금도 쪽수도 없다 */
#dlg-lint{margin-top:8px}
#dlg-lint .f summary{padding:5px 2px}
.dmsg{font-size:12px;color:var(--ink-2);margin-bottom:6px}
.dbody{max-height:52vh;overflow:auto}
.dfoot{padding:10px 14px;border-top:1px solid var(--rule);display:flex;gap:8px;align-items:center;
       justify-content:flex-end}
.fview{padding:12px;overflow:auto;max-height:74vh;background:var(--sink);text-align:center}
.fview img{max-width:100%;height:auto;border:1px solid var(--rule);background:#fff}
.ahead{position:sticky;top:0;background:var(--sink);border-bottom:1px solid var(--rule);
       padding:5px 14px;font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);font-weight:600}
.srow{display:grid;grid-template-columns:18px 74px minmax(0,1fr);gap:9px;align-items:baseline;width:100%;
      background:none;border:0;border-bottom:1px solid var(--rule);padding:6px 14px;text-align:left;
      font-size:13px;color:var(--ink)}
.srow:hover{background:var(--raise)}
.srow .mk{color:var(--ink-3)}
.srow[data-on="1"]{background:var(--accent-soft)}
.srow[data-on="1"] .mk{color:var(--good);font-weight:700}
.srow .code{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
</style>

<script>
"use strict";

const STD = {"국어":{"1~2":[{"n":"01","a":"듣기 · 말하기","s":[["2국01-01","중요한 내용이나 일이 일어난 순서를 고려하며 듣고 말한다."],["2국01-02","바르고 고운 말로 서로의 감정을 나누며 듣고 말한다."],["2국01-03","상대의 말을 집중하여 듣고 말차례를 지키며 대화한다."],["2국01-04","자신의 경험이나 생각을 바른 자세로 발표한다."],["2국01-05","듣기와 말하기에 관심과 흥미를 가진다."]]},{"n":"02","a":"읽기","s":[["2국02-01","글자, 단어, 문장, 짧은 글을 정확하게 소리 내어 읽는다."],["2국02-02","의미가 잘 드러나도록 문장과 짧은 글을 알맞게 띄어 읽는다."],["2국02-03","글을 읽고 중심 내용을 확인한다."],["2국02-04","인물의 마음이나 생각을 짐작하고 이를 자신과 비교하며 글을 읽는다."],["2국02-05","읽기에 흥미를 가지고 즐겨 읽는 태도를 지닌다."]]},{"n":"03","a":"쓰기","s":[["2국03-01","글자와 단어를 바르게 쓴다."],["2국03-02","쓰기에 흥미를 가지며 자신의 생각이나 느낌을 문장으로 표현한다."],["2국03-03","주변 소재에 대해 소개하는 글을 쓴다."],["2국03-04","겪은 일을 표현하는 글을 자유롭게 쓰고, 쓴 글을 함께 읽고 생각이나 느낌을 나눈다."]]},{"n":"04","a":"문법","s":[["2국04-01","한글 자모의 이름과 소릿값을 알고 정확하게 발음하고 쓴다."],["2국04-02","소리와 표기가 다를 수 있음을 알고 단어를 바르게 읽고 쓴다."],["2국04-03","문장과 문장 부호를 알맞게 쓰고 한글에 호기심을 가진다."]]},{"n":"05","a":"문학","s":[["2국05-01","말놀이, 낭송 등을 통해 말의 재미와 즐거움을 느낀다."],["2국05-02","작품을 듣거나 읽으면서 느끼거나 생각한 점을 말한다."],["2국05-03","작품 속 인물의 모습, 행동, 마음을 상상하여 시, 노래, 이야기, 그림 등으로 표현한다."],["2국05-04","시나 노래, 이야기에 흥미를 가진다."]]},{"n":"06","a":"매체","s":[["2국06-01","일상의 다양한 매체와 매체 자료에 흥미와 관심을 가진다."],["2국06-02","일상의 경험과 생각을 글과 그림으로 표현한다."]]}],"3~4":[{"n":"01","a":"듣기 · 말하기","s":[["4국01-01","중요한 내용과 주제를 파악하며 듣고 그 내용을 요약한다."],["4국01-02","원인과 결과의 관계를 고려하여 내용을 예측하며 듣고 말한다."],["4국01-03","상황에 적절한 준언어⋅비언어적 표현을 활용하여 듣고 말한다."],["4국01-04","상황과 상대의 입장을 이해하고 예의를 지키며 대화한다."],["4국01-05","목적과 주제에 알맞게 자료를 정리하여 자신감 있게 발표한다."],["4국01-06","주제에 적절한 의견과 이유를 제시하고 서로의 생각을 교환하며 토의한다."]]},{"n":"02","a":"읽기","s":[["4국02-01","글의 의미를 파악하며 유창하게 글을 읽는다."],["4국02-02","문단과 글에서 중심 생각을 파악하고 내용을 간추린다."],["4국02-03","질문을 활용하여 글을 예측하며 읽고 자신의 읽기 과정을 점검한다."],["4국02-04","글에 나타난 사실과 의견을 구분하고 필자와 자신의 의견을 비교한다."],["4국02-05","글이나 자료의 출처가 믿을 만한지 판단한다."],["4국02-06","바람직한 읽기 습관을 형성하고 읽기에 대한 자신감을 기른다."]]},{"n":"03","a":"쓰기","s":[["4국03-01","중심 문장과 뒷받침 문장을 갖추어 문단을 쓰고, 문장과 문단을 중심으로 고쳐 쓴다."],["4국03-02","절차와 결과가 드러나게 정확한 표현으로 보고하는 글을 쓴다."],["4국03-03","대상에 대한 자신의 의견과 그렇게 생각한 이유가 드러나게 글을 쓴다."],["4국03-04","목적과 주제를 고려하여 독자에게 마음을 전하는 글을 쓴다."],["4국03-05","자신의 쓰기 과정을 점검하며 쓰기에 자신감을 갖는다."]]},{"n":"04","a":"문법","s":[["4국04-01","단어와 단어 간의 의미 관계를 파악한다."],["4국04-02","단어를 분류하고 국어사전을 활용하여 능동적인 국어 활동을 한다."],["4국04-03","기본적인 문장의 짜임을 이해하고 적절하게 사용한다."],["4국04-04","글과 담화에 쓰인 높임 표현과 지시⋅접속 표현을 이해하고 상황에 맞게 표현한다."],["4국04-05","언어가 의사소통과 관계 형성의 수단임을 이해하고 국어를 소중히 여기는 태도를 지닌다."]]},{"n":"05","a":"문학","s":[["4국05-01","인물과 이야기의 흐름을 중심으로 작품을 감상한다."],["4국05-02","자신의 경험을 바탕으로 작품 속 세계와 현실 세계를 비교하여 작품을 감상한다."],["4국05-03","작품을 듣거나 읽고 마음에 드는 작품을 소개한다."],["4국05-04","감각적 표현에 유의하여 작품을 감상하고, 감각적 표현을 활용하여 자신의 생각이나 감정을 표현한다."],["4국05-05","재미나 감동을 느끼며 작품을 즐겨 감상하는 태도를 지닌다."]]},{"n":"06","a":"매체","s":[["4국06-01","인터넷에서 학습에 필요한 다양한 자료를 탐색하고 목적에 맞게 자료를 선택한다."],["4국06-02","매체를 활용하여 간단한 발표 자료를 만든다."],["4국06-03","매체 소통 윤리를 고려하여 매체 자료를 활용하고 공유한다."]]}],"5~6":[{"n":"01","a":"듣기 · 말하기","s":[["6국01-01","대화에서 생략된 내용을 추론하며 듣는다."],["6국01-02","주장을 파악하고 이유나 근거가 타당한지 평가하며 듣는다."],["6국01-03","주제와 관련하여 궁금한 내용을 질문하며 적극적으로 듣고 말한다."],["6국01-04","면담의 절차를 이해하고 상대와 매체를 고려하여 면담한다."],["6국01-05","자료를 선별하여 핵심 정보를 중심으로 내용을 구성하고 매체를 활용하여 발표한다."],["6국01-06","토의에 협력적으로 참여하며 서로의 의견을 비교하고 조정한다."],["6국01-07","절차와 규칙을 지키고 타당한 이유와 근거를 제시하며 토론한다."]]},{"n":"02","a":"읽기","s":[["6국02-01","글의 구조를 고려하며 주제나 주장을 파악하고 글 내용을 요약한다."],["6국02-02","글에서 생략된 내용이나 함축된 표현을 문맥을 고려하여 추론한다."],["6국02-03","글이나 자료를 읽고 내용의 타당성과 표현의 적절성을 평가한다."],["6국02-04","문제 상황과 관련된 다양한 관점의 글을 읽고 이를 문제 해결에 활용한다."],["6국02-05","긍정적인 읽기 동기를 형성하고 적극적으로 읽기에 참여하는 태도를 기른다."]]},{"n":"03","a":"쓰기","s":[["6국03-01","알맞은 내용을 선정하여 대상의 특성이 나타나게 설명하는 글을 쓴다."],["6국03-02","적절한 근거를 사용하고 인용의 출처를 밝히며 주장하는 글을 쓴다."],["6국03-03","체험한 일에 대한 감상을 나타내는 글을 쓴다."],["6국03-04","독자와 매체를 고려하여 내용을 생성하고 표현하며 글을 쓴다."],["6국03-05","쓰기 과정을 점검⋅조정하며 글을 쓰고, 글 전체를 대상으로 통일성 있게 고쳐 쓴다."],["6국03-06","쓰기에 적극적으로 참여하며 자신의 글을 독자와 공유하는 태도를 지닌다."]]},{"n":"04","a":"문법","s":[["6국04-01","음성 언어 및 문자 언어의 특성을 이해하고 다양한 매체 자료에서 표현 효과를 평가한다."],["6국04-02","표준어와 방언의 기능을 파악하고 언어 공동체와 국어생활과의 관계를 이해한다."],["6국04-03","고유어와 관용 표현의 쓰임과 가치를 이해하고 상황에 맞게 표현한다."],["6국04-04","문장 성분을 이해하고 호응 관계가 올바른 문장을 구성한다."],["6국04-05","글과 담화에 쓰인 시간 표현을 이해하고 상황에 맞게 표현한다."],["6국04-06","글과 담화에 쓰인 단어 및 문장, 띄어쓰기를 민감하게 살펴 바르게 고치는 태도를 지닌다."]]},{"n":"05","a":"문학","s":[["6국05-01","작가의 의도를 생각하며 작품을 읽는다."],["6국05-02","비유적 표현의 효과에 유의하여 작품을 감상한다."],["6국05-03","소설이나 극을 읽고 인물, 사건, 배경을 파악한다."],["6국05-04","인상적인 부분을 중심으로 작품에 대한 의견을 나눈다."],["6국05-05","자신의 경험을 시, 소설, 극, 수필 등 적절한 갈래로 표현한다."],["6국05-06","작품을 읽고 자신의 삶과 연관 지어 성찰하는 태도를 지닌다."]]},{"n":"06","a":"매체","s":[["6국06-01","정보 검색 도구를 활용하여 자신의 목적에 맞는 매체 자료를 찾는다."],["6국06-02","뉴스 및 각종 정보 매체 자료의 신뢰성을 평가한다."],["6국06-03","적합한 양식과 수용자의 반응을 고려하여 복합양식 매체 자료를 제작하고 공유한다."],["6국06-04","자신의 매체 이용 양상에 대해 성찰한다."]]}]},"수학":{"1~2":[{"n":"01","a":"수와 연산","s":[["2수01-01","수의 필요성을 인식하면서 0과 100까지의 수 개념을 이해하고, 수를 세고 읽고 쓸 수 있다."],["2수01-02","일, 십, 백, 천의 자릿값과 위치적 기수법을 이해하고, 네 자리 이하의 수를 읽고 쓸 수 있다."],["2수01-03","네 자리 이하의 수의 범위에서 수의 계열을 이해하고, 수의 크기를 비교할 수 있다."],["2수01-04","하나의 수를 두 수로 분해하고 두 수를 하나의 수로 합성하는 활동을 통하여 수 감각을 기른다."],["2수01-05","덧셈과 뺄셈이 이루어지는 실생활 상황과 연결하여 덧셈과 뺄셈의 의미를 이해한다."],["2수01-06","두 자리 수의 범위에서 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다."],["2수01-07","덧셈과 뺄셈의 관계를 이해한다."],["2수01-08","두 자리 수의 범위에서 세 수의 덧셈과 뺄셈을 할 수 있다."],["2수01-09","□가 사용된 덧셈식과 뺄셈식을 만들고, □의 값을 구할 수 있다."],["2수01-10","곱셈이 이루어지는 실생활 상황과 연결하여 곱셈의 의미를 이해한다."],["2수01-11","곱셈구구를 이해하고, 한 자리 수의 곱셈을 할 수 있다."]]},{"n":"02","a":"변화와 관계","s":[["2수02-01","물체, 무늬, 수 등의 배열에서 규칙을 찾아 여러 가지 방법으로 표현할 수 있다."],["2수02-02","자신이 정한 규칙에 따라 물체, 무늬, 수 등을 배열할 수 있다."]]},{"n":"03","a":"도형과 측정","s":[["2수03-01","교실 및 생활 주변에서 여러 가지 물건을 관찰하여 직육면체, 원기둥, 구의 모양을 찾고, 이를 이용하여 여러 가지 모양을 만들 수 있다."],["2수03-02","쌓기나무를 이용하여 여러 가지 입체도형의 모양을 만들고, 그 모양에 대해 위치나 방향을 이용하여 말할 수 있다."],["2수03-03","교실 및 생활 주변에서 여러 가지 물건을 관찰하여 삼각형, 사각형, 원의 모양을 찾고, 이를 이용하여 여러 가지 모양을 만들 수 있다."],["2수03-04","삼각형, 사각형, 원을 직관적으로 이해하고, 그 모양을 그릴 수 있다."],["2수03-05","삼각형, 사각형에서 각각의 공통점을 찾아 말할 수 있다."],["2수03-06","구체물의 길이, 들이, 무게, 넓이를 비교하여 각각 ‘길다, 짧다’, ‘많다, 적다’, ‘무겁다, 가볍다’, ‘넓다, 좁다’ 등을 구별하여 말할 수 있다."],["2수03-07","시계를 보고 시각을 ‘몇 시 몇 분’까지 읽을 수 있다."],["2수03-08","1시간과 1분의 관계를 이해하고, 시간을 ‘시간’, ‘분’으로 표현할 수 있다."],["2수03-09","실생활 문제 상황과 연결하여 1분, 1시간, 1일, 1주일, 1개월, 1년 사이의 관계를 이해한다."],["2수03-10","길이의 표준 단위를 도입하기 전에 구체물을 직접 비교해 보거나 여러 가지 임의 단위를 사용하여 구체물의 길이를 재어보는 활동을 통해 표준 단위의 필요성을 알게 한다."],["2수03-11","1m와 1cm의 관계를 이해하고, 길이를 ‘몇 m 몇 cm’와 ‘몇 cm’로 표현할 수 있다."],["2수03-12","생활 주변의 여러 가지 물건들의 길이를 어림해 보고 자로 측정하여 확인하는 활동과 주어진 길이에 해당하는 선분을 그려 보는 활동을 통해 길이에 대한 양감을 기르게 한다."],["2수03-13","실생활 문제 상황과 연결하여 길이의 덧셈과 뺄셈을 할 수 있다."]]},{"n":"04","a":"자료와 가능성","s":[["2수04-01","여러 가지 사물을 정해진 기준 또는 자신이 정한 기준으로 분류하여 개수를 세어 보고, 기준에 따른 결과를 말할 수 있다."],["2수04-02","자료를 분류하여 표로 나타내고, 자료를 표로 나타내면 편리한 점을 말할 수 있다."],["2수04-03","자료를 분류하여 ○, ×, / 등을 이용한 그래프로 나타내고, 자료를 그래프로 나타내면 편리한 점을 말할 수 있다."]]}],"3~4":[{"n":"01","a":"수와 연산","s":[["4수01-01","큰 수의 필요성을 인식하면서 10000 이상의 큰 수에 대한 자릿값과 위치적 기수법을 이해하고, 수를 읽고 쓸 수 있다."],["4수01-02","다섯 자리 이상의 수의 범위에서 수의 계열을 이해하고, 수의 크기를 비교하며 그 방법을 설명할 수 있다."],["4수01-03","세 자리 수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다."],["4수01-04","곱하는 수가 한 자리 수 또는 두 자리 수인 곱셈의 계산 원리를 이해하고 그 계산을 할 수 있다."],["4수01-05","나눗셈이 이루어지는 실생활 상황과 연결하여 나눗셈의 의미를 알고, 곱셈과 나눗셈의 관계를 이해한다."],["4수01-06","나누는 수가 한 자리 수인 나눗셈의 계산 원리를 이해하고 그 계산을 할 수 있으며, 나눗셈에서 몫과 나머지의 의미를 안다."],["4수01-07","나누는 수가 두 자리 수인 나눗셈의 계산 원리를 이해하고 그 계산을 할 수 있다."],["4수01-08","자연수의 덧셈, 뺄셈, 곱셈, 나눗셈과 관련한 여러 가지 상황에서 어림셈을 할 수 있다."],["4수01-09","양의 등분할을 통하여 분수의 필요성을 인식하고, 분수를 이해하고 읽고 쓸 수 있다."],["4수01-10","단위분수, 진분수, 가분수, 대분수를 알고, 그 관계를 이해한다."],["4수01-11","분모가 같은 분수끼리, 단위분수끼리 크기를 비교하고 그 방법을 설명할 수 있다."],["4수01-12","분모가 10인 진분수와 연결하여 소수 한 자리 수를 이해하고 읽고 쓸 수 있다."],["4수01-13","자릿값의 원리를 바탕으로 소수 두 자리 수와 소수 세 자리 수를 이해하고 읽고 쓸 수 있다."],["4수01-14","소수의 크기를 비교하고 그 방법을 설명할 수 있다."],["4수01-15","분모가 같은 분수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다."],["4수01-16","소수 두 자리 수의 범위에서 소수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다."]]},{"n":"02","a":"변화와 관계","s":[["4수02-01","다양한 변화 규칙을 찾아 설명하고, 그 규칙을 수나 식으로 나타낼 수 있다."],["4수02-02","계산식의 배열에서 규칙을 찾고, 계산 결과를 추측할 수 있다."],["4수02-03","등호를 사용하여 크기가 같은 두 양의 관계를 식으로 나타낼 수 있다."]]},{"n":"03","a":"도형과 측정","s":[["4수03-01","직선, 선분, 반직선을 이해하고 구별할 수 있다."],["4수03-02","각과 직각을 이해하고, 직각과 비교하는 활동을 통하여 예각과 둔각을 구별할 수 있다."],["4수03-03","직선의 수직 관계와 평행 관계를 이해한다."],["4수03-04","구체물이나 평면도형의 밀기, 뒤집기, 돌리기 활동을 통하여 그 변화를 이해한다."],["4수03-05","평면에서 점의 이동에 대해 위치와 방향을 이용하여 설명할 수 있다."],["4수03-06","원의 중심, 반지름, 지름을 이해하고, 그 성질을 안다."],["4수03-07","컴퍼스를 이용하여 여러 가지 크기의 원을 그릴 수 있다."],["4수03-08","여러 가지 모양의 삼각형에 대한 분류 활동을 통하여 이등변삼각형, 정삼각형을 이해하고, 그 성질을 탐구하고 설명할 수 있다."],["4수03-09","여러 가지 모양의 삼각형에 대한 분류 활동을 통하여 직각삼각형, 예각삼각형, 둔각 삼각형을 이해한다."],["4수03-10","여러 가지 모양의 사각형에 대한 분류 활동을 통하여 직사각형, 정사각형, 사다리꼴, 평행 사변형, 마름모를 이해하고, 그 성질을 탐구하고 설명할 수 있다."],["4수03-11","다각형과 정다각형을 이해한다."],["4수03-12","주어진 도형을 이용하여 여러 가지 모양을 만들거나 채우고 설명할 수 있다."],["4수03-13","1분과 1초의 관계를 이해하고, 초 단위까지 시각을 읽을 수 있다."],["4수03-14","실생활 문제 상황과 연결하여 초 단위까지의 시간의 덧셈과 뺄셈을 할 수 있다."],["4수03-15","길이 단위 1mm와 1km를 알고, 이를 이용하여 길이를 측정하고 어림하며 수학의 유용성을 인식할 수 있다."],["4수03-16","1cm와 1mm, 1km와 1m의 관계를 이해하고, 길이를 ‘몇 cm 몇 mm’와 ‘몇 mm’, ‘몇 km 몇 m’와 ‘몇 m’로 다양하게 표현할 수 있다."],["4수03-17","들이 단위 1L와 1mL를 알고, 이를 이용하여 들이를 측정하고 어림하며 수학의 유용성을 인식할 수 있다."],["4수03-18","1L와 1mL의 관계를 이해하고, 들이를 ‘몇 L 몇 mL’와 ‘몇 mL’로 표현할 수 있다."],["4수03-19","실생활 문제 상황과 연결하여 들이의 덧셈과 뺄셈을 할 수 있다."],["4수03-20","실생활에서 무게를 나타낼 때 사용하는 단위 1g과 1kg을 알고, 이를 이용하여 무게를 측정하고 어림하며 수학의 유용성을 인식할 수 있다."],["4수03-21","1kg과 1g의 관계를 이해하고, 무게를 ‘몇 kg 몇 g’과 ‘몇 g’으로 표현할 수 있다."],["4수03-22","실생활에서 무게를 나타낼 때 사용하는 단위 1t을 알고, 1t과 1kg의 관계를 이해한다."],["4수03-23","실생활 문제 상황과 연결하여 무게의 덧셈과 뺄셈을 할 수 있다."],["4수03-24","각의 크기의 단위인 1도(°)를 알고, 각도기를 이용하여 각의 크기를 측정하고 어림할 수 있다."],["4수03-25","여러 가지 방법으로 삼각형과 사각형의 내각의 크기의 합을 추론하고, 자신의 추론 과정을 설명할 수 있다."]]},{"n":"04","a":"자료와 가능성","s":[["4수04-01","자료를 수집하여 그림그래프나 막대그래프로 나타내고 해석할 수 있다."],["4수04-02","자료를 수집하여 꺾은선그래프로 나타내고 해석할 수 있다."],["4수04-03","탐구 문제를 해결하기 위해 자료를 수집, 정리하여 막대그래프나 꺾은선그래프로 나타내고 해석할 수 있다."]]}],"5~6":[{"n":"01","a":"수와 연산","s":[["6수01-01","덧셈, 뺄셈, 곱셈, 나눗셈의 혼합 계산에서 계산하는 순서를 알고, 혼합 계산을 할 수 있다."],["6수01-02","실생활과 연결하여 이상, 이하, 초과, 미만의 의미와 쓰임을 알고, 이를 활용하여 수의 범위를 나타낼 수 있다."],["6수01-03","어림값을 구하기 위한 방법으로 올림, 버림, 반올림의 의미와 필요성을 알고, 이를 실생활에 활용함으로써 수학의 유용성을 인식할 수 있다."],["6수01-04","약수, 공약수, 최대공약수를 이해하고 구할 수 있다."],["6수01-05","배수, 공배수, 최소공배수를 이해하고 구할 수 있다."],["6수01-06","크기가 같은 분수를 만드는 방법을 이해하고, 분수를 약분, 통분할 수 있다."],["6수01-07","분모가 다른 분수의 크기를 비교하고 그 방법을 설명할 수 있다."],["6수01-08","분모가 다른 분수의 덧셈과 뺄셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."],["6수01-09","분수의 곱셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."],["6수01-10","‘(자연수)÷(자연수)’에서 나눗셈의 몫을 분수로 나타낼 수 있다."],["6수01-11","분수의 나눗셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."],["6수01-12","분수와 소수의 관계를 이해하고 크기를 비교하며 그 방법을 설명할 수 있다."],["6수01-13","소수의 곱셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."],["6수01-14","‘(자연수)÷(자연수)’에서 나눗셈의 몫을 소수로 나타낼 수 있다."],["6수01-15","소수의 나눗셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."]]},{"n":"02","a":"변화와 관계","s":[["6수02-01","한 양이 변할 때 다른 양이 그에 종속하여 변하는 대응 관계를 나타낸 표에서 규칙을 찾아 설명하고, □, △ 등을 사용하여 식으로 나타낼 수 있다."],["6수02-02","두 양의 크기를 비교하는 상황을 통해 비의 개념을 이해하고, 두 양의 관계를 비로 나타낼 수 있다."],["6수02-03","비율을 이해하고, 비율을 분수, 소수, 백분율로 나타낼 수 있다."],["6수02-04","비례식을 알고, 그 성질을 이해하며, 이를 활용하여 간단한 비례식을 풀 수 있다."],["6수02-05","비례배분을 알고, 주어진 양을 비례배분 할 수 있다."]]},{"n":"03","a":"도형과 측정","s":[["6수03-01","합동인 두 도형에서 대응점, 대응변, 대응각을 각각 찾게 하고 대응변의 길이 와 대응각의 크기를 비교하는 활동을 통해 합동인 도형의 성질을 탐구하고 설명하게 한다."],["6수03-02","실생활과 연결하여 선대칭도형과 점대칭도형을 이해하고 그릴 수 있다."],["6수03-03","직육면체와 정육면체를 이해하고, 구성 요소와 성질을 탐구하고 설명할 수 있다."],["6수03-04","직육면체와 정육면체의 겨냥도와 전개도를 그릴 수 있다."],["6수03-05","각기둥과 각뿔을 이해하고, 구성 요소와 성질을 탐구하고 설명할 수 있다."],["6수03-06","각기둥의 전개도를 그릴 수 있다."],["6수03-07","원기둥, 원뿔, 구를 이해하고, 구성 요소와 성질을 탐구하고 설명할 수 있다."],["6수03-08","원기둥의 전개도를 그릴 수 있다."],["6수03-09","쌓기나무로 만든 입체도형을 보고 사용된 쌓기나무의 개수를 구할 수 있다."],["6수03-10","쌓기나무로 만든 입체도형의 위, 앞, 옆에서 본 모양을 표현할 수 있고, 이러한 표현을 보고 입체도형의 모양을 추측할 수 있다."],["6수03-11","평면도형의 둘레를 이해하고, 기본적인 평면도형의 둘레를 구할 수 있다."],["6수03-12","넓이 단위 1cm², 1m², 1km²를 알며, 그 관계를 이해한다."],["6수03-13","직사각형과 정사각형의 넓이를 구하는 방법을 이해하고, 이를 구할 수 있다."],["6수03-14","평행사변형, 삼각형, 사다리꼴, 마름모의 넓이를 구하는 방법을 다양하게 추론하고, 이와 관련된 문제를 해결할 수 있다."],["6수03-15","여러 가지 원에서 (원주)÷(지름)의 값을 구하여 모든 원에서 원주율이 일정함 을 이해하게 하고, 원주율의 근삿값으로 3.14를 사용하게 한다."],["6수03-16","지름과 원주율을 이용하면 원주를 직접 측정하지 않고도 구할 수 있음을 알게 하고, 직사각형의 넓이를 구하는 방법을 이용하여 원의 넓이를 구하는 방법을 이해하게 한다."],["6수03-17","직육면체와 정육면체의 겉넓이를 구하는 방법을 이해하고, 이를 구할 수 있다."],["6수03-18","부피 단위 1cm³, 1m³를 알며, 그 관계를 이해한다."],["6수03-19","직육면체와 정육면체의 부피를 구하는 방법을 이해하고, 이를 구할 수 있다."]]},{"n":"04","a":"자료와 가능성","s":[["6수04-01","평균의 의미를 알고, 자료를 수집하여 평균을 구하고 해석할 수 있다."],["6수04-02","자료를 수집하여 띠그래프나 원그래프로 나타내고 해석할 수 있다."],["6수04-03","탐구 문제를 설정하고, 그에 맞는 자료를 수집, 정리하여 적절한 그래프로 나타내고 해석할 수 있다."],["6수04-04","사건이 일어날 가능성을 말로 표현하고 비교할 수 있다."],["6수04-05","사건이 일어날 가능성을 수로 나타낼 수 있다."],["6수04-06","자료를 이용하여 가능성을 예상하고, 가능성에 근거하여 적절한 판단을 내릴 수 있다."]]}]},"사회":{"3~4":[{"n":"01","a":"우리가 사는 곳","s":[["4사01-01","주변 여러 장소에서의 경험과 느낌을 다양한 방식으로 표현하고, 장소감을 나누며 서로 존중하는 태도를 지닌다."],["4사01-02","주변의 여러 장소를 살펴보고, 우리가 사는 곳을 더 살기 좋은 곳으로 만드는 방안을 탐 색한다."]]},{"n":"02","a":"일상에서 만나는 과거","s":[["4사02-01","일상 속에서 시간의 흐름을 경험할 수 있는 사례를 살펴보고, 이를 바탕으로 역사의 시간 개념을 이해한다."],["4사02-02","오래된 물건이나 자료들을 주변에서 찾아보고, 이를 통해 과거의 모습을 살펴볼 수 있음을 이해한다."],["4사02-03","지역의 변화상을 보여주는 역사 자료를 분석하여 지역 사람들의 달라진 생활 모습을 파 악한다."]]},{"n":"03","a":"사회 변화와 다양한 문화","s":[["4사03-01","최근 사회 변화의 양상과 특징을 파악하고, 그로 인해 나타난 생활모습의 변화를 탐색한다."],["4사03-02","우리 사회에 다양한 문화가 확산되면서 나타나는 긍정적 효과와 문제를 분석하고, 나와 다른 사람이나 집단의 문화를 존중하는 태도를 기른다."]]},{"n":"04","a":"옛날과 오늘날의 생활 모습","s":[["4사04-01","옛날 풍습에 대해 알아보고, 오늘날과 비교하여 변화상을 파악한다."],["4사04-02","옛날부터 오늘날까지 교통의 변화에 따른 이동과 생활 모습의 변화를 이해한다."],["4사04-03","옛날부터 오늘날까지 통신수단의 변화에 따른 정보 교류와 의사소통 방식의 변화를 설명 한다."]]},{"n":"05","a":"지도로 만나는 우리 지역","s":[["4사05-01","우리 지역을 표현한 다양한 종류의 지도를 찾아보고, 지도의 요소를 이해한다."],["4사05-02","지도에서 우리 지역의 위치를 파악하고, 우리 지역의 지리 정보를 탐색한다."]]},{"n":"06","a":"우리 지역의 문화유산","s":[["4사06-01","지역의 문화유산을 통해 문화유산의 의미와 유형을 알아보고, 문화유산의 가치를 탐색한다."],["4사06-02","지역의 박물관, 기념관, 유적지 등을 체험하고 지역의 역사를 이해한다."]]},{"n":"07","a":"경제활동과 지역 간 교류","s":[["4사07-01","자원의 희소성으로 인해 경제활동에서 선택의 문제가 발생함을 이해하고, 경제활동에서 합 리적 선택의 방법을 탐색한다."],["4사07-02","생산과 소비 활동을 파악하고, 인적⋅물적 교류의 사례를 통해 각 지역 및 사람들이 상호 의존 관계를 맺고 있음을 탐색한다."]]},{"n":"08","a":"민주주의와 자치","s":[["4사08-01","학교 자치 사례를 통하여 민주주의의 의미를 이해하고, 학교생활에서 민주주의를 실천하는 능력을 기른다."],["4사08-02","지역에서 이루어지는 민주주의 사례를 통해 주민 자치와 주민 참여의 중요성을 파악하고, 지역사회의 문제 해결에 참여하는 태도를 기른다."]]},{"n":"09","a":"지역문제를 해결하고 지역을 알리는 노력","s":[["4사09-01","생활 주변에서 찾을 수 있는 여러 가지 문제를 파악하고, 그 문제를 합리적으로 해결하는 능력을 기른다."],["4사09-02","지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 노력을 알고 관심을 갖는다."]]},{"n":"10","a":"다양한 환경과 삶의 모습","s":[["4사10-01","여러 지역의 자연환경과 인문환경의 특징을 살펴보고, 환경의 이용과 개발에 따른 변화를 탐구한다."],["4사10-02","사례에서 도시의 인구, 교통, 산업 등의 특징을 탐구하고, 도시에서의 삶의 모습을 이해 한다."]]}],"5~6":[{"n":"01","a":"우리나라 국토 여행","s":[["6사01-01","우리나라 산지, 하천, 해안 지형의 위치를 확인하고 지형의 분포 특징을 탐구한다."],["6사01-02","독도의 지리적 특성과 독도에 대한 역사 기록을 바탕으로 영토로서 독도의 중요성을 이해 한다."]]},{"n":"02","a":"우리나라 지리 탐구","s":[["6사02-01","우리나라의 계절별 기후 특징을 자료에서 탐구하고, 기후변화로 인한 자연재해의 심각성을 이해한다."],["6사02-02","우리나라의 지역별 인구 분포의 특징을 알아보고, 이에 따른 문제점과 해결 방안을 탐색 한다."]]},{"n":"03","a":"법과 인권의 보장","s":[["6사03-01","일상 사례에서 법의 의미와 역할을 이해하고, 헌법에 규정된 인권이 일상생활에서 구현 되는 사례를 조사하여 인권 친화적 태도를 기른다."],["6사03-02","일상생활에서 인권이 침해되는 사례를 찾아 그 해결 방안을 탐색하고, 인권을 보호하는 활동에 참여한다."]]},{"n":"04","a":"유적과 유물로 살펴본 옛 사람들의 생활","s":[["6사04-01","선사 시대와 고조선의 유적과 유물을 활용하여 당시 사람들의 생활을 추론한다."],["6사04-02","역사 기록이나 유적과 유물에 나타난 고대 사람들의 생각과 생활을 추론한다."],["6사04-03","다양한 역사 자료를 활용하여 고려 시대 사회 모습과 사람들의 생활을 추론한다."]]},{"n":"05","a":"달라지는 시대, 변화하는 생활 모습","s":[["6사05-01","조선 시대 사람들의 생각과 생활에 유교 문화가 미친 영향을 파악한다."],["6사05-02","조선 후기 사회⋅문화적 변화와 개항기 근대 문물 수용 과정에서 달라진 사람들의 생활을 이해한다."]]},{"n":"06","a":"식민 통치와 저항, 전쟁이 바꾼 사회와 생활","s":[["6사06-01","일제의 식민 통치와 이에 대한 저항이 사회와 생활에 미친 영향을 이해한다."],["6사06-02","8⋅15 광복과 6⋅25 전쟁이 사회와 생활에 미친 영향을 파악한다."]]},{"n":"07","a":"평화 통일을 위한 노력, 민주화와 산업화","s":[["6사07-01","분단으로 나타난 문제점과 분단과 관련된 장소를 평화의 장소로 만들려는 노력 등을 알아 보고, 평화 통일을 위해 우리가 할 수 있는 일을 탐색한다."],["6사07-02","민주화와 산업화로 인해 달라진 생활 문화를 사례를 들어 이해한다."]]},{"n":"08","a":"민주주의와 시민 참여","s":[["6사08-01","민주주의에서 선거의 의미와 역할을 파악하고, 시민의 주권 행사를 위해 선거에 참여하는 태도를 기른다."],["6사08-02","민주 국가에서 국회, 행정부, 법원이 하는 일에 대해 이해하고, 각 국가기관의 권력을 분립 하는 이유를 탐색한다."],["6사08-03","민주주의에서 미디어의 의미와 역할을 이해하고, 여러 가지 미디어의 내용을 비판적으로 분석하여 올바르게 이용하는 태도를 기른다."]]},{"n":"09","a":"지구, 대륙 그리고 국가들","s":[["6사09-01","세계를 표현하는 다양한 공간 자료의 특징을 이해하고, 지구본과 세계지도에서 위치를 표현하는 방법을 익힌다."],["6사09-02","세계 주요 대륙과 대양을 파악하고, 우리나라 및 세계 여러 국가의 위치와 영토의 특징을 이해한다."]]},{"n":"10","a":"세계의 자연환경","s":[["6사10-01","세계의 여러 지역의 지형 경관을 살펴보고, 이를 통해 다양한 삶의 모습을 이해한다."],["6사10-02","세계의 다양한 기후를 알아보고 기후 환경과 인간생활 간의 관계를 탐구한다."]]},{"n":"11","a":"시장경제와 국가 간 거래","s":[["6사11-01","시장경제에서 가계와 기업의 역할을 이해하고, 근로자의 권리와 기업의 자유 및 사회적 책임을 탐색한다."],["6사11-02","경제성장이 우리 생활에 미치는 영향을 파악하고, 빠른 경제성장으로 발생한 문제의 해결 방안을 탐색한다."],["6사11-03","사례를 통해 무역의 의미를 이해하고, 국가 간 무역이 발생하는 이유를 탐구한다."]]},{"n":"12","a":"지구촌 사람들","s":[["6사12-01","세계의 인구 분포를 파악하고 여러 국가의 인구 특징을 탐구한다."],["6사12-02","지구촌을 위협하는 다양한 문제들을 파악하고, 지속가능한 미래를 위한 해결 방안을 탐색 한다."]]}]},"과학":{"3~4":[{"n":"01","a":"힘과 우리 생활","s":[["4과01-01","일상생활에서 힘과 관련된 현상에 흥미를 갖고, 물체를 밀거나 당길 때 나타나는 현상을 관찰할 수 있다."],["4과01-02","수평잡기 활동을 통해 물체의 무게를 비교할 수 있다."],["4과01-03","무게를 정확히 비교하기 위해서는 저울이 필요함을 알고, 저울을 사용해 무게를 비교할 수 있다."],["4과01-04","지레, 빗면과 같은 도구를 이용하면 물체를 들어 올릴 때 드는 힘의 크기가 달라짐을 알고, 도구가 일상생활에서 어떻게 쓰이는지 조사하여 공유할 수 있다."]]},{"n":"02","a":"동물의 생활","s":[["4과02-01","여러 가지 동물을 관찰하여 특징에 따라 동물을 분류할 수 있다."],["4과02-02","다양한 환경에 서식하는 동물을 조사하여 동물의 생김새와 생활 방식이 환경과 관련되어 있음을 설명할 수 있다."],["4과02-03","동물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하여 협력적으로 소통할 수 있다."]]},{"n":"03","a":"식물의 생활","s":[["4과03-01","여러 가지 식물을 관찰하여 특징에 따라 식물을 분류할 수 있다."],["4과03-02","다양한 환경에 서식하는 식물을 조사하여 식물의 생김새와 생활 방식이 환경과 관련되어 있음을 설명할 수 있다."],["4과03-03","식물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하여 협력적으로 소통할 수 있다."]]},{"n":"04","a":"생물의 한살이","s":[["4과04-01","동물의 한살이를 직접 관찰하고, 관찰한 내용을 글과 그림으로 표현할 수 있다."],["4과04-02","식물이 자라는 데 필요한 조건을 찾는 실험을 설계하여 수행할 수 있다."],["4과04-03","생물의 한살이 과정을 조사하여 생물에 따라 한살이의 유형이 다양함을 소개하는 자료를 만들어 공유할 수 있다."]]},{"n":"05","a":"물체와 물질","s":[["4과05-01","물체를 이루는 여러 가지 물질의 성질을 비교하고, 물질의 종류에 따라 물체를 분류할 수 있다."],["4과05-02","물질의 세 가지 상태인 고체, 액체, 기체의 성질을 관찰하여 비교할 수 있다."],["4과05-03","다양한 물질의 성질을 이용하여 쓰임새 있는 물체를 설계할 수 있다."]]},{"n":"06","a":"지구와 바다","s":[["4과06-01","지구가 대기로 둘러싸여 있음을 알고, 지구 표면을 구성하는 육지와 바다의 특징을 비교 할 수 있다."],["4과06-02","바닷물의 특징을 육지의 물과 비교하고, 바닷가에서 볼 수 있는 다양한 지형을 조사할 수 있다."],["4과06-03","밀물과 썰물의 차이를 알고, 갯벌의 가치와 보전의 필요성을 설득⋅홍보할 수 있다."]]},{"n":"07","a":"소리의 성질","s":[["4과07-01","여러 가지 물체를 이용하여 소리를 내보고, 소리가 나는 물체는 떨림이 있음을 설명할 수 있다."],["4과07-02","큰 소리와 작은 소리, 높은 소리와 낮은 소리를 구분하고, 세기와 높낮이가 다른 소리를 낼 수 있다."],["4과07-03","여러 가지 물질을 통하여 소리가 전달되는 것을 관찰하고, 소음을 줄이는 방법을 찾아 일상생활에서 실천할 수 있다."]]},{"n":"08","a":"감염병과 건강한 생활","s":[["4과08-01","생활 속 감염병의 사례를 알고, 다양한 질병과 그 위험성에 대해 토의할 수 있다."],["4과08-02","감염병으로부터 안전한 사회에 관심을 가지고, 여러 감염 과정을 통해 생활 습관과 감염병 유행과의 연관성을 설명할 수 있다."],["4과08-03","건강한 생활을 위해 필요한 감염병 예방 수칙을 공유하고, 생활 속에서 실천할 수 있다."]]},{"n":"09","a":"자석의 이용","s":[["4과09-01","자석과 여러 가지 물체를 가까이했을 때 나타나는 현상을 관찰하고, 자석과 자석에 붙는 물체 사이에 작용하는 힘의 특징을 말할 수 있다."],["4과09-02","자석과 자석을 가까이했을 때 나타나는 현상을 관찰하여 그 특징을 자석의 극과 관련지어 설명할 수 있다."],["4과09-03","자석을 이용하여 일상생활을 편리하게 하는 장치를 설계할 수 있다."]]},{"n":"10","a":"물의 상태 변화","s":[["4과10-01","물이 세 가지 상태로 변할 수 있음을 알고, 우리 주변에서 예를 찾을 수 있다."],["4과10-02","물이 얼 때, 얼음이 녹을 때, 물이 증발할 때와 끓을 때, 수증기가 응결할 때의 변화를 관찰할 수 있다."],["4과10-03","물의 상태 변화를 이용하여 물을 얻을 수 있는 장치를 설계하고 만들 수 있다."]]},{"n":"11","a":"땅의 변화","s":[["4과11-01","흐르는 물의 작용과 강 주변 지형의 특징을 관련지을 수 있다."],["4과11-02","화산의 의미와 화산 활동으로 나오는 물질을 알고, 화산 활동을 모형으로 표현할 수 있다."],["4과11-03","화성암을 관찰하고 분류할 수 있다."],["4과11-04","화산 활동과 지진이 우리 생활에 미치는 영향을 조사하여, 대처 방법을 실천할 수 있다."]]},{"n":"12","a":"다양한 생물과 우리 생활","s":[["4과12-01","균류⋅원생생물⋅세균을 관찰하여 특징과 사는 곳을 설명할 수 있다."],["4과12-02","균류⋅원생생물⋅세균이 우리 생활에 미치는 영향을 조사하여 발표할 수 있다."],["4과12-03","우리 생활에 생명과학이 이용되는 사례를 소개하는 자료를 만들어 공유할 수 있다."]]},{"n":"13","a":"밤하늘 관찰","s":[["4과13-01","달의 모양과 표면, 달의 위상변화를 관찰하여 밤하늘 관찰에 흥미를 가질 수 있다."],["4과13-02","태양계 구성원을 알고, 태양과 행성을 조사할 수 있다."],["4과13-03","별의 정의를 알고, 북극성 주변의 별자리를 관찰할 수 있다."]]},{"n":"14","a":"생물과 환경","s":[["4과14-01","생태계의 구성 요소를 조사하여 생물 요소와 비생물 요소로 분류할 수 있다."],["4과14-02","생물 요소들의 먹고 먹히는 관계를 조사하여 먹이그물로 표현할 수 있다."],["4과14-03","인간 활동이 생태계에 미치는 영향을 조사하고, 생태계 보전을 위해 우리가 할 수 있는 일을 토의하여 실천할 수 있다."]]},{"n":"15","a":"여러 가지 기체","s":[["4과15-01","실험을 통해 기체가 무게가 있음을 설명할 수 있다."],["4과15-02","온도나 압력에 따라 기체의 부피가 달라지는 현상을 관찰하고, 우리 주변에서 예를 찾을 수 있다."],["4과15-03","일상생활에서 이용되는 기체의 종류와 성질을 조사하고, 여러 가지 기체에 대해 흥미를 느낄 수 있다."],["4과15-04","기체의 성질을 이용하여 작동시킬 수 있는 장치를 설계하고 만들 수 있다."]]},{"n":"16","a":"기후변화와 우리 생활","s":[["4과16-01","기후변화 현상의 예를 알고, 기후변화가 인간의 활동과 관련되어 있음을 토의할 수 있다."],["4과16-02","기후변화의 심각성에 관심을 가지고, 기후변화가 우리 생활과 환경에 미치는 영향을 설 명할 수 있다."],["4과16-03","기후변화 대응 방법을 조사하고, 생활 속에서 기후변화 대응 방법을 실천할 수 있다."]]}],"5~6":[{"n":"01","a":"지층과 화석","s":[["6과01-01","지층의 특징을 알고, 지층의 형성 과정을 모형으로 표현할 수 있다."],["6과01-02","지층이 퇴적암으로 이루어짐을 알고, 퇴적암을 알갱이의 크기에 따라 분류할 수 있다."],["6과01-03","화석의 생성 과정을 모형으로 설명하고, 지구의 과거 생물과 환경을 추리하는 활동을 통해 화석의 가치를 인식할 수 있다."]]},{"n":"02","a":"빛의 성질","s":[["6과02-01","물체를 보기 위해서 빛이 있어야 함을 알고, 빛의 성질에 대해 흥미를 느낄 수 있다."],["6과02-02","빛이 나아가는 현상을 관찰하여 빛이 직진, 반사, 굴절하는 성질이 있음을 말할 수 있다."],["6과02-03","거울과 렌즈의 쓰임새를 조사하고 거울이나 렌즈를 이용한 장치를 창의적으로 만들 수 있다."]]},{"n":"03","a":"용해와 용액","s":[["6과03-01","용해 현상의 의미를 알고, 용질의 종류와 물의 온도에 따라 물에 녹는 용질의 양이 달라 짐을 비교할 수 있다."],["6과03-02","용질이나 용매의 양에 따라 용액의 진하기가 달라짐을 관찰하고, 용액의 상대적인 진하 기를 비교할 수 있다."],["6과03-03","일상생활에서 용액이 쓰이는 사례를 조사하여 용액의 필요성을 알리는 자료를 만들고 공 유할 수 있다."]]},{"n":"04","a":"우리 몸의 구조와 기능","s":[["6과04-01","뼈와 근육의 생김새를 관찰하고 모형을 만들어 몸이 움직이는 원리를 설명할 수 있다."],["6과04-02","소화, 순환, 호흡, 배설 기관의 구조와 기능을 알아보고, 우리 몸의 여러 기관이 서로 관 련되어 있음을 설명할 수 있다."],["6과04-03","우리 몸의 여러 기관과 관련된 질병을 조사하고, 건강을 유지하기 위한 생활 방식을 실 천할 수 있다."]]},{"n":"05","a":"혼합물의 분리","s":[["6과05-01","알갱이의 크기가 다른 고체 혼합물과 골고루 섞이지 않는 액체 혼합물을 분리할 수 있다."],["6과05-02","물에 용해되는 성질을 이용하여 고체 혼합물을 분리하고, 물을 증발시켜 물에 용해된 고체 물질을 분리할 수 있다."],["6과05-03","지속가능한 삶을 위한 과학기술 사례 중 혼합물의 분리를 이용한 장치를 조사하여 공유 할 수 있다."]]},{"n":"06","a":"날씨와 우리 생활","s":[["6과06-01","기상 요소를 조사하고, 날씨가 우리 생활에 주는 영향을 인식할 수 있다."],["6과06-02","구름에서 비와 눈이 내리는 과정을 다루지 않고 현상을 중심으로 다루며, 단열 팽창과 관련된 구름의 생성 과정은 다루지 않는다."],["6과06-03","고기압과 저기압의 분포에 따른 날씨의 특징을 기상 요소로 표현할 수 있다."]]},{"n":"07","a":"열과 우리 생활","s":[["6과07-01","물체의 따뜻하고 차가운 정도를 온도로 표현함을 알고, 온도계를 이용하여 온도를 측정 할 수 있다."],["6과07-02","온도가 다른 두 물체가 접촉했을 때 두 물체의 온도 변화를 관찰하고 그 원인을 추리할 수 있다."],["6과07-03","주위에서 열의 이동으로 나타나는 현상을 관찰하여 열의 이동 방식이 다양함을 설명할 수 있다."],["6과07-04","일상생활에서 단열을 이용하는 사례를 조사하고, 온도를 오랫동안 일정하게 유지할 수 있는 장치를 창의적으로 만들 수 있다."]]},{"n":"08","a":"자원과 에너지","s":[["6과08-01","우리가 생활에서 이용하는 다양한 자원을 조사하고, 자원의 유한함을 설명할 수 있다."],["6과08-02","재생에너지의 종류를 조사하고, 에너지를 지속가능하게 이용하는 방법에 관심을 갖는다."],["6과08-03","자원과 에너지의 효율적인 이용 방법에 대해 탐색하고, 생활 속에서 실천할 수 있는 다 양한 사례를 공유할 수 있다."]]},{"n":"09","a":"산과 염기","s":[["6과09-01","여러 가지 용액에 지시약을 넣었을 때의 변화를 관찰하여 용액을 산성 용액과 염기성 용 액으로 분류할 수 있다."],["6과09-02","산성 용액과 염기성 용액의 성질을 관찰하고, 산성 용액과 염기성 용액을 섞을 때 용액 의 성질 변화를 실험을 통해 추론할 수 있다."],["6과09-03","우리 주변에서 산성 용액과 염기성 용액을 이용하는 예를 찾아서 설명할 수 있다."],["6과09-04","산성화로 인한 환경의 피해 사례를 소개하는 자료를 만들고 공유할 수 있다."]]},{"n":"10","a":"물체의 운동","s":[["6과10-01","운동하는 물체는 시간에 따라 위치가 변화함을 알고 그 변화를 표현할 수 있다."],["6과10-02","물체의 이동 거리와 걸린 시간을 측정하여 속력을 구하고 빠르기를 비교할 수 있다."],["6과10-03","속력과 관련된 안전 수칙과 안전장치를 조사한 결과를 공유하고 일상생활에서 교통안전을 실천할 수 있다."]]},{"n":"11","a":"식물의 구조와 기능","s":[["6과11-01","생물을 이루고 있는 기본 단위인 세포를 현미경으로 관찰할 수 있다."],["6과11-02","식물의 각 기관의 구조를 관찰하고, 기능을 알아보는 실험을 수행하여 식물 각 기관의 구조와 기능을 설명할 수 있다."],["6과11-03","여러 가지 식물의 특징을 설명하는 자료를 만들어 공유할 수 있다."]]},{"n":"12","a":"지구의 운동","s":[["6과12-01","하루 동안 태양과 별을 관찰하여 위치 변화의 규칙성을 찾을 수 있다."],["6과12-02","지구의 자전을 알고, 낮과 밤이 생기는 이유를 설명할 수 있다."],["6과12-03","지구의 공전을 알고, 계절에 따라 달라지는 별자리를 관찰할 수 있다."]]},{"n":"13","a":"계절의 변화","s":[["6과13-01","태양 고도 측정기로 하루 동안 태양 고도, 그림자 길이, 기온을 측정하여 이들의 관계를 찾을 수 있다."],["6과13-02","계절에 따른 태양의 남중 고도와 낮의 길이 사이의 관계를 자료에 근거하여 추론할 수 있다."],["6과13-03","계절 변화의 원인을 지구의 자전축이 기울어진 채 공전하는 것으로 설명할 수 있다."]]},{"n":"14","a":"물질의 연소","s":[["6과14-01","물질의 성질이 달라지는 변화와 달라지지 않는 변화를 관찰하여 비교할 수 있다."],["6과14-02","물질이 연소할 때 나타나는 공통적인 현상을 관찰하고, 연소의 조건을 찾을 수 있다."],["6과14-03","연소 전과 후의 물질을 비교하여 연소 과정에서 물질의 성질이 달라짐을 설명할 수 있다."],["6과14-04","연소 과정에서 생성되는 물질로 인한 생태계의 피해 사례를 수집하고 분석하여 해결책을 제안하고 공유할 수 있다."]]},{"n":"15","a":"전기의 이용","s":[["6과15-01","전지와 전구, 전선을 연결하여 전구에 불을 켜보고, 불이 켜지는 전기 회로의 특징을 말 할 수 있다."],["6과15-02","전지 한 개를 연결한 전기 회로와 전지 두 개를 직렬연결한 전기 회로의 특징을 비교할 수 있다."],["6과15-03","전자석을 만들어 전자석의 성질을 탐색하고 전자석이 사용되는 예를 조사할 수 있다."],["6과15-04","전기를 효율적이고 안전하게 사용하는 방법을 조사하여 실천 계획을 세우고 일상생활에서 실천할 수 있다."]]},{"n":"16","a":"과학과 나의 진로","s":[["6과16-01","미래 사회에 일어날 수 있는 문제를 조사하고, 문제를 해결하는 데 과학이 기여할 수 있는 방법을 토의할 수 있다."],["6과16-02","다양한 진로가 과학과 관련됨을 알고, 자신의 진로를 과학과 관련지어 설명할 수 있다."]]}]},"도덕":{"3~4":[{"n":"01","a":"자신과의 관계","s":[["4도01-01","자신의 감정을 소중히 여기며 존중하는 태도를 바탕으로 내가 누구인가를 탐구한다."],["4도01-02","정직의 의미를 알고 모범적인 사례를 탐색하여 바르게 행동하려는 태도를 기른다."],["4도01-03","성실한 생활의 모범 사례를 탐색하고 시간 관리를 위한 생활을 계획하여 지속적인 자기 성장을 모색한다."],["4도01-04","다른 사람의 관점을 수용할 수 있는지를 도덕적으로 검토하고 도덕규범을 내면화하여 도덕적으로 행동할 수 있는 자세를 기른다."]]},{"n":"02","a":"타인과의 관계","s":[["4도02-01","효, 우애의 의미와 필요성을 명료하게 이해하고 가족의 행복을 위해 할 수 있는 일을 탐색 하여 실천 계획을 세운다."],["4도02-02","친구 사이의 배려에 대한 올바른 이해를 바탕으로 일상생활에서 배려에 기반한 도덕적 관계를 맺을 수 있는 방안을 탐색한다."],["4도02-03","공감의 태도가 필요한 이유를 이해하고 도덕적 상상력을 바탕으로 대상과 상황에 따라 감정을 나누는 방법을 탐구하여 실천한다."]]},{"n":"03","a":"사회 · 공동체와의 관계","s":[["4도03-01","불공정의 사례를 탐구하고, 일상생활에서 공정의 가치를 추구하는 활동을 통해 실천 의지를 함양한다."],["4도03-02","디지털 사회에서 발생하는 다양한 문제를 살펴보고, 해결 방안을 탐구하여 정보통신 윤리에 대한 민감성을 기른다."],["4도03-03","통일의 필요성을 이해하고, 통일 감수성을 길러 바람직한 통일의 방향을 모색한다."]]},{"n":"04","a":"자연과의 관계","s":[["4도04-01","생명 경시 사례를 조사하고 문제 해결 방법을 탐구함으로써 생명의 소중함을 이해한다."],["4도04-02","인간과 자연이 함께 살아야 하는 이유를 이해하고 공생을 위한 구체적인 실천 계획을 세우며 생태 감수성을 기른다."]]}],"5~6":[{"n":"01","a":"자신과의 관계","s":[["6도01-01","자주적인 삶에 대한 이해를 바탕으로 자신의 생활계획을 세우고 실천하여 주체적인 삶의 태도를 기른다."],["6도01-02","생활 습관에 대한 성찰을 통해 자기 생활을 점검하고 올바른 계획을 세워 이를 실천한다."],["6도01-03","자기가 하고 싶은 일을 선택할 때 도덕적 고려의 필요성을 알고 자신의 특기와 적성을 탐색하여 진로계획을 수립한다."]]},{"n":"02","a":"타인과의 관계","s":[["6도02-01","봉사의 의미와 중요성을 이해하고, 타인이 처한 상황과 환경에 대한 주의 깊은 관심을 바탕으로 봉사를 실천한다."],["6도02-02","편견이 발생하는 이유를 탐색하여 해결 방안을 살펴보고, 다양성 존중을 바탕으로 다른 사람과 올바른 관계를 맺기 위한 실천 방안을 탐구한다."],["6도02-03","인간과 인공지능 로봇 간의 다양한 관계를 파악하고 도덕에 기반을 둔 관계 형성의 필요 성을 탐구한다."]]},{"n":"03","a":"사회 · 공동체와의 관계","s":[["6도03-01","인권과 관련된 다양한 사례를 살펴보고 인권에 관한 감수성을 길러 이를 실천하려는 의지를 함양한다."],["6도03-02","정의에 관한 관심을 토대로 공동체 규칙의 중요성을 살펴보고 직접 공정한 규칙을 고안 하며 기초적인 시민의식을 기른다."],["6도03-03","통일과정과 통일 이후 사회의 여러 가지 상황을 예상하고 바람직한 통일과정과 통일 국가의 사회상을 제시한다"],["6도03-04","다른 나라 사람들이 처한 여러 가지 상황을 종합적으로 이해하고 해결 방안을 탐구하며 인류애를 기른다."]]},{"n":"04","a":"자연과의 관계","s":[["6도04-01","지구의 환경 위기 상황을 이해하고, 이를 극복하기 위한 다양한 방안을 찾아 자신의 일 상에서 실천하고자 노력한다."],["6도04-02","지속가능한 삶의 의미를 탐구하고 미래 세대에 대한 책임을 강화하여 자연의 다양성을 존중하고 생산성을 유지할 수 있는 미래를 위한 실천 방안을 찾는다."]]}]},"체육":{"3~4":[{"n":"01","a":"운동","s":[["4체01-01","운동과 체력의 의미를 이해하고 관계를 파악한다."],["4체01-02","기본 체력운동의 방법과 절차를 익히며 자신의 수준에 맞는 운동을 시도한다."],["4체01-03","운동과 건강의 의미를 이해하고 관계를 파악한다."],["4체01-04","건강을 위한 바른 생활 습관을 이해하고 생활 속에서 규칙적으로 실천한다."],["4체01-05","자신의 신체적 특징을 긍정적으로 인식하고 운동 계획을 세워 안전하게 활동한다."],["4체01-06","운동과 건강한 생활 습관 형성에 관심을 갖고 적극적으로 실천한다."]]},{"n":"02","a":"스포츠","s":[["4체02-01","스포츠의 의미와 유형을 파악한다."],["4체02-02","기본 움직임 기술의 의미와 종류를 이해하고 스포츠와의 관계를 파악한다."],["4체02-03","움직임 요소에 따른 기본 움직임 기술의 수행 방법을 파악하고 시도한다."],["4체02-04","기본 움직임 기술을 연결한 복합적인 움직임 기술을 파악하고 시도한다."],["4체02-05","기술형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다."],["4체02-06","전략형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다."],["4체02-07","생태형 스포츠에 적합한 기본 움직임 기술을 파악하고 시도한다."],["4체02-08","움직임 기술 수행에 자신감을 갖고 적극적으로 시도한다."],["4체02-09","게임 활동에 최선을 다하고 규칙을 지킨다."],["4체02-10","다양한 스포츠 환경에 개방적인 태도를 갖고 적극적이고 안전하게 스포츠 활동에 참여 한다."]]},{"n":"03","a":"표현","s":[["4체03-01","표현 활동의 의미와 기본 움직임 기술과의 관계를 파악한다."],["4체03-02","움직임 요소에 따른 기본 움직임 기술의 표현 방법을 파악하고 시도한다."],["4체03-03","기본 움직임 기술을 활용하여 사물이나 자연을 모방하여 표현한다."],["4체03-04","기본 움직임 기술을 활용하여 느낌이나 생각을 표현한다."],["4체03-05","기본 움직임 기술을 리듬에 맞춰 표현한다."],["4체03-06","기본 움직임 기술을 도구를 활용하여 표현한다."],["4체03-07","움직임의 심미적 표현에 대한 호기심과 감수성을 나타낸다."]]}],"5~6":[{"n":"01","a":"운동","s":[["6체01-01","건강 체력과 운동 체력의 의미와 요소를 파악하고 다양한 운동 방법을 탐색한다."],["6체01-02","건강 체력과 운동 체력을 측정하고 자신의 체력 수준에 맞는 운동을 시도한다."],["6체01-03","성장 발달의 의미와 특성을 이해하고 운동과의 관계를 파악한다."],["6체01-04","운동 및 생활 속 위험 상황, 성장 발달을 저해하는 생활 방식의 문제점을 파악하고 예방 및 대처 방법을 익혀 안전하게 활동한다."],["6체01-05","체력 운동을 끈기 있게 규칙적으로 수행한다."],["6체01-06","성장과 발달 과정에서 나타나는 신체적, 정서적, 사회적 특성과 차이를 공감하고 위험 상황에 침착하게 대처한다."]]},{"n":"02","a":"스포츠","s":[["6체02-01","기술형 스포츠의 의미와 유형을 파악한다."],["6체02-02","기술형 스포츠 유형별로 기본 움직임 기술을 응용한 기본 기능을 파악하고 수행한다."],["6체02-03","기술형 스포츠 유형별 활동 방법을 파악하고 기본 전략을 게임 활동에서 수행한다."],["6체02-04","전략형 스포츠의 의미와 유형을 파악한다."],["6체02-05","전략형 스포츠 유형별로 기본 움직임 기술을 응용한 기본 기능을 파악하고 수행한다."],["6체02-06","전략형 스포츠 유형별 활동 방법을 파악하고 기본 전략을 게임 활동에서 수행한다."],["6체02-07","생태형 스포츠의 의미와 유형을 파악한다."],["6체02-08","생태형 스포츠 유형별로 기본 움직임 기술을 응용한 기본 기능을 파악하고 수행한다."],["6체02-09","생태형 스포츠 유형별 활동 방법을 파악하고 기본 전략을 게임 활동에서 수행한다."],["6체02-10","스포츠 활동에 참여하며 목표를 달성하기 위한 의지를 실천하고 상대의 기술을 인정한다."],["6체02-11","스포츠 활동에 참여하며 팀원과 협력하고 구성원을 배려한다."],["6체02-12","스포츠 활동에 참여하며 환경을 아끼고 감사하는 태도를 실천한다."]]},{"n":"03","a":"표현","s":[["6체03-01","표현 활동의 의미와 유형을 파악한다."],["6체03-02","스포츠 표현에서 움직임 기술을 응용한 기본 동작을 파악하고 표현한다."],["6체03-03","스포츠 표현의 기본 동작을 다양하게 구성하여 발표하고 감상한다."],["6체03-04","전통 표현에서 움직임 기술을 응용한 기본 동작을 파악하고 표현한다."],["6체03-05","전통 표현의 기본 동작을 다양하게 구성하여 발표하고 감상한다."],["6체03-06","현대 표현에서 움직임 기술을 응용한 기본 동작을 파악하고 표현한다."],["6체03-07","현대 표현의 기본 동작을 다양하게 구성하여 발표하고 감상한다."],["6체03-08","다양한 표현 활동 유형을 수용하고, 움직임 표현의 아름다움을 추구한다."]]}]},"음악":{"3~4":[{"n":"01","a":"연주","s":[["4음01-01","바른 자세와 주법을 익혀 노래 부르거나 악기로 연주한다."],["4음01-02","기초적인 음악 요소를 살려 노래 부르거나 악기로 연주하고 느낌을 이야기한다."],["4음01-03","노래와 악기 연주에 어울리는 신체표현이나 놀이를 하며 음악을 즐긴다."],["4음01-04","생활 속에서 음악을 경험하며 연주에 관심을 가지고 참여한다."]]},{"n":"02","a":"감상","s":[["4음02-01","음악을 듣고 기초적인 음악 요소를 탐색하며 반응한다."],["4음02-02","다양한 음악을 듣고 음악적 특징을 발견한다."],["4음02-03","다양한 종류의 음악을 듣고 음악의 분위기를 묘사하거나 쓰임을 이야기한다."],["4음02-04","생활 속에서 음악을 들으며 느낌과 호기심을 갖고 즐긴다."],["4음02-05","우리 지역의 음악 문화유산을 찾아 듣고 국악을 즐기는 태도를 갖는다."]]},{"n":"03","a":"창작","s":[["4음03-01","느낌과 상상을 즉흥적으로 표현하며 음악에 대한 흥미를 갖는다."],["4음03-02","악곡의 일부를 바꾸어 표현하고 간단한 악보로 나타낸다."],["4음03-03","기초적인 음악 요소를 활용하여 소리나 음악으로 표현한다."],["4음03-04","생활 주변의 소리나 장면을 모방하며 음악의 새로움을 즐기는 태도를 갖는다."]]}],"5~6":[{"n":"01","a":"연주","s":[["6음01-01","바른 주법과 표현 기법을 익혀 노래나 악기로 느낌을 담아 연주한다."],["6음01-02","음악 요소를 살려 노래나 악기로 발표하고 과정을 돌아본다."],["6음01-03","소리의 어울림을 생각하며 다양한 방법으로 함께 표현한다."],["6음01-04","간단한 형태의 연주를 준비하여 생활 속 음악 활동에 참여한다."]]},{"n":"02","a":"감상","s":[["6음02-01","음악을 듣고 음악의 요소를 감지하며 구별한다."],["6음02-02","다양한 문화권의 음악을 듣고 음악적 특징과 음악의 간단한 구성을 인식한다."],["6음02-03","다양한 종류의 음악을 듣고 음악의 배경과 활용을 설명한다."],["6음02-04","생활 속에서 음악을 찾아 들으며 아름다움을 느끼고 공감한다."],["6음02-05","우리나라 음악 문화유산을 찾아 듣고 국악의 가치를 인식한다."]]},{"n":"03","a":"창작","s":[["6음03-01","느낌과 아이디어를 떠올려 여러 매체나 방법으로 자신감 있게 표현한다."],["6음03-02","기초적인 기보를 활용하여 간단한 조건에 따라 악곡의 일부를 바꾼다."],["6음03-03","음악의 요소를 활용하여 간단한 음악을 만든다."],["6음03-04","생활 주변 상황이나 이야기를 활용하여 음악을 만들며 열린 태도를 갖는다."]]}]},"미술":{"3~4":[{"n":"01","a":"체험","s":[["4미01-01","자연물과 인공물을 탐색하는 데 다양한 감각을 활용할 수 있다."],["4미01-02","주변 대상을 체험하며 떠오른 느낌과 생각을 다양한 방법으로 나타낼 수 있다."],["4미01-03","미적 탐색에 호기심을 갖고 참여하며 자신의 감각으로 대상의 특징을 이해할 수 있다."],["4미01-04","생활 속에서 활용되는 미술에 관심을 가지고 미술의 특징과 역할을 발견할 수 있다."]]},{"n":"02","a":"표현","s":[["4미02-01","관찰과 상상으로 아이디어를 떠올려 표현 주제를 구체화할 수 있다."],["4미02-02","기본적인 표현 재료와 용구의 특성을 이해하고 사용 방법을 익힐 수 있다."],["4미02-03","조형 요소의 특징을 자유롭게 탐색하며 주제 표현에 알맞게 활용할 수 있다."],["4미02-04","표현 의도를 가지고 작품을 제작하며 자기 작품을 소중히 여길 수 있다."],["4미02-05","미술과 타 교과를 관련지어 주제를 표현하는데 흥미를 가질 수 있다."]]},{"n":"03","a":"감상","s":[["4미03-01","미술 작품을 자세히 보고 작품과 미술가에 관해 질문할 수 있다."],["4미03-02","미술 작품의 특징과 작품에 관한 자신의 느낌과 생각을 설명할 수 있다."],["4미03-03","미술 문화에 관심을 가지고 전시 및 행사에 참여할 수 있다."],["4미03-04","작품 감상에 흥미를 가지고 참여하며 작품에 대한 자신의 감상 관점을 존중할 수 있다."]]}],"5~6":[{"n":"01","a":"체험","s":[["6미01-01","다양한 감각과 매체를 활용하여 자신과 대상을 탐색할 수 있다."],["6미01-02","자신이나 주변 환경에서 찾은 감각적 특징, 느낌, 생각 등을 관련지어 나타낼 수 있다."],["6미01-03","주변 환경에 대한 민감한 태도로 대상과 상호 작용하며 새로운 의미를 발견할 수 있다."],["6미01-04","이미지가 나타내는 의미를 비판적으로 이해하고 느낌과 생각을 전달하는 데 활용할 수 있다."]]},{"n":"02","a":"표현","s":[["6미02-01","다양한 방법으로 아이디어를 연결하여 확장된 표현 주제로 발전시킬 수 있다."],["6미02-02","디지털 매체 등 다양한 표현 재료와 용구를 탐색하여 작품 제작에 활용할 수 있다."],["6미02-03","조형 요소의 어울림을 통해 조형 원리를 이해하고 주제 표현에 연결할 수 있다."],["6미02-04","주제 표현에 의지를 갖고 표현 과정을 돌아보며 작품을 발전시킬 수 있다."],["6미02-05","미술과 타 교과의 내용과 방법을 융합하는 활동을 자유롭게 시도할 수 있다."]]},{"n":"03","a":"감상","s":[["6미03-01","미술 작품을 작품이 만들어진 시대적, 지역적 배경 등과 연결하여 이해할 수 있다."],["6미03-02","미술 작품의 내용(소재, 주제 등)과 형식(재료와 용구, 표현 방법, 조형 요소와 원리 등) 을 분석하여 작품의 특징을 설명할 수 있다."],["6미03-03","공동체의 미술 문화 활동에 관심을 가지고 참여하며 경험을 공유할 수 있다."],["6미03-04","다양한 방법을 활용하여 작품을 감상하며 작품에 관한 서로 다른 관점을 존중할 수 있다."]]}]},"영어":{"3~4":[{"n":"01","a":"이해","s":[["4영01-01","알파벳과 쉽고 간단한 단어의 소리를 듣고 식별한다."],["4영01-02","알파벳 대소문자를 식별하여 읽는다."],["4영01-03","쉽고 간단한 단어, 어구, 문장을 듣고 강세, 리듬, 억양을 식별한다."],["4영01-04","소리와 철자의 관계를 이해하며 쉽고 간단한 단어, 어구, 문장을 소리 내어 읽는다."],["4영01-05","쉽고 간단한 단어, 어구, 문장의 의미를 이해한다."],["4영01-06","자기 주변 주제에 관한 담화의 주요 정보를 파악한다."],["4영01-07","적절한 전략을 활용하여 담화나 문장을 듣거나 읽는다."],["4영01-08","다양한 매체로 표현된 담화나 문장을 흥미를 가지고 듣거나 읽는다."],["4영01-09","시, 노래, 이야기를 공감하며 듣는다."],["4영01-10","자기 주변 주제나 문화에 관한 담화나 문장을 존중의 태도로 듣거나 읽는다."]]},{"n":"02","a":"표현","s":[["4영02-01","쉽고 간단한 단어, 어구, 문장을 강세, 리듬, 억양에 맞게 따라 말한다."],["4영02-02","알파벳 대소문자를 구별하여 쓴다."],["4영02-03","소리와 철자의 관계를 바탕으로 쉽고 간단한 단어를 쓴다."],["4영02-04","실물, 그림, 동작 등을 보고 쉽고 간단한 문장으로 말하거나 단어나 어구를 쓴다."],["4영02-05","자신, 주변 사람이나 사물의 소개나 묘사를 쉽고 간단한 문장으로 말하거나 보고 쓴다."],["4영02-06","행동 지시를 쉽고 간단한 문장으로 말하거나 보고 쓴다."],["4영02-07","자신의 감정을 쉽고 간단한 문장으로 말하거나 보고 쓴다."],["4영02-08","자기 주변 주제에 관한 담화의 주요 정보를 묻거나 답한다."],["4영02-09","적절한 매체나 전략을 활용하여 창의적으로 의미를 표현한다."],["4영02-10","의사소통 활동에 흥미와 자신감을 가지고 대화 예절을 지키며 참여한다."]]}],"5~6":[{"n":"01","a":"이해","s":[["6영01-01","간단한 단어, 어구, 문장을 듣고 강세, 리듬, 억양을 식별한다."],["6영01-02","간단한 단어, 어구, 문장을 강세, 리듬, 억양에 맞게 소리 내어 읽는다."],["6영01-03","간단한 단어, 어구, 문장의 의미를 이해한다."],["6영01-04","일상생활 주제에 관한 담화나 글의 세부 정보를 파악한다."],["6영01-05","일상생활 주제에 관한 담화나 글의 중심 내용을 파악한다."],["6영01-06","일상생활 주제에 관한 담화나 글에서 일이나 사건의 순서를 파악한다."],["6영01-07","적절한 전략을 활용하여 일상생활 주제에 관한 담화나 글을 듣거나 읽는다."],["6영01-08","다양한 매체로 표현된 담화나 글을 흥미와 자신감을 가지고 듣거나 읽는다."],["6영01-09","시, 노래, 이야기를 공감하며 듣거나 읽는다."],["6영01-10","일상생활 주제나 문화에 관한 담화나 글을 포용의 태도로 듣거나 읽는다."]]},{"n":"02","a":"표현","s":[["6영02-01","간단한 단어, 어구, 문장을 강세, 리듬, 억양에 맞게 말한다."],["6영02-02","실물, 그림, 동작 등을 보고 간단한 단어, 어구, 문장으로 말하거나 쓴다."],["6영02-03","알파벳 대소문자와 문장 부호를 문장에서 바르게 사용한다."],["6영02-04","주변 사람이나 사물을 간단한 문장으로 소개하거나 묘사한다."],["6영02-05","주변 장소나 위치, 행동 순서나 방법을 간단한 문장으로 설명한다."],["6영02-06","자신의 감정이나 의견, 경험이나 계획을 간단한 문장으로 표현한다."],["6영02-07","일상생활 주제에 관한 담화나 글의 세부 정보를 간단한 문장으로 묻거나 답한다."],["6영02-08","예시문을 참고하여 목적에 맞는 간단한 글을 쓴다."],["6영02-09","적절한 매체와 전략을 활용하여 창의적으로 의미를 생성하고 표현한다."],["6영02-10","의사소통 활동에 흥미와 자신감을 가지고 참여하여 협력적으로 수행한다."]]}]},"실과":{"5~6":[{"n":"01","a":"인간 발달과 주도적 삶","s":[["6실01-01","아동기의 발달 특징을 이해하고 성장발달에 필요한 조건과 방법을 탐색한다."],["6실01-02","건강한 발달을 위한 자기 관리 방법을 탐색하고, 일상생활 속에서 올바른 생활습관과 태도를 갖도록 계획하여 실천한다."],["6실01-03","건강한 가정생활을 위해 가족원 모두에게 다양한 요구가 있음을 이해하여 서로에 대한 배려와 돌봄을 실천한다."],["6실01-04","균형 잡힌 식사의 중요성과 조건을 탐색하여 자신의 식습관을 검토해 보고 건강한 식습관 형성에 적용한다."],["6실01-05","옷의 기능을 이해하여 평소 자신의 옷차림을 살펴보고 건강하고 적절한 옷 입기를 실천한다."],["6실01-06","가정일을 수행하는 과정에서 일의 가치와 중요성을 이해하고, 가정생활을 유지하는 데 필요한 가정일의 종류를 탐색한다."],["6실01-07","직업의 필요성을 이해하고 적성, 흥미, 성격에 따라 진로 발달 계획을 세우고 주도적으로 탐색한다."]]},{"n":"02","a":"생활환경과 지속가능한 선택","s":[["6실02-01","시간이나 용돈과 같은 생활자원이 제한되어 있음을 이해하고, 생활자원의 사용가치를 높 이는 방법을 탐색한다."],["6실02-02","생활자원 관리의 필요성을 인식하고, 생활자원의 합리적인 보관과 활용방법을 익힌다."],["6실02-03","생활자원의 올바른 사용이 가정과 환경에 도움이 됨을 이해하고 재활용, 재사용 등 환경을 고려한 관리 방법을 실천한다."],["6실02-04","식재료 생산과 선택의 중요성을 인식하고 여러 식재료의 고유하고 다양한 맛을 경험하여 자신의 식사에 적용한다."],["6실02-05","음식의 조리과정을 체험하여 자기 간식이나 식사를 스스로 마련하는 식생활을 실천한다."],["6실02-06","우리나라 밥상차림을 이해하고, 함께 식사하는 즐거움을 경험하면서 이 과정에서 식사 예절을 실천한다."],["6실02-07","의생활 용품이 만들어지는 과정을 탐색하여 옷이나 생활용품이 어떻게 구성되는지를 설명 한다."],["6실02-08","다양한 도구와 재료를 활용하여 간단한 생활용품을 만들어 보면서 직접 만들어 쓰는 즐거움과 창의적 태도를 가진다."],["6실02-09","간단한 옷의 수선 등 의생활과 관련된 문제를 스스로 해결하려는 태도를 가진다."],["6실02-10","자신의 생활공간을 쾌적하고 위생적으로 관리하는 것의 중요성을 알고, 정리정돈과 청소 및 쓰레기 처리의 방법을 익혀 실천한다."],["6실02-11","생태 지향적 삶을 위해 자신의 의식주 생활에서 할 수 있는 구체적인 행동을 계획하여 실천한다."]]},{"n":"03","a":"기술적 문제해결과 혁신","s":[["6실03-01","발명의 의미를 이해하고, 일상생활을 바꾼 발명품을 탐색하여 발명과 기술에 대한 중요성과 가치를 인식한다."],["6실03-02","발명사고기법과 기술적 문제 해결 과정을 이해하고, 다양한 재료를 활용하여 생활 속 문제를 해결할 수 있는 창의적인 제품을 구상하고 만들어 봄으로써 실천적 태도를 갖는다."],["6실03-03","발명과 특허의 관계를 이해하고, 특허 침해 사례를 통하여 지식재산권의 중요성을 인식 하여 올바른 방법으로 활용한다."],["6실03-04","수송의 의미와 수송 수단의 발달과정에 대한 이해를 바탕으로 생활 속 다양한 수송 수단을 탐색한다."],["6실03-05","수송 수단의 구성 요소를 이해하고, 친환경 에너지를 적용한 다양한 수송 수단의 시제품을 만들어 수송기술의 가치를 인식한다."]]},{"n":"04","a":"지속가능한 기술과 융합","s":[["6실04-01","친환경 건설 구조물을 이해하고, 생활 속 건설 구조물을 탐색하여 간단한 구조물을 체험 하면서 건설기술에 대한 가치를 인식한다."],["6실04-02","생활 속 디지털 기술의 중요성을 이해하고, 디지털 기기와 디지털 콘텐츠 저작 도구를 사용하여 발표 자료를 만들어 보면서 디지털 기기의 활용 능력을 기른다."],["6실04-03","제작한 발표 자료를 사이버 공간에 공유하고, 건전한 정보기기의 활용을 실천한다."],["6실04-04","로봇의 개념과 구조를 이해하고, 생활 속 로봇 기능을 체험하여 로봇의 중요성을 인식한다."],["6실04-05","로봇의 종류와 활용 사례를 통해 작동 원리를 이해하고, 로봇에 대한 관심과 흥미를 가진다."],["6실04-06","로봇의 융합 기술을 이해하고, 간단한 로봇을 만들어 코딩과 프로그램을 적용하여 동작시키는 체험을 통해 융합 기술의 가치를 인식한다."],["6실04-07","생활 속 동식물 자원을 활용 목적에 따라 분류하고 이와 관련된 다양한 생명기술을 탐색 한다."],["6실04-08","생활 속 동식물을 기르고 가꾸는 방법을 알고, 동식물을 기르고 가꾸는 체험을 통해 생태 존중감을 가진다."],["6실04-09","동식물 자원의 친환경 농업 사례를 통해 지속가능한 농업이 순환되고 있음을 인식하고 농업의 미래가치를 인식한다."],["6실04-10","생활 속에서 농업활동과 관련된 모습을 분석하고 이에 따른 농업활동을 체험하여 농업에 대한 관심을 두고 이를 생활 속에서 실천한다."],["6실04-11","농업과 농촌의 다원적인 역할과 가치를 이해하고 미래 농업과 관련된 다양한 직업 세계를 탐색한다."]]},{"n":"05","a":"디지털 사회와 인공지능","s":[["6실05-01","컴퓨터를 활용한 생활 속 문제해결 사례를 탐색하고 일상생활 속 문제를 해결하기 위한 알고리즘을 다양한 방법으로 표현한다."],["6실05-02","컴퓨터에게 명령하는 방법을 체험하고, 주어진 문제를 해결하는 프로그램을 작성한다."],["6실05-03","실생활의 문제를 해결하는 프로그램을 협력하여 작성하고, 산출물을 타인과 공유한다."],["6실05-04","디지털 데이터와 아날로그 데이터의 특징을 이해하고, 인공지능에 활용할 수 있는 데이터의 유형이나 형태를 탐색한다."],["6실05-05","인공지능이 만들어지는 과정을 체험하고, 인공지능이 사회에 미치는 영향을 탐색한다."]]}]},"통합교과":{"1~2":[{"n":"01","a":"바른 생활 · 우리는 누구로 살아갈까","s":[["2바01-01","학교 생활 습관과 학습 습관을 형성하여 안전하고 건강하게 생활한다."],["2바01-02","나를 이해하고 존중하며 생활한다."],["2바01-03","자신이 속해 있는 가족의 형태를 이해하고, 주변에서 만나는 다양한 형태의 가족을 존중할 수 있도록 안내한다."],["2바01-04","생태환경에서 더불어 살기 위해 노력한다."]]},{"n":"02","a":"바른 생활 · 우리는 어디서 살아갈까","s":[["2바02-01","공동체에서 내가 할 수 있는 일을 찾아보고 실천한다."],["2바02-02","우리나라의 소중함을 알고 사랑하는 마음을 기른다."],["2바02-03","차이나 다양성을 서로 존중하면서 생활한다."],["2바02-04","새로운 활동에 호기심을 갖고 도전한다."]]},{"n":"03","a":"바른 생활 · 우리는 지금 어떻게 살아갈까","s":[["2바03-01","하루의 가치를 느끼며 지금을 소중히 여긴다."],["2바03-02","계절의 변화에 대응하며 생활한다."],["2바03-03","여러 인물의 삶을 통해 공동체성을 기른다."],["2바03-04","공동체 속에서 지속가 /* 1차 이름 일치 → 2차 AREA_GROUP → 3차 실패(missed로 돌려 화면에 알린다) */
function kwOfAreas(subject, areas){
  const blocks = (KW.subj[subject] || {})[band()] || [];
  if(!areas || !areas.length) return {blocks:blocks.slice(0,1), missed:[]};
  const map = AREA_GROUP[subject] || {}, wanted = new Set(), missed = [];
  for(const a of areas){
    const n = normA(a);
    if(blocks.some(b => normA(b.a) === n)){ wanted.add(n); continue; }
    const g = map[n];
    if(g && blocks.some(b => normA(b.a) === normA(g))){ wanted.add(normA(g)); continue; }
    missed.push(a);
  }
  const hit = blocks.filter(b => wanted.has(normA(b.a)));
  return {blocks: hit.length ? hit : blocks, missed};
}

const toks = t => [...new Set(String(t).replace(/[^가-힣\s]/g," ").split(/\s+/)
  .map(w => w.replace(/(을|를|이|가|은|는|에|에서|으로|로|와|과|의|도|만|하며|하고|하여|함|음)$/,""))

/* 공백을 뺀 최장 공통 부분문자열 길이 — 성취기준 베끼기를 잡는 데 쓴다 */
function lcsLen(a, b){
  a = String(a).replace(/\s/g,""); b = String(b).replace(/\s/g,"");
  if(!a || !b) return 0;
  let best = 0, prev = new Array(b.length+1).fill(0);
  for(let i = 1; i <= a.length; i++){
    const cur = new Array(b.length+1).fill(0);
    for(let j = 1; j <= b.length; j++)
      if(a[i-1] === b[j-1]){ cur[j] = prev[j-1] + 1; if(cur[j] > best) best = cur[j]; }
    prev = cur;
  }
  return best;
}
/* 세 서술이 정도 차이만 갖는지 본다. 막지 않는다 — 루브릭은 생기부 문장이 아니다.
   정도의 역전(잘함이 노력요함보다 약하게 읽힘)은 기계가 못 잡는다. 잡는 척하지 않는다. */
const RUB_COPY_MIN = 12;
function rubricLint(rows, stdTexts){
  const out = [], filled = rows.map((r,i) => ({i, level:r.level||`${i+1}수준`, text:(r.text||"").trim()}))
                              .filter(r => r.text);
  for(let a = 0; a < filled.length; a++) for(let b = a+1; b < filled.length; b++){
    const x = filled[a], y = filled[b], pair = `${x.level} · ${y.level}`;
    if(x.text === y.text || x.text.includes(y.text) || y.text.includes(x.text))
      out.push({id:"rub-same", hit:pair, why:"두 수준의 서술이 같습니다. 정도가 다르게 고쳐 주세요"});
    else if(!toks(x.text).some(w => toks(y.text).includes(w)))
      out.push({id:"rub-drift", hit:pair,
                why:"수준끼리 겹치는 낱말이 없습니다 — 같은 행동을 정도만 다르게 쓰는지 확인해 주세요"});
  }
  for(const r of filled){
    if((stdTexts||[]).some(t => lcsLen(r.text, t) >= RUB_COPY_MIN))
      out.push({id:"rub-copy", hit:r.level,
                why:"성취기준 문구가 그대로 들어 있습니다. 수업 장면에서 보이는 모습으로 바꿔 주세요"});
    if((r.text.match(/\./g)||[]).length > 2 || [...r.text].length > 90)
      out.push({id:"rub-long", hit:r.level, why:"한 수준은 한두 문장이면 됩니다"});
  }
  const last = filled[filled.length-1];
  if(last && /(못함|못 함|안 됨|없음|모름|미흡함|부족함)$/.test(last.text) &&
     !/(도움|안내|함께|시도|연습|배우|늘|자라)/.test(last.text))
    out.push({id:"rub-deficit", hit:last.level,
              why:"무엇을 못 하는지 대신, 어떤 도움에서 무엇을 해내는지로 써 주세요"});
  return out;
}

function gauge(done, total){

/* 지운 자리에 남는 쉼표·빈 괄호·겹공백을 정리한다 */
function tidySentence(t){
  return String(t).replace(/\(\s*\)/g, "").replace(/\s*,\s*,/g, ",")
    .replace(/\.\s*,/g, ". ").replace(/,\s*\./g, ".")
    .replace(/\s+([,.])/g, "$1").replace(/([,.])\s*\1+/g, "$1")
    .replace(/([.,])(?=[^\s])/g, "$1 ").replace(/\s{2,}/g, " ")
    .replace(/^[\s,.]+/, "").trim();
}
/* ‘~하였다’ → ‘~하였음’처럼 명사형으로 바꾼다(제안이므로 교사가 확인한다) */
function toNominal(s){
  const m = String(s).match(/^([\s\S]*?)([가-힣]+)다$/);
  if(!m) return null;
  const head = m[1], stem = m[2], last = stem.slice(-1), rest = stem.slice(0,-1);
  const j = last.charCodeAt(0) - 0xAC00;
  if(j < 0 || j > 11171) return null;
  const jong = j % 28;
  if(/[았었였겠]/.test(last)) return head + stem + "음";
  if(last === "는") return head + rest + "음";
  if(jong === 4)  return head + rest + String.fromCharCode(0xAC00 + j - 4 + 16);   // 종성 ㄴ → ㅁ
  if(jong === 0)  return head + rest + String.fromCharCode(0xAC00 + j + 16);       // 받침 없음 → ㅁ
  return head + stem + "음";
}

/* ══ 산출물 보관 ══
   사진은 localStorage(5MB)가 아니라 IndexedDB에 둔다. 넣기 전에 크기를 줄인다. */
const FDB = "trecord.files", FSTORE = "f";
let _fdb = null;
function fdb(){
  return new Promise((ok,no) => {
    if(_fdb) return ok(_fdb);
    if(!window.indexedDB) return no(new Error("이 브라우저는 파일 보관을 지원하지 않습니다."));
    const r = indexedDB.open(FDB, 1);
    r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains(FSTORE)) r.result.createObjectStore(FSTORE); };
    r.onsuccess = () => ok(_fdb = r.result);
    r.onerror = () => no(r.error || new Error("파일 보관함을 열지 못했습니다."));
  });
}
function ftx(mode, fn){
  return fdb().then(db => new Promise((ok,no) => {
    const tx = db.transaction(FSTORE, mode), st = tx.objectStore(FSTORE);
    let out; try{ out = fn(st); }catch(e){ return no(e); }
    tx.oncomplete = () => ok(out && out.result !== undefined ? out.result : out);
    tx.onerror = () => no(tx.error);
  }));
}
const filePut = (id, rec) => ftx("readwrite", st => st.put(rec, id));
const fileGet = id => ftx("readonly", st => st.get(id));

/* 이미지는 긴 변 1600px·품질 0.72로 줄인다. PDF 등은 그대로 둔다. */
async function shrink(file){
  if(!/^image\//.test(file.type) || !window.createImageBitmap) return file;
  try{
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if(sc === 1 && file.size < 400*1024) return file;
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, "image/jpeg", 0.72));
    return (b && b.size < file.size) ? b : file;
  }catch(e){ return file; }
}
const kb = n => n < 1024*1024 ? Math.round(n/1024) + "KB" : (n/1024/1024).toFixed(1) + "MB";

async function aiFetchModels(){
  if(!AI.key && !AI_PROXY) throw new Error("먼저 키를 넣어 주세요.");

  }

    .map(m => String(m.name||"").replace(/^models\//,""))
    .filter(n => /gemini/.test(n) && !/embedding|aqa|vision-latest/.test(n));
  if(!names.length) throw new Error("쓸 수 있는 모델이 없습니다.");
  // 최신(숫자가 큰) 순으로
  names.sort((a,b) => (parseFloat((b.match(/[\d.]+/)||[0])[0]) - parseFloat((a.match(/[\d.]+/)||[0])[0])));

async function aiCall(prompt, opt){
  opt = opt || {};
  if(!AI.key && !AI_PROXY) throw new Error("먼저 AI 연결 탭에서 키를 넣어 주세요.");
  const m = opt.model || AI.model || AI_MODELS[0];
  const cfg = {temperature:0.3, maxOutputTokens:8192};
  if(opt.json) cfg.responseMimeType = "application/json";   // 최신 모델은 생각 토큰을 쓰므로 여유 있게
  let res;
  try{
    res = await fetch(`${aiBase()}/v1beta/models/${m}:generateContent`, {
      method:"POST",
      headers:Object.assign({"Content-Type":"application/json"}, aiHead()),
      body:JSON.stringify({contents:[{parts:[{text:prompt}, ...(opt.parts||[])]}], generationConfig:cfg})
    });
  }catch(e){
    throw new Error("바깥으로 연결하지 못했습니다. 공개 주소(claude.ai)에서 연 페이지는 보안 정책으로 외부 호출이 막혀 있습니다. AI 연결 탭의 안내를 읽어 주세요.");
  }
  if(res.status === 400 || res.status === 401 || res.status === 403) throw new Error(aiShared()
    ? "공용 연결이 요청을 거절했습니다. AI 연결 탭에서 본인 키를 넣으면 이어서 쓸 수 있습니다."
    : "키가 올바르지 않거나 권한이 없습니다. 키를 다시 확인해 주세요.");
  if(res.status === 404) throw new Error(`‘${m}’ 모델을 찾지 못했습니다. AI 연결 탭에서 ‘모델 목록 가져오기’를 눌러 쓸 수 있는 이름을 받아오세요.`);
  if(res.status === 429) throw new Error(aiShared()
    ? "공용 연결이 오늘 한도에 닿았습니다. AI 연결 탭에서 본인 키를 넣으면 바로 이어서 쓸 수 있습니다."
    : "무료 사용 한도를 넘었습니다. 잠시 뒤 다시 시도해 주세요.");
  if(!res.ok) throw new Error("응답을 받지 못했습니다 (" + res.status + ")");
  const j = await res.json();
  const c = j?.candidates?.[0];
  const t = (c?.content?.parts || []).filter(p => !p.thought).map(p => p.text || "").join("");
  if(!t){
    if(c?.finishReason === "MAX_TOKENS") throw new Error("답이 길어 잘렸습니다. 관찰이 아주 많다면 몇 건만 두고 다시 시도해 주세요.");
    if(c?.finishReason === "SAFETY" || j?.promptFeedback?.blockReason) throw new Error("모델이 응답을 거부했습니다. 문장을 조금 바꿔 다시 시도해 주세요.");
    throw new Error("빈 응답이 왔습니다. 다시 시도해 주세요.");
  }
  return t;
}

function looseJSON(raw){
  let s = String(raw).trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(fence) s = fence[1].trim();
  try{ return JSON.parse(s); }catch(e){}
  const start = s.search(/[{[]/);
  if(start < 0) return null;
  let depth = 0, inStr = false, esc2 = false;
  for(let i = start; i < s.length; i++){
    const c = s[i];
    if(inStr){ if(esc2) esc2 = false; else if(c === "\\") esc2 = true; else if(c === '"') inStr = false; continue; }
    if(c === '"') inStr = true;
    else if(c === "{" || c === "[") depth++;
    else if(c === "}" || c === "]"){ depth--;
      if(depth === 0){ try{ return JSON.parse(s.slice(start, i+1)); }catch(e){ return null; } } }
  }
  return null;
}
async function aiJSON(prompt, opt){
  const raw = await aiCall(prompt, Object.assign({json:true}, opt||{}));
  const v = looseJSON(raw);
  if(!v) throw new Error("응답을 이해하지 못했습니다. 다시 시도해 주세요.");
  return v;
}
const AI_RULES = `기재 금지: 대회·경시·수상·입상, 어학시험·자격증·인증시험, 점수·등급·석차(PAPS 제외), 논문·출간·특허, 장학금·기부·해외활동, 국제기구명, 대학·기관·상호·강사명, 부모의 직업이나 지위, 질병명·가정환경. 상표나 앱 실명은 일반명사로 바꾼다. 명사형('~함','~음')으로 끝맺고 학생 이름이나 주어를 쓰지 않는다.`;
const student = id => S.students.find(s => s.id === id);

/* ══ 짚어주기 — 데이터에서 교사가 볼 지점을 찾아 순서대로 ══ */
function pointers(){
  const out = [], sl = slots(), N = S.students.length;
  if(!N) return out;
  const notesBy = id => notesOf(id);

  // 1. 등급 1 위반이 남은 문장
  const bad = [];
  for(const s of S.students) for(const x of sl){
    const d = S.drafts[dkey(s.id,x.key)];
    if(d && d.text.trim() && check(d.text).some(f => f.lv === "block"))
      bad.push({s, x});
  }
  if(bad.length) out.push({sev:"high", title:`기재 금지 표현이 남은 문장 ${bad.length}건`,
    who: bad.slice(0,6).map(b => `${sname(b.s)} ${b.x.label}`).join(" · ") + (bad.length>6?" 외":""),
    go: bad[0]});

  // 2. 관찰이 하나도 없는 학생
  const none = S.students.filter(s => notesBy(s.id).length === 0);
  if(none.length) out.push({sev:"high", title:`관찰이 한 건도 없는 학생 ${none.length}명`,
    who: none.map(sname).join(" · "), go:{s:none[0], x:sl[0]}});

  // 3. 인정 근거 자료가 없는 학생 (직접관찰만)
  const onlyDirect = S.students.filter(s => {
    const ns = notesBy(s.id);
    return ns.length > 0 && !ns.some(n => RECOGNIZED.includes(n.source));
  });
  if(onlyDirect.length) out.push({sev:"mid", title:`근거가 직접관찰뿐인 학생 ${onlyDirect.length}명`,
    who: onlyDirect.map(sname).join(" · ") + " — 수업산출물·자기평가서 등 인정 자료 5종 중 하나를 함께 남겨 두면 좋습니다",
    go:{s:onlyDirect[0], x:sl[0]}});

  // 4. 문장에 관찰에 없는 내용이 많은 경우(과장 위험)
  const risky = [];
  for(const s of S.students) for(const x of sl){
    const d = S.drafts[dkey(s.id,x.key)];
    if(!d || !d.text.trim()) continue;
    const pool = notesOf(s.id, x.key).map(n => n.text).join(" ");
    const words = [...new Set(d.text.replace(/[^가-힣\s]/g," ").split(/\s+/)
                    .map(w => w.replace(/(을|를|이|가|은|는|에|에서|으로|로|와|과|의|도|만|하며|하고|하여|함|음)$/,""))
                    .filter(w => w.length >= 2))];
    if(words.length < 4) continue;
    const miss = words.filter(w => !pool.includes(w));
    if(miss.length / words.length > 0.75) risky.push({s, x, r:Math.round(miss.length/words.length*100)});
  }
  if(risky.length) out.push({sev:"mid", title:`관찰에 없는 내용이 대부분인 문장 ${risky.length}건`,
    who: risky.slice(0,5).map(r => `${sname(r.s)} ${r.x.label}`).join(" · ") +
         " — 근거를 확인하거나 관찰을 먼저 담아 두세요", go:risky[0]});

  // 5. 축이 비어 있는 학생 (창체·행동특성)
  for(const k of ["cca:auto","behavior"]){
    const x = sl.find(v => v.key === k);
    const miss = S.students.filter(s => notesOf(s.id,k).length === 0);
    if(miss.length && miss.length < N) out.push({sev:"low", title:`${x.label} 관찰이 없는 학생 ${miss.length}명`,
      who: miss.map(sname).join(" · "), go:{s:miss[0], x}});
  }

  // 6. 관찰이 없는 교과
  const emptySubj = sl.filter(x => x.kind === "subj" && !S.notes.some(n => slotOf(n) === x.key));
  if(emptySubj.length && emptySubj.length < sl.length)
    out.push({sev:"low", title:`관찰이 한 건도 없는 교과 ${emptySubj.length}개`,
      who: emptySubj.map(x => x.label).join(" · "), go:{s:S.students[0], x:emptySubj[0]}});

  // 7. 남은 문장 칸
  const left = S.students.reduce((a,s) => a + sl.filter(x => !draftDone(s.id,x.key)).length, 0);
  if(left) out.push({sev:"low", title:`아직 확인이 끝나지 않은 문장 칸 ${left}개`,
    who:`전체 ${N*sl.length}칸 가운데 ${N*sl.length-left}칸 완료`, go:null});

  return out;
}

/* ══ 화면 ══ */
function render(){
  el("klass").innerHTML = S.classes.map(c =>
      `<option value="${c.id}"${c.id===S.curId?" selected":""}>${esc(klassName(c))} · ${c.students.length}명${c.klass.demo?" (예시)":""}</option>`).join("")
    + `<option value="__new">＋ 새 학급 만들기</option>`;
  el("klass").style.display = S.classes.length ? "" : "none";
  el("tab-prep").setAttribute("aria-selected", String(S.ui.tab === "prep"));
  el("tab-write").setAttribute("aria-selected", String(S.ui.tab === "write"));
  el("tab-check").setAttribute("aria-selected", String(S.ui.tab === "check"));
  el("tab-ai").setAttribute("aria-selected", String(S.ui.tab === "ai"));
  el("tab-ai").innerHTML = "AI 연결" + (aiOn() ? `<span class="dot" style="background:var(--good)"></span>` : "");
  const p = S.klass ? pointers().filter(x => x.sev !== "low").length : 0;
  el("tab-check").innerHTML = "살펴보기" + (p ? `<span class="dot"></span>` : "");
  const ready = !!(S.klass && S.classes.length);
  // 학급을 만들기 전에는 기록·점검으로 갈 수 없다. 눌러도 안 되는 이유를 보이게 한다.
  for(const id of ["tab-write","tab-check"]){
    el(id).disabled = !ready;
    el(id).title = ready ? "" : "먼저 준비 탭에서 우리 반을 등록해 주세요";
  }
  if(!ready && S.ui.tab !== "ai") S.ui.tab = "prep";
  el("tab-prep").setAttribute("aria-selected", String(S.ui.tab === "prep"));
  el("tab-write").setAttribute("aria-selected", String(S.ui.tab === "write"));
  el("tab-check").setAttribute("aria-selected", String(S.ui.tab === "check"));
  if(S.ui.tab === "ai"){ renderAI(); return; }
  if(!ready){ renderSetup(); return; }
  if(S.ui.tab === "prep") renderPrep();
  else if(S.ui.tab === "check") renderCheck();
  else renderWrite();
}

function collect(){
  const grade = +el("f-grade").value;
  const excluded = [...el("f-subj").querySelectorAll("input:checked")].map(i => i.value);
  const students = el("f-roster").value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map((line,i) => {
    const m = line.match(/^(\d+)[.)\s]*(.*)$/);
    const no = m ? +m[1] : i+1, name = (m ? m[2] : line).trim();
    return {id:uid(), no, name:name || String(no)};
  });
  // 반을 비워 두면 1반으로 본다 — 빈 값이면 화면 어디에도 반이 뜨지 않아 헷갈린다
  return {klass:{grade, room:el("f-room").value.trim() || "1", teacher:el("f-teacher").value.trim(),
                 excluded, numbersOnly:el("f-numbers").checked}, students};
}

/* ── 작성 ── */
function renderWrite(){
  if(!S.ui.sid) S.ui.sid = S.students[0]?.id || null;
  const sl = slots();
  if(!sl.some(x => x.key === S.ui.slot)) S.ui.slot = sl[0].key;
  el("main").innerHTML = `<div class="cols">
    <div class="panel"><div class="ph"><h2>명렬표</h2><span class="r saved">${S.students.length}</span></div>
      <div class="roster" id="roster">${rosterHTML()}</div>
      <div class="addstu">
        <input type="text" id="stu-new" placeholder="이름 적고 Enter" autocomplete="off">
        <button class="ghost tip" id="stu-add" type="button"
                data-tip="한 명 추가 — 이름을 적고 누르세요. ‘12 김ㅇㅇ’처럼 번호를 함께 적어도 됩니다">＋</button>
        <button class="ghost tip" id="stu-file-btn" type="button"
                data-tip="명렬표 파일로 한꺼번에 추가 — txt·csv 파일을 고르거나, 엑셀에서 복사한 목록을 왼쪽 칸에 붙여넣어도 됩니다">＋＋</button>
        <input type="file" id="stu-file" accept=".txt,.csv,.tsv,text/plain" style="display:none">
      </div>
    </div>
    <div class="panel" id="detail">${detailHTML()}</div></div>`;
  el("roster").onclick = e => {
    const x = e.target.closest("[data-del-stu]");
    if(x){ e.stopPropagation(); removeStudent(x.dataset.delStu); return; }
    const b = e.target.closest(".rrow"); if(!b) return;
    S.ui.sid = b.dataset.id; pendingStd = []; pendingFile = null; save();
    el("roster").innerHTML = rosterHTML();
    el("detail").innerHTML = detailHTML(); bindDetail();
  };
  el("roster").onkeydown = e => {
    const b = e.target.closest(".rrow");
    if(!b || (e.key !== "Enter" && e.key !== " ")) return;
    if(e.target.matches("[data-del-stu]")) return;   // X는 button이라 스스로 처리한다
    e.preventDefault(); b.click();
  };
  const ni = el("stu-new");
  const addStudents = raw => {
    raw = (raw ?? ni.value).trim(); if(!raw) return;
    let next = S.students.reduce((m,s) => Math.max(m, +s.no||0), 0);
    const made = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
      const m = line.match(/^(\d+)\s*[.),\t]?\s*(.*)$/);
      let no, name;
      if(m && m[2]){ no = +m[1]; name = m[2].trim(); next = Math.max(next, no); }
      else { no = ++next; name = line.replace(/^[\d.),\t\s]+/,"").trim() || String(no); }
      return {id:uid(), no, name:name.split(/[,\t]/)[0].trim() || String(no)};
    }).filter(s => s.name && !/^(번호|이름|성명|연번|순번)$/.test(s.name));   // 머리글 줄은 거른다
    if(!made.length) return;
    S.students.push(...made);
    S.students.sort((a,b) => a.no - b.no);
    S.ui.sid = made[0].id; ni.value = ""; save(); renderWrite();
    const f = el("stu-new"); if(f) f.focus();
  };
  ni.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); addStudents(); } };
  ni.onpaste = e => { const t = (e.clipboardData||window.clipboardData).getData("text");
    if(t && /\r?\n/.test(t)){ e.preventDefault(); addStudents(t); } };
  el("stu-add").onclick = () => addStudents();
  el("stu-file-btn").onclick = () => el("stu-file").click();
  el("stu-file").onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = () => addStudents(String(fr.result));
    fr.readAsText(f, "utf-8");
    e.target.value = "";
  };
  bindDetail();
}

  const sl = slots();
  return S.students.map(s => {
    const c = notesOf(s.id).length, done = sl.filter(x => draftDone(s.id,x.key)).length;
    return `<div class="rrow" role="button" tabindex="0" data-id="${s.id}" aria-current="${s.id===S.ui.sid}">
      <span class="no">${esc(String(s.no).padStart(2,"0"))}</span><span>${esc(sname(s))}</span>
