              title="${esc(sname(s))} 지우기" aria-label="${esc(sname(s))} 지우기">×</button></div>`;
  }).join("");
}

/* 학생 지우기 — 담긴 것이 있으면 한 번 더 묻는다 */
function removeStudent(id){
  const s = student(id); if(!s) return;
  const n = notesOf(id).length;
  const w = Object.keys(S.drafts).filter(k => k.startsWith(id + "|") && (S.drafts[k].text||"").trim()).length;
  if(n || w){
    const what = [n ? `관찰 ${n}건` : "", w ? `문장 ${w}칸` : ""].filter(Boolean).join(" · ");
    if(!confirm(`${sname(s)} 학생에게 ${what}이 담겨 있습니다.\n학생과 함께 모두 지워지며 되돌릴 수 없습니다.\n\n정말 지울까요?`)) return;
  }
  S.notes = S.notes.filter(x => x.studentId !== id);
  Object.keys(S.drafts).forEach(k => { if(k.startsWith(id + "|")) delete S.drafts[k]; });
  S.students = S.students.filter(x => x.id !== id);
  if(S.ui.sid === id) S.ui.sid = S.students[0]?.id || null;
  save(); sweepFiles(); renderWrite();
}

function detailHTML(){

  if(!s) return `<div class="empty" style="padding:40px">왼쪽에서 학생을 고르세요.</div>`;
  const sl = slots(), cur = sl.find(x => x.key === S.ui.slot) || sl[0];
  const ns = notesOf(s.id, cur.key), d = draftOf(s.id, cur.key), fs = check(d.text);
  const ack = ackScan[dkey(s.id, cur.key)] || new Set();
  const nb = fs.filter(f => f.lv === "block").length;
  const nw = fs.filter(f => f.lv === "warn" && !ack.has(ackKey(f))).length;
  const nok = fs.filter(f => ack.has(ackKey(f))).length;
  const ok = d.gate.every(Boolean) && !nb && d.text.trim();
  const openRub = _rubOpen; _rubOpen = false;   // 과제를 바꾼 직후 한 번만 펼친다

  return `
  <div class="shead">
    <span class="nm" id="s-name" title="눌러서 이름 고치기">${esc(sname(s))}</span>

      const mine = sl.filter(x => x.kind === ax);
      const cnt = mine.reduce((a,x) => a + notesOf(s.id,x.key).length, 0);
      const done = mine.filter(x => draftDone(s.id,x.key)).length;
      const on = cur.kind === ax;
      /* 고른 축의 하위 선택은 그 축 버튼 바로 옆에 붙는다 */
      let sub = "";
      if(on && ax === "subj")
        sub = `<select id="slot-sub">${mine.map(x=>{
          const c = notesOf(s.id,x.key).length;
          return `<option value="${esc(x.key)}"${x.key===cur.key?" selected":""}>${esc(x.label)}${c?` (${c})`:""}${draftDone(s.id,x.key)?" ✓":""}</option>`;}).join("")}</select>`;
      if(on && ax === "cca")

/* 교과 관찰 담기의 키워드 — 개발 단계에서 고른 관점이 맨 앞에 온다 (§10-3).
   영역 select와 AI 버튼은 평가 추가 창으로 갔다. 여기 남는 것은 재료(칩)뿐이다. */
function subjKwWords(cur){
  const t = S.tasks.find(x => x.id === _taskId && x.subject === cur.subject);
  const areas = t ? [...new Set((t.standards||[]).map(c => CODEMAP[c]?.area).filter(Boolean))] : [];
  const blocks = t ? kwOfAreas(cur.subject, areas).blocks
                   : ((KW.subj[cur.subject]||{})[band()] || []).slice(0,1);
  return [...new Set([...(t?.kw || []), ...blocks.flatMap(b => b.k), ...COMMON_KW.flatMap(b => b.k)])];
}
function baseKw(cur){
  if(cur.kind === "subj") return (KW.subj[cur.subject] || {})[band()] || [];
  if(cur.kind === "cca")  return KW.cca[cur.cca] || [];
  return KW.behavior || [];
}
function stdCut(code, n){
  const t = CODEMAP[code]?.text || "";
  return t.length > n ? t.slice(0, n) + "…" : t;
}
/* 이 칸 관찰들이 참조한 과제 루브릭의 수준명 — 없으면 통용 3수준 */
function slotLevels(ns){
  const out = [];
  for(const n of ns) for(const r of (taskOf(n)?.rubric || [])) if(!out.includes(r.level)) out.push(r.level);
  return out.length ? out : ["잘함","보통","노력요함"];
}
function modeLevel(ns){
  const c = {};
  for(const n of ns) if(n.level) c[n.level] = (c[n.level] || 0) + 1;
  let best = "", bn = 0;
  for(const k in c) if(c[k] > bn){ bn = c[k]; best = k; }
  return best;
}
/* 수준은 홀로 뜨지 않는다 — 언제나 서술어를 달고 다닌다 (§10-5 울타리) */
function levelText(n){
  const t = taskOf(n);
  const r = (t?.rubric || []).find(x => x.level === n.level);
  return r ? r.text : "지금 루브릭에 없는 수준";
}
function taskStd(){ const t = S.tasks.find(x => x.id === _taskId); return t ? (t.standards||[]) : []; }
function taskLegacy(){ const t = S.tasks.find(x => x.id === _taskId); return t ? (t.legacy||[]) : []; }
function taskOfId(id){ return S.tasks.find(x => x.id === id); }

/* AI 검토 결과 — 고치기·확인함으로 하나씩 닫아 나간다 */
function aiReviewHTML(k, text){
  const rv = aiReview[k];
  if(!rv) return "";
  const items = rv.items.map(it => {
    const gone = it.hit && !text.includes(it.hit);
    const state = it.state || (gone ? "gone" : "");
    return Object.assign({}, it, {state});
  });
  const left = items.filter(i => !i.state).length;
  return `
  <div class="scan" id="ai-block">
    <div class="scan-head"><span class="lab">AI 검토</span>
      <span class="tally">${items.length
        ? (left ? `${left}건 남음` : `<span class="none">모두 처리했습니다</span>`)
        : `<span class="none">짚은 것 없음</span>`}</span>
      <span class="r" style="margin-left:auto;display:flex;gap:8px">
        <button class="link" data-airedo="1" type="button">다시 검토</button>
        <button class="link" data-aiclose="1" type="button">닫기</button></span>
    </div>
    ${items.map((f,i)=>{
      const done = !!f.state;
      const badge = f.state === "applied" ? "고쳤음" : f.state === "ok" ? "선생님이 확인함"
                  : f.state === "gone" ? "문장에서 사라짐" : "";
      return `<details class="f ${done?"done":(f.level==="위반"?"block":"warn")}"${done?"":" open"}>
        <summary><span class="mk">${done?"✓":(f.level==="위반"?"●":"▲")}</span>
          <span class="hit">${esc(f.hit||"")}</span>
          ${f.fix&&!done?`<span class="to">→ ${esc(f.fix)}</span>`:""}
          ${done?`<span class="to" style="color:var(--good)">${badge}</span>`:""}
          <span class="r">${done?"":`
            ${f.fix?`<button class="fix" type="button" data-aifix="${i}">이대로 고치기</button>`:""}
            <button class="fix" type="button" data-aiok="${i}" title="규정에 어긋나지 않는다고 판단해 그대로 두기">확인함</button>`}
            <span class="basis">AI 검토</span></span></summary>
        <div class="why">${esc(f.why||"")}${f.state==="ok"?`<br><span style="color:var(--good)">선생님이 확인해 그대로 두기로 한 항목입니다.</span>`:""}</div></details>`;
    }).join("")}
    ${rv.note?`<div class="hint">${esc(rv.note)}</div>`:""}
    <div class="hint">참고 의견입니다.</div>
  </div>`;
}

function bindDetail(){
  const s = student(S.ui.sid); if(!s) return;
  const wrap = el("detail"), sl = slots(), cur = sl.find(x => x.key === S.ui.slot);

  el("slots").onclick = e => {
    const b = e.target.closest(".slot"); if(!b) return;
    const sl2 = slots();
    const key = b.dataset.slot || (sl2.find(x => x.kind === b.dataset.axis) || sl2[0]).key;
    S.ui.slot = key; pendingStd = []; pendingFile = null; _kwArea = 0; _taskId = "";
    _noteLevel = ""; _rubOpen = false;
    save(); repaint();
  };
  const ss = el("slot-sub");
  if(ss) ss.onchange = () => { S.ui.slot = ss.value; pendingStd = []; pendingFile = null;
                               _kwArea = 0; _taskId = ""; _noteLevel = ""; _rubOpen = false;
                               save(); repaint(); };

  el("s-name").onclick = () => {
    const span = el("s-name");
    const inp = document.createElement("input");
    inp.type = "text"; inp.value = s.name || ""; inp.style.cssText = "font-size:19px;font-weight:700;width:8em";
    span.replaceWith(inp); inp.focus(); inp.select();
    const done = () => {
      const v = inp.value.trim();
      if(v && v !== s.name){ s.name = v; save(); renderWrite(); } else repaint();
    };
    inp.onblur = done;
    inp.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); done(); } if(e.key === "Escape") repaint(); };
  };

  el("c-src").onchange = () => { _src = el("c-src").value; };
  const tk = el("c-task");
  /* 과제를 바꿔 고르면 그 기준을 한 번 펼쳐 보인다 — 읽고 관찰을 시작하라는 신호 */
  if(tk) tk.onchange = () => { _taskId = tk.value; _noteLevel = ""; _rubOpen = true; repaint(); };
  const nt = el("c-newtask");
  if(nt) nt.onclick = () => openTask(cur.subject, null, id => {
    _taskId = id; _noteLevel = ""; _rubOpen = true; repaint(); });

  const tg = el("c-tags");
  if(tg) tg.onclick = e => { const b = e.target.closest("[data-drop]"); if(!b) return;
    pendingStd = pendingStd.filter(c => c !== b.dataset.drop); repaint(); };

  const lv = el("lv-sel");
  if(lv) lv.onchange = () => { _level = lv.value; };
  const lvbox = el("c-level");
  if(lvbox) lvbox.onclick = e => { const b = e.target.closest("[data-lv]"); if(!b) return;
    _noteLevel = (_noteLevel === b.dataset.lv) ? "" : b.dataset.lv;
    lvbox.querySelectorAll("[data-lv]").forEach(x =>
      x.setAttribute("aria-pressed", String(x.dataset.lv === _noteLevel))); };
  const ka = el("kw-area");
  if(ka) ka.onchange = () => { _kwArea = +ka.value; repaint(); };
  const kc = el("kw-chips");
  if(kc) kc.onclick = e => {
    const b = e.target.closest("[data-kw]"); if(!b) return;
    const t = el("c-text"), v = t.value.trim();
    t.value = v ? v.replace(/[\s,·]+$/, "") + ", " + b.dataset.kw : b.dataset.kw;
    t.focus();
  };
  const ti = el("c-text");
  ti.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); addNote(); } };
  el("c-add").onclick = addNote;

  /* 산출물 사진·PDF → 글자 읽기 → 관찰 메모 후보 */
  const off = el("c-shot-off");
  if(off) off.onclick = () => { S.ui.tab = "ai"; save(); render(); };
  const dropf = wrap.querySelector("[data-dropfile]");
  if(dropf) dropf.onclick = () => { pendingFile = null; repaint(); };
  const shot = el("c-shot"), shotOut = el("c-shot-out");
  if(shot){
    shot.onclick = () => el("c-file").click();
    el("c-file").onchange = async e => {

${(() => { const ts = [...new Set(notesOf(s.id, S.ui.slot).map(n => n.taskId).filter(Boolean))]

JSON만 출력한다: {"text":"초안"}
[근거]
${evid()}`);
      const d2 = S.drafts[k] || (S.drafts[k] = {text:"", gate:[false,false,false,false]});

[근거]
${evid() || "(없음)"}
[문장]
${S.drafts[k].text}`);
      aiReview[k] = {items:(r.findings||[]).map(f => ({level:f.level||"확인", hit:String(f.hit||""),

function addNote(){
  const ti = el("c-text"), text = ti.value.trim();
  if(!text){ ti.focus(); return; }
  const cur = slots().find(x => x.key === S.ui.slot);
  const n = {id:uid(), studentId:S.ui.sid, date:today(), source:_src, text, standards:[]};
  if(cur.kind === "subj"){
    n.axis = "subj"; n.subject = cur.subject;
    if(_taskId && S.tasks.find(t => t.id === _taskId && t.subject === cur.subject)) n.taskId = _taskId;
    n.standards = [...new Set([...taskStd(), ...pendingStd])];
    n.legacy = taskLegacy().slice();
    /* 수준은 그 과제 루브릭에 있는 값일 때만 붙는다 */
    const t = S.tasks.find(x => x.id === n.taskId);
    if(_noteLevel && (t?.rubric || []).some(r => r.level === _noteLevel)) n.level = _noteLevel;
  } else if(cur.kind === "cca"){ n.axis = "cca"; n.cca = cur.cca; }
  else n.axis = "behavior";
  if(pendingFile) n.fileId = pendingFile.id;
  S.notes.push(n); pendingStd = []; save();
  renderWrite(); el("c-text").focus();
}

/* ── 2015 개정 코드 → 2022 개정 성취기준 추정 ── */
function bigrams(t){
  const x = String(t).replace(/[^가-힣0-9a-zA-Z]/g, "");
  const m = new Map();
  for(let i = 0; i < x.length - 1; i++){
    const g = x.slice(i, i+2);
    m.set(g, (m.get(g)||0) + 1);
  }
  return m;
}
function simText(a, b){
  const A = bigrams(a), B = bigrams(b);
  if(!A.size || !B.size) return 0;
  let dot = 0, na = 0, nb = 0;
  for(const [g,v] of A){ na += v*v; if(B.has(g)) dot += v * B.get(g); }
  for(const v of B.values()) nb += v*v;
  return dot / Math.sqrt(na*nb);
}
/* 교과·학년군 안에서 가장 비슷한 성취기준을 찾는다 */
function guessStd(text, subject, n){
  const areas = (STD[subject] || {})[band()] || [];
  const cand = [];
  for(const a of areas) for(const [c,t] of a.s) cand.push({code:c, text:t, score:simText(text, t)});
  cand.sort((x,y) => y.score - x.score);
  return cand.slice(0, n || 1);
}

/* ── 한글 문서(HWPX) 읽기 ──
   HWPX는 ZIP 안에 XML이다. 외부 라이브러리를 쓸 수 없으므로(외부 요청 금지) 중앙 디렉터리를
   직접 훑고 브라우저 기본 DecompressionStream("deflate-raw")으로 푼다. */
async function unzip(buf, want){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eo = -1;
  for(let i = u8.length - 22; i >= 0 && i > u8.length - 22 - 65536; i--)
    if(dv.getUint32(i, true) === 0x06054b50){ eo = i; break; }
  if(eo < 0) throw new Error("압축 구조를 읽지 못했습니다. HWPX 파일이 맞는지 확인해 주세요.");
  const n = dv.getUint16(eo + 10, true);
  let p = dv.getUint32(eo + 16, true);
  const out = {}, td = new TextDecoder();
  for(let i = 0; i < n; i++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + elen + clen;
    if(!want(name)) continue;
    const lnlen = dv.getUint16(lho + 26, true), lelen = dv.getUint16(lho + 28, true);
    const raw = u8.slice(lho + 30 + lnlen + lelen, lho + 30 + lnlen + lelen + csize);
    if(method === 0) out[name] = raw;
    else if(method === 8) out[name] = new Uint8Array(await new Response(
      new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    else throw new Error("이 파일의 압축 방식은 지원하지 않습니다.");
  }
  return out;
}
/* 문단은 한 줄, 표는 한 행을 탭으로 이어 붙인다 — readPlan()이 셀 위치로 읽을 수 있게 */
function hwpxLines(root){
  const out = [], kids = e => [...e.children];
  const deep = (e, ln) => [...e.getElementsByTagName("*")].filter(x => x.localName === ln);
  const textOf = e => deep(e, "t").map(x => x.textContent).join("").replace(/\s+/g, " ").trim();
  (function walk(node){
    for(const e of kids(node)){
      const ln = e.localName;
      if(ln === "tbl"){
        for(const tr of deep(e, "tr")){
          const cells = kids(tr).filter(x => x.localName === "tc").map(textOf);
          if(cells.some(Boolean)) out.push(cells.join("\t"));
        }
      } else if(ln === "p" && !deep(e, "tbl").length){
        const t = textOf(e); if(t) out.push(t);
      } else walk(e);
    }
  })(root);
  return out;
}
async function hwpxText(file){
  const parts = await unzip(await file.arrayBuffer(), n => /^Contents\/section\d+\.xml$/i.test(n));
  const names = Object.keys(parts).sort();
  if(!names.length) throw new Error("본문을 찾지 못했습니다. HWPX 파일이 맞는지 확인해 주세요.");
  const td = new TextDecoder("utf-8"), lines = [];
  for(const nm of names){
    const doc = new DOMParser().parseFromString(td.decode(parts[nm]), "application/xml");
    if(doc.querySelector("parsererror")) throw new Error("본문 XML을 읽지 못했습니다.");
    lines.push(...hwpxLines(doc.documentElement));
  }
  return lines.join("\n");
}

/* ── 평가 문서 읽기 ── */
const CODE_RE = /\[?([246][가-힣]{1,2}\d{2}-\d{2})\]?/g;
function readPlan(text){
  const lines = text.split(/\r?\n/), rows = [], seen = new Set(), notes = [];
  for(const raw of lines){
    const line = raw.trim(); if(!line) continue;
    CODE_RE.lastIndex = 0;
    const codes = [...new Set([...line.matchAll(CODE_RE)].map(m => m[1]))];
    if(!codes.length) continue;
    // 표는 보통 [교과 | 평가과제 | 성취기준 | 평가기준] 순서다. 셀 위치로 읽는다.
    const cells = line.split(/\s*[|\t]\s*/).map(c => c.trim()).filter(Boolean);
    const hasCode = c => { CODE_RE.lastIndex = 0; return CODE_RE.test(c); };
    const ci = cells.findIndex(hasCode);
    const si = cells.findIndex(c => allSubjects().some(s => s === c || subjShort(s) === c || s.startsWith(c)));
    let name = "", criteria = "";
    if(ci > 0){
      const before = cells.slice(0, ci).filter((c,i) => i !== si && !hasCode(c));
      name = before[before.length-1] || "";
      criteria = cells.slice(ci+1).filter(c => !hasCode(c)).join(" ");
    }
    if(!name && cells.length === 1)
      name = line.replace(CODE_RE,"").replace(/^[\s·\-–—.\d)]+/,"").replace(/\s{2,}/g," ").trim();
    if(!name) name = cells.filter((c,i) => i !== si && !hasCode(c))[0] || "";
    if(name.length > 60) name = name.slice(0,60) + "…";
    const known = codes.filter(c => CODEMAP[c]);
    const subj = (si >= 0 ? allSubjects().find(s => s === cells[si] || subjShort(s) === cells[si] || s.startsWith(cells[si])) : "")
                 || (known.length ? CODEMAP[known[0]].subject : "");
    rows.push({name, codes, subject:subj, criteria, pick:true});
    for(const c of codes){
      if(!CODEMAP[c]) notes.push({sev:"mid", t:`2022 개정에 없는 코드 ${c}`, d:"2015 개정 코드이거나 오타일 수 있습니다. 아래 표에서 추정 성취기준을 확인하세요"});
      else{
        if(CODEMAP[c].grade !== band()) notes.push({sev:"mid", t:`${c}는 ${CODEMAP[c].grade}학년군`, d:`우리 반은 ${band()}학년군입니다`});
        if((S.klass.excluded||[]).includes(CODEMAP[c].subject)) notes.push({sev:"low", t:`${c}는 전담으로 뺀 ${subjShort(CODEMAP[c].subject)}`, d:"기록은 전담 교사가 입력합니다"});
        if(seen.has(c)) notes.push({sev:"low", t:`${c}가 여러 줄에 있습니다`, d:"같은 성취기준을 여러 과제가 나눠 쓰는지 확인하세요"});
        seen.add(c);
      }
    }
  }
  // 같은 지적은 한 번만
  const uniq = [], keys = new Set();
  for(const n of notes){ const k = n.t; if(!keys.has(k)){ keys.add(k); uniq.push(n); } }
  return {rows, notes:uniq, found:seen.size};
}
/* 코드가 있어도 뜻이 다를 수 있다 — 평가기준 문장과의 닮은 정도로 판정한다 */
const SIM_OK = 0.45, SIM_LOW = 0.15;
function fillGuesses(rows){
  rows.forEach(r => {
    const q = [r.name, r.criteria].filter(Boolean).join(" ");
    r.q = q;
    const checked = (r.codes||[]).map(c => {
      const t = CODEMAP[c]?.text || "";
      return {code:c, exists:!!t, sim:t ? simText(q, t) : 0};
    });
    r.known = checked.filter(x => x.exists && x.sim >= SIM_OK).map(x => x.code);
    r.doubt = checked.filter(x => !r.known.includes(x.code));
    r.guess = (r.subject && r.doubt.length) ? guessStd(q, r.subject, 2).filter(g => g.score > SIM_LOW) : [];
    r.useGuess = !!(r.guess.length && r.guess[0].score >= 0.3);
    r.manual = r.manual || [];
  });
  return rows;
}
function rowCodes(r){
  const out = (r.known||[]).slice();
  if(r.useGuess && r.guess?.length) out.push(r.guess[0].code);
  (r.manual||[]).forEach(c => out.push(c));
  return [...new Set(out)];
}

/* 평가 추가 창 — 1단계 성취기준 고르기 → 2단계 과제 다듬기 (§10-2).

function openStd(subject, selected, onOK, taskMode){
  dlgState = {subject, sel:new Set(selected), onOK, taskMode,
              step: (taskMode && taskMode.task) ? 2 : 1,
              kw:new Set(taskMode?.task?.kw || []), axis:taskMode?.task?.axis || "", msg:""};

  el("dlg-next").onclick = () => { dlgState.step = 2; dlgState.msg = ""; paintDlg(); el("dlg-name").focus(); };

      if(!name){ el("dlg-name").focus(); return; }
      const rubric = [...rubBox.querySelectorAll(".rrow2")]
        .map(row => ({level:row.querySelector(".rl").value.trim(), text:row.querySelector(".rt").value.trim()}))
        .filter(r => r.level && r.text);
      dlgState.taskMode.onSave({name, criteria:el("dlg-crit").value.trim(), codes:[...dlgState.sel],
                                rubric, kw:[...dlgState.kw], axis:dlgState.axis});
    } else dlgState.onOK([...dlgState.sel]);
    el("dlg").close();
  };
  el("dlg-body").onclick = e => { const r = e.target.closest(".srow"); if(!r) return;
    const c = r.dataset.code;
    dlgState.sel.has(c) ? dlgState.sel.delete(c) : dlgState.sel.add(c);
    dlgState.msg = ""; paintDlg(); };
  el("dlg-kw").onclick = e => { const b = e.target.closest("[data-kw]"); if(!b) return;
    const w = b.dataset.kw;
    dlgState.kw.has(w) ? dlgState.kw.delete(w) : dlgState.kw.add(w);
    paintKw(); };
  el("dlg-skel").onclick = () => {
    const m = el("dlg-skelmenu");
    if(!m.hidden){ m.hidden = true; return; }
    const k = skelKey();
    m.innerHTML = SKEL.map((s,i)=>`<button class="skelopt" type="button" data-skel="${i}">
      <b>${esc(s.axis)}</b><span>${esc(s.hint)} — ${esc(s.t[0](k))}</span></button>`).join("");
    m.hidden = false;
    m.querySelectorAll("[data-skel]").forEach(b => b.onclick = () => {
      const s = SKEL[+b.dataset.skel], kk = skelKey();
      /* 빈칸만 채운다 — 적힌 칸은 건드리지 않는다 */
      [...rubBox.querySelectorAll(".rrow2")].forEach((row,i) => {
        const t = row.querySelector(".rt");
        if(!t.value.trim() && s.t[i]) t.value = s.t[i](kk);
      });
      dlgState.axis = s.axis; m.hidden = true; paintLint();
    });
  };
  paintDlg(); el("dlg").showModal();

  /* 평가 요소가 비면 첫 성취기준 원문을 명사형으로 바꿔 뼈대의 핵으로 쓴다 */
  function skelKey(){
    const n = el("dlg-name").value.trim();
    if(n) return n;
    const first = [...dlgState.sel][0];
    const t = CODEMAP[first]?.text;
    return t ? (toNominal(String(t).replace(/\.\s*$/,"")) || "") : "";
  }
  function stdTexts(){ return [...dlgState.sel].map(c => CODEMAP[c]?.text).filter(Boolean); }

  function paintDlg(){
    const tm = dlgState.taskMode, one = !tm || dlgState.step === 1;
    el("dlg-title").textContent = tm ? (tm.task ? "평가 고치기" : "평가 추가") : "성취기준 고르기";
    subjSel.hidden = !one; q.hidden = !one; el("dlg-cnt").hidden = !one; el("dlg-body").hidden = !one;
    el("dlg-task").hidden = !tm || one;
    el("dlg-back").hidden = !tm || one;
    el("dlg-next").hidden = !tm || !one;
    el("dlg-ok").hidden = !!tm && one;
    if(one) paintList(); else paintTask();
  }
  function paintList(){
    const qq = q.value.trim();
    const areas = (STD[dlgState.subject]||{})[band()] || [];
    let n = 0;
    const html = areas.map(a => {
      const rows = a.s.filter(([c,t]) => !qq || c.includes(qq) || t.includes(qq));
      n += rows.length;
      return rows.length ? `<div class="ahead">${esc(a.n?a.n+" · ":"")}${esc(a.a)}</div>` +
        rows.map(([c,t])=>`<button class="srow" type="button" data-code="${esc(c)}" data-on="${dlgState.sel.has(c)?1:0}">
          <span class="mk">${dlgState.sel.has(c)?"✓":"＋"}</span><span class="code">${esc(c)}</span><span>${esc(t)}</span></button>`).join("") : "";
    }).join("");
    el("dlg-body").innerHTML = html || `<div class="empty">찾는 성취기준이 없습니다</div>`;
    el("dlg-cnt").textContent = n + "건";
    el("dlg-sel").innerHTML = (dlgState.msg ? `<span style="color:var(--mid)">${esc(dlgState.msg)}</span> · ` : "")
      + (dlgState.sel.size ? `${dlgState.sel.size}건 선택` : "");
    el("dlg-next").disabled = !dlgState.sel.size;
  }
  function paintTask(){
    const codes = [...dlgState.sel];
    el("dlg-picked").innerHTML =
      `<span class="subj">${esc(subjShort(dlgState.subject))}</span>`
      + codes.map(c=>`<span class="chip std" title="${esc(CODEMAP[c]?.text||"")}"><b>${esc(c)}</b>${esc(stdCut(c,22))}</span>`).join("")
      + (dlgAreas().length
          ? dlgAreas().map(a=>`<span class="abadge">${esc(a)}</span>`).join("")
          : `<span class="abadge none">영역 없음</span>`);
    el("dlg-sel").textContent = codes.length ? `성취기준 ${codes.length}건` : "";
    el("dlg-skel").disabled = !skelKey();
    /* AI 버튼 둘은 연결돼 있을 때만 */
    el("dlg-kwai-slot").innerHTML = aiOn()
      ? `<button class="kwai" id="dlg-kwai" type="button">${ICON.spark()}AI 추천</button>` : "";
    el("dlg-airub-slot").innerHTML = aiOn()
      ? `<button class="ghost" id="dlg-airub" type="button">AI 초안</button>` : "";
    const kai = el("dlg-kwai"); if(kai) kai.onclick = aiKeywords;
    const arb = el("dlg-airub"); if(arb) arb.onclick = aiRubric;
    paintKw(); paintLint();
  }
  function paintKw(){
    const r = kwOfAreas(dlgState.subject, dlgAreas());
    const words = [...new Set([...dlgState.kw, ...r.blocks.flatMap(b => b.k)])];
    el("dlg-kw").innerHTML = words.map(w=>`<button class="kwc" type="button" data-kw="${esc(w)}"
      aria-pressed="${dlgState.kw.has(w)}">${esc(w)}</button>`).join("")
      || `<span class="muted">이 영역의 키워드가 없습니다</span>`;
    /* 조용히 실패하지 않는다 */
    const m = el("dlg-kwmsg");
    if(!r.missed.length) m.innerHTML = "";
    else if(r.blocks.length && dlgAreas().length > r.missed.length)
      m.innerHTML = `<div class="dmsg">‘${esc(r.missed.slice(0,2).join("’ · ‘"))}’${r.missed.length>2?` 외 ${r.missed.length-2}건`:""} 영역의 키워드 갈래를 찾지 못했습니다.</div>`;
    else
      m.innerHTML = `<div class="dmsg">이 영역의 키워드 갈래를 찾지 못해 ${esc(subjShort(dlgState.subject))} 전체 키워드를 보입니다.</div>`;
  }
  function paintLint(){
    const rows = [...rubBox.querySelectorAll(".rrow2")]
      .map(row => ({level:row.querySelector(".rl").value.trim(), text:row.querySelector(".rt").value.trim()}));
    const fs = rubricLint(rows, stdTexts());
    el("dlg-lint").innerHTML = fs.map(f=>`<details class="f warn">
      <summary><span class="mk">▲</span><span class="hit">${esc(f.hit)}</span>
        <span class="r"><span class="basis">루브릭 점검</span></span></summary>
      <div class="why">${esc(f.why)}</div></details>`).join("");
  }

  async function aiKeywords(){
    const b = el("dlg-kwai"); b.disabled = true; b.textContent = "…";
    const codes = [...dlgState.sel];
    const name = el("dlg-name").value.trim(), crit = el("dlg-crit").value.trim();
    try{
      const r = await aiJSON(`한국 초등학교 ${S.klass.grade}학년 ${dlgState.subject} 수업에서 교사가 관찰 기록에 쓸 키워드를 뽑는다.
${codes.length ? "성취기준:\n" + codes.map(c => `- [${c}] ${CODEMAP[c]?.text||""}`).join("\n") : "영역: " + dlgAreas().join(" · ")}
${name ? "평가과제: " + name + (crit ? " / 평가기준: " + crit : "") : ""}
지식·기능·태도 세 갈래로 각각 6개씩, 교사가 관찰한 사실을 적을 때 쓰는 짧은 명사구로 쓴다(예: 중심 문장 찾기, 근거 들어 설명하기).
점수·등급·대회·상표명은 넣지 않는다.
JSON만 출력한다: {"지식":["..."],"기능":["..."],"태도":["..."]}`);
      const got = ["지식","기능","태도"].flatMap(k => (r[k]||[]).map(String)).filter(Boolean);
      got.forEach(w => dlgState.kw.add(w));
      paintKw();
      el("dlg-kwmsg").innerHTML = `<div class="dmsg">AI가 ${got.length}개를 더했습니다. 필요 없는 것은 눌러서 끄세요.</div>`;
    }catch(e){ el("dlg-kwmsg").innerHTML = `<div class="dmsg" style="color:var(--low)">${esc(e.message)}</div>`; }
    const b2 = el("dlg-kwai"); if(b2){ b2.disabled = false; b2.innerHTML = ICON.spark() + "AI 추천"; }
  }
  async function aiRubric(){
    const b = el("dlg-airub"); b.disabled = true; b.textContent = "…";
    const rows = [...rubBox.querySelectorAll(".rrow2")];
    const levels = rows.map(r => r.querySelector(".rl").value.trim() || "수준");
    try{
      const r = await aiJSON(`한국 초등학교 ${S.klass.grade}학년 ${dlgState.subject} 평가과제의 ${levels.length}수준 루브릭을 쓴다.
평가 요소: ${el("dlg-name").value.trim()} / 평가 내용: ${el("dlg-crit").value.trim()}
성취기준:
${[...dlgState.sel].map(c => `- [${c}] ${CODEMAP[c]?.text||""}`).join("\n") || "- (없음)"}
수준을 가르는 기준: ${dlgState.axis || "자립도"}
각 수준은 한 문장이고 '~함'으로 끝낸다. 세 문장은 같은 행동을 다루며 정도만 다르다.
성취기준 문장을 그대로 옮겨 적지 않는다. 점수·백분율·석차를 쓰지 않는다.
'${levels[levels.length-1]}'은 못하는 것의 나열이 아니라 어떤 도움에서 무엇을 해내는지로 쓴다.
JSON만 출력한다: {${levels.map(l=>`"${l}":"…"`).join(",")}}`);
      /* 뼈대와 같은 규칙 — 빈칸만 채운다 */
      rows.forEach((row,i) => {
        const t = row.querySelector(".rt"), v = r[levels[i]];
        if(!t.value.trim() && v) t.value = String(v).trim();
      });
      paintLint();
    }catch(e){ el("dlg-lint").innerHTML = `<div class="dmsg" style="color:var(--low)">${esc(e.message)}</div>`; }
    const b2 = el("dlg-airub"); if(b2){ b2.disabled = false; b2.textContent = "AI 초안"; }
  }
}

/* ── 데이터 ── */
async function exportJSON(){
  const withFiles = el("ex-files")?.checked;
  const data = Object.assign({}, S, {exportedAt:new Date().toISOString()});
  if(withFiles){
    const btn = el("ex"); if(btn){ btn.disabled = true; btn.textContent = "사진을 담는 중…"; }
    try{
      const keys = await fileKeys(), all = await fileAll(), files = {};
      for(let i = 0; i < keys.length; i++){
        const rec = all[i];
        files[keys[i]] = {name:rec.name, type:rec.type, at:rec.at, size:rec.size,
          data: await new Promise(ok => { const fr = new FileReader();
            fr.onload = () => ok(String(fr.result).split(",")[1]); fr.readAsDataURL(rec.blob); })};
      }
      data.files = files;
    }catch(e){}
    const btn2 = el("ex"); if(btn2){ btn2.disabled = false; btn2.textContent = "백업 내려받기"; }
  }
  const blob = new Blob([JSON.stringify(data, null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `trecord-${S.klass?.grade||""}학년${S.klass?.room||""}반-${today()}${withFiles?"-사진포함":""}.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
async function fileStat(){
  const box = el("fstat"); if(!box) return;
  try{
    const all = await fileAll();
    const n = all.length, sum = all.reduce((a,r) => a + (r.size || r.blob?.size || 0), 0);
    box.textContent = n ? `— 지금 보관된 산출물 ${n}개, 모두 ${kb(sum)}` : "— 아직 보관된 산출물이 없습니다";
  }catch(e){ box.textContent = ""; }
}
function importJSON(file){
  if(!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(d.schema !== "trecord.v3") throw new Error("이 도구에서 내보낸 파일이 아닙니다");
      if(!confirm("지금 화면의 기록을 파일 내용으로 바꿉니다. 계속할까요?")) return;
      const files = d.files; delete d.files;
      adopt(d, "check");
      save(); render();
      if(files) (async () => {
        try{
          for(const [id, f] of Object.entries(files)){
            const bin = atob(f.data), arr = new Uint8Array(bin.length);
            for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            const blob = new Blob([arr], {type:f.type || "image/jpeg"});
            await filePut(id, {blob, name:f.name, type:f.type, size:blob.size, at:f.at});
          }
          fileStat();
        }catch(e){}
      })();
    }catch(err){ alert("열지 못했습니다 — " + err.message); }
  };
  fr.readAsText(file);
}
function seedClasses(){
  const NAMES = ["김하준","이서연","박도윤","최지우","정시우","강하은","조은우","윤수아","장민준","임지호",
                 "오예린","한서준","신아윤","권태오","황유나","문가온","서주원","배시윤","노하율","안리안"];
  stashActive();
  for(let g = 1; g <= 6; g++){
    const pool = NAMES.slice().sort(() => Math.random() - 0.5).slice(0, 10);
    const c = newClass({grade:g, room:String(1 + Math.floor(Math.random()*4)), teacher:"",
                        excluded:[], numbersOnly:false, demo:true},
                       pool.map((n,i) => ({id:uid(), no:i+1, name:n})));
    S.classes.push(c);
  }
  save(); render();
}
function removeClass(id){
  const c = S.classes.find(x => x.id === id); if(!c) return;
  const n = (c.notes||[]).length, w = Object.keys(c.drafts||{}).length;
  if(!confirm(`${klassName(c)} 학급을 지웁니다.` + (n||w ? `\n관찰 ${n}건과 문장 ${w}칸도 함께 사라집니다.` : "") + "\n되돌릴 수 없습니다.")) return;
  S.classes = S.classes.filter(x => x.id !== id);
  activate(S.classes[0]?.id || null);
  S.ui.sid = S.students[0]?.id || null;
  save(); render();
}
function demo(){
  if(!S.klass) S.klass = {grade:4, room:"3", excluded:[], numbersOnly:false};
  const base = S.students.length;
  const made = ["강ㅇㅇ","김ㅇㅇ","박ㅇㅇ","이ㅇㅇ","정ㅇㅇ"].map((n,i)=>({id:uid(), no:base+i+1, name:n}));
  S.students.push(...made);
  const t1 = {id:uid(), name:"문단의 중심 생각 정리하기", subject:"국어", standards:["4국02-01","4국03-01"],
              criteria:"문단의 중심 문장을 찾아 글의 내용을 요약하여 쓸 수 있다."};
  S.tasks.push(t1);
  const D = today(), add = (i,o) => S.notes.push(Object.assign({id:uid(), studentId:made[i].id, date:D, standards:[]}, o));
  add(0,{axis:"subj",subject:"국어",source:"수업산출물",taskId:t1.id,standards:t1.standards.slice(),text:"문단의 중심 문장을 찾아 근거를 들어 설명함"});
  add(0,{axis:"subj",subject:"국어",source:"자기평가서",text:"어려운 낱말을 스스로 표시해 두는 습관이 생겼다고 적음"});
  add(0,{axis:"behavior",source:"직접관찰",text:"모둠에서 말이 적은 친구에게 먼저 역할을 나누어 줌"});
  add(1,{axis:"subj",subject:"수학",source:"수업산출물",standards:["4수03-01"],text:"각도기를 정확히 맞추어 예각과 둔각을 구분해 그림"});
  add(1,{axis:"cca",cca:"auto",source:"소감문",text:"학급 자치 회의에서 급식 잔반 줄이기 규칙을 제안하고 실천표를 만듦"});
  add(2,{axis:"subj",subject:"과학",source:"동료평가서",text:"모둠 실험 결과를 표로 정리해 친구들이 이해하기 쉽게 설명했다는 평을 받음"});
  add(2,{axis:"cca",cca:"career",source:"직접관찰",text:"직업 카드 놀이에서 관심 직업 세 가지를 고르고 이유를 말함"});
  add(3,{axis:"subj",subject:"국어",source:"독후감",text:"읽은 책의 인물에게 편지 형식으로 생각을 씀"});
  S.drafts[dkey(made[0].id,"subj:국어")] = {text:"문단의 중심 문장을 찾아 근거를 들어 설명하는 힘이 뛰어남. 어려운 낱말을 스스로 표시해 두는 습관이 자리 잡음.", gate:[false,false,false,false]};
  S.drafts[dkey(made[1].id,"cca:auto")] = {text:"학급 자치 회의에서 급식 잔반 줄이기 규칙을 제안하고 실천표를 만들어 한 달 동안 관리함. 교내 환경 사랑 그리기 대회에 참가하여 3등을 하였고, 유튜브에서 찾은 자료로 캠페인 문구를 만들었다.", gate:[false,false,false,false]};
  S.ui.tab = "check"; S.ui.sid = made[1].id; S.ui.slot = "cca:auto";
  save(); render();
}

el("btn-theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
  next ? document.documentElement.setAttribute("data-theme", next) : document.documentElement.removeAttribute("data-theme");

};
