<meta charset="utf-8">
<title>평가 기록 도우미 — 근거로 쌓는 학기말 기록</title>

<style>
:root{
  --ground:#F2F6FB; --surface:#FFFFFF; --raise:#F7FAFD; --sink:#EAF1F8;
  --rule:#DEE7F0; --rule-strong:#C4D2E0;
  --ink:#162333; --ink-2:#526479; --ink-3:#7B8DA2;
  --accent:#1E6FD9; --accent-deep:#1558B0; --accent-soft:#E8F1FD; --accent-line:#B6D0F0;
  --on-accent:#FFFFFF;
  --warm:#9C5324; --warm-soft:#FFEFE3; --warm-line:#EFC8A6;
  --low:#B3372A; --mid:#8F6410; --good:#1E7A55;
  --low-soft:#FBE9E5; --mid-soft:#FAF0DC; --good-soft:#E5F3EC;
  --shadow-card:0 1px 2px rgba(31,58,91,.04), 0 10px 28px rgba(31,79,132,.08);
  --shadow-pop:0 8px 20px rgba(15,42,76,.12), 0 24px 56px rgba(15,42,76,.16);
  --sans:'Pretendard Variable',Pretendard,'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  --mono:ui-monospace,'Cascadia Mono','D2Coding',Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme:dark){
  :root{
  --ground:#0E1621; --surface:#17212E; --raise:#1D2938; --sink:#101923;
  --rule:#2C3B4D; --rule-strong:#3E5065;
  --ink:#E8EFF7; --ink-2:#A9B9CB; --ink-3:#7B8CA0;
  --accent:#7FB4F2; --accent-deep:#9CC5F6; --accent-soft:#1A2D45; --accent-line:#2E4A6B;
  --on-accent:#0E1621;
  --warm:#F0B183; --warm-soft:#33241A; --warm-line:#57402D;
  --low:#EE8F7E; --mid:#E0B45C; --good:#63C094;
  --low-soft:#35201C; --mid-soft:#322817; --good-soft:#16301F;
  --shadow-card:0 1px 3px rgba(0,0,0,.30), 0 4px 16px rgba(0,0,0,.35);
  --shadow-pop:0 4px 12px rgba(0,0,0,.40), 0 12px 32px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1621; --surface:#17212E; --raise:#1D2938; --sink:#101923;
  --rule:#2C3B4D; --rule-strong:#3E5065;
  --ink:#E8EFF7; --ink-2:#A9B9CB; --ink-3:#7B8CA0;
  --accent:#7FB4F2; --accent-deep:#9CC5F6; --accent-soft:#1A2D45; --accent-line:#2E4A6B;
  --on-accent:#0E1621;
  --warm:#F0B183; --warm-soft:#33241A; --warm-line:#57402D;
  --low:#EE8F7E; --mid:#E0B45C; --good:#63C094;
  --low-soft:#35201C; --mid-soft:#322817; --good-soft:#16301F;
  --shadow-card:0 1px 3px rgba(0,0,0,.30), 0 4px 16px rgba(0,0,0,.35);
  --shadow-pop:0 4px 12px rgba(0,0,0,.40), 0 12px 32px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --ground:#F2F6FB; --surface:#FFFFFF; --raise:#F7FAFD; --sink:#EAF1F8;
  --rule:#DEE7F0; --rule-strong:#C4D2E0;
  --ink:#162333; --ink-2:#526479; --ink-3:#7B8DA2;
  --accent:#1E6FD9; --accent-deep:#1558B0; --accent-soft:#E8F1FD; --accent-line:#B6D0F0;
  --on-accent:#FFFFFF;
  --warm:#9C5324; --warm-soft:#FFEFE3; --warm-line:#EFC8A6;
  --low:#B3372A; --mid:#8F6410; --good:#1E7A55;
  --low-soft:#FBE9E5; --mid-soft:#FAF0DC; --good-soft:#E5F3EC;
  --shadow-card:0 1px 2px rgba(31,58,91,.04), 0 10px 28px rgba(31,79,132,.08);
  --shadow-pop:0 8px 20px rgba(15,42,76,.12), 0 24px 56px rgba(15,42,76,.16);
}

*{box-sizing:border-box}
/* display를 지정한 요소는 hidden 속성이 먹지 않는다 — 한 줄로 막아 둔다 */
[hidden]{display:none !important}
body{margin:0;background-color:var(--ground);color:var(--ink);font-family:var(--sans);
     background-image:radial-gradient(circle at 14% -10%,var(--accent-soft) 0,transparent 34%),
                      linear-gradient(180deg,var(--ground) 0,var(--ground) 72%,var(--sink) 100%);
     background-attachment:fixed;font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:650}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"⌄";margin-left:5px;font-size:11px;color:var(--ink-3)}
details[open]>summary::after{content:"⌃"}

/* 라벨 — 화면의 모든 작은 제목은 이 하나로 통일 */
.lab{font-size:13px;font-weight:600;color:var(--ink-2)}

/* ── 상단 ── */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);
     border-bottom:1px solid var(--rule);box-shadow:0 1px 0 rgba(22,35,51,.02);backdrop-filter:blur(14px)}
.top-in{max-width:1120px;margin:0 auto;padding:11px 18px 7px;display:flex;align-items:center;gap:12px}
.brand{display:inline-flex;align-items:center;gap:9px;font-size:15px;font-weight:700;letter-spacing:-.015em;white-space:nowrap}
.brand-mark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;
            background:linear-gradient(145deg,var(--accent),var(--accent-deep));color:var(--on-accent);
            font-family:var(--mono);font-size:15px;font-weight:800;box-shadow:0 6px 14px rgba(30,111,217,.22)}
.brand em{font-style:normal;color:var(--accent);font-size:12px;margin-left:2px}
.klass{font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--rule);
       padding:4px 8px;border-radius:999px;max-width:230px}
.klass:hover{border-color:var(--accent-line);color:var(--accent)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.saved{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.tabs{max-width:1120px;margin:0 auto;padding:0 18px;display:flex;gap:5px}
.tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:10px 10px 0 0;
     padding:9px 13px 8px;font-size:13.5px;font-weight:600;color:var(--ink-3);transition:color .14s,background .14s}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);border-bottom-color:var(--accent)}
.tab:hover:not(:disabled){color:var(--ink)}
.tab:disabled{opacity:.4;cursor:not-allowed}
.tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--mid);
          vertical-align:2px;margin-left:5px}

.wrap{max-width:1120px;margin:0 auto;padding:24px 18px 80px}

/* 버튼 */
.ghost{background:var(--surface);border:1px solid var(--rule-strong);
       min-height:38px;padding:6px 13px;font-size:12.5px;color:var(--ink-2);border-radius:11px;
       transition:border-color .14s,color .14s,background .14s,transform .14s}
.ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--raise)}
.ghost.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.primary{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);
         min-height:40px;border-radius:11px;padding:7px 19px;font-size:13.5px;font-weight:650;
         box-shadow:0 5px 12px rgba(30,111,217,.18);transition:background .14s,border-color .14s,transform .14s,box-shadow .14s}
.primary:hover:not(:disabled){background:var(--accent-deep);border-color:var(--accent-deep);transform:translateY(-1px);box-shadow:0 8px 18px rgba(30,111,217,.22)}
.primary:disabled{opacity:.4;cursor:not-allowed}
.danger{color:var(--low);border-color:var(--rule-strong)}
.danger:hover{border-color:var(--low);color:var(--low)}
.link{background:none;border:0;color:var(--accent);font-size:12.5px;padding:0;text-decoration:underline}

select,input[type=text],textarea{background:var(--surface);border:1px solid var(--rule-strong);
  min-height:40px;border-radius:11px;padding:7px 11px;font-size:13.5px;transition:border-color .14s,box-shadow .14s}
select:focus,input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
textarea{line-height:1.7}

/* 패널 */
.panel{background:var(--surface);border:1px solid color-mix(in srgb,var(--rule) 78%,transparent);border-radius:18px;box-shadow:var(--shadow-card)}
.ph{display:flex;align-items:center;gap:10px;min-height:56px;padding:14px 20px;border-bottom:1px solid var(--rule)}
.ph h2{font-size:16px;font-weight:700;letter-spacing:-.015em}
.ph .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.pb{padding:20px}
.stack{display:flex;flex-direction:column;gap:24px}

/* ── 2단 ── */
.cols{display:grid;grid-template-columns:228px minmax(0,1fr);gap:20px;align-items:start;min-width:0}
.cols>.panel{min-width:0;max-width:100%}
@media (max-width:820px){.cols{grid-template-columns:1fr}}

/* 명렬표 */
.roster-panel{position:sticky;top:108px}
.roster{max-height:calc(100vh - 292px);overflow:auto}
.rrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto 16px;gap:8px;align-items:center;width:100%;
      background:none;border:0;padding:0 10px 0 12px;height:32px;border-radius:8px;
      text-align:left;font-size:13px;color:var(--ink);cursor:pointer}
.rrow:hover{background:var(--raise)}
.rrow .x{background:none;border:0;color:var(--ink-3);font-size:15px;line-height:1;padding:0;
         opacity:0;transition:opacity .1s}
.rrow:hover .x,.rrow[aria-current="true"] .x,.rrow .x:focus-visible{opacity:1}
.rrow .x:hover{color:var(--low)}
@media (prefers-reduced-motion:reduce){.rrow .x{transition:none}}
.rrow[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.rrow .no{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.rrow .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.rrow[aria-current="true"] .cnt{color:var(--accent)}

/* 학생 추가 줄 */
.addstu{display:flex;gap:5px;padding:8px 10px;border-top:1px solid var(--rule);background:var(--sink)}
.addstu input{flex:1;min-width:0;background:var(--surface)}
.addstu button{font-family:var(--mono);font-weight:700;padding:6px 10px;border-radius:12px;white-space:nowrap}

/* 말풍선 도움말 */
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);
  width:210px;background:var(--ink);color:var(--surface);font-family:var(--sans);font-weight:400;
  font-size:11.5px;line-height:1.5;padding:6px 8px;border-radius:3px;text-align:left;
  opacity:0;visibility:hidden;transition:opacity .12s;z-index:40;pointer-events:none}
.tip:hover::after,.tip:focus-visible::after{opacity:1;visibility:visible}
@media (prefers-reduced-motion:reduce){.tip::after{transition:none}}

/* 학생 머리 */
.shead{padding:18px 20px 15px;border-bottom:1px solid var(--rule);display:flex;
       align-items:baseline;gap:12px;flex-wrap:wrap}
.shead .nm{font-size:20px;font-weight:700;letter-spacing:-.02em}
.shead .meta{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.shead .r{margin-left:auto;display:flex;gap:6px;align-items:baseline}

/* 슬롯 */
.slots{display:flex;flex-wrap:wrap;gap:5px;padding:11px 20px;border-bottom:1px solid var(--rule);
       background:var(--sink)}
/* 축 하나와 그 하위 선택을 한 덩어리로 — 고른 축만 옆으로 펼쳐진다 */
.slotgrp{display:inline-flex;gap:4px;align-items:center;border-radius:999px}
.slotgrp.on{background:var(--surface);border:1px solid var(--accent-line);padding:3px 4px 3px 3px}
.slotgrp.on select{border-radius:999px;padding:4px 10px;font-size:12px;height:28px}
.slot{background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:5px 12px;
      font-size:12px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.slot:hover{border-color:var(--accent-line)}
.slot b{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-3)}
.slot .ok{width:5px;height:5px;border-radius:50%;background:var(--good)}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);
                           color:var(--accent);font-weight:600}
.slot[aria-pressed="true"] b{color:var(--accent)}

/* 구역 */
.sec{padding:18px 20px;border-bottom:1px solid var(--rule)}
.sec:last-child{border-bottom:0}
.sechead{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.sechead .r{margin-left:auto;display:flex;gap:14px;align-items:baseline}

/* 관찰 담기 */
.catch{border:1px solid var(--accent-line);border-radius:16px;
       background:linear-gradient(135deg,var(--accent-soft),var(--raise) 52%,var(--surface));
       padding:17px;box-shadow:inset 3px 0 0 var(--accent)}
.catch-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:7px}
.catch-top .where{font-size:12px;font-weight:600;color:var(--accent)}
.catch-in{display:flex;gap:6px}
.catch-in input{flex:1;background:var(--surface)}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:7px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--accent-line);
      background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 9px;
      font-size:11px;font-family:var(--mono)}
.chip.std{gap:6px;max-width:100%;font-family:var(--sans);font-size:11.5px;white-space:normal}
.chip.std b{font-family:var(--mono);font-weight:600}
.chip button{background:none;border:0;color:inherit;padding:0 0 0 2px;line-height:1}

/* 키워드 */
.kw{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.kw select{flex:0 0 auto;max-width:170px}
.kw button{flex:0 0 auto;white-space:nowrap}
/* 낱말 여닫이 — 접힌 자리는 한 줄만 차지한다 */
.kwbar{display:flex;gap:8px;align-items:center;margin-top:7px}
.kwcol{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0;flex:1}
.kwtog{background:none;border:0;padding:0;font-size:12px;color:var(--ink-3);
       display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.kwtog:hover{color:var(--accent)}
.kwtog .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.kwtog::after{content:"▾";font-size:9px;transition:transform .12s}
.kwtog[aria-expanded="true"]::after{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.kwtog::after{transition:none}}
.kwchips{display:flex;flex-wrap:wrap;gap:5px;max-height:62px;overflow-y:auto;padding-right:2px}
/* 역할 — 그 장면에서 이 아이가 맡은 것. 한 줄이고, 안 골라도 담긴다 */
.rolebar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:7px 0 0}
.rolebar .rl{font-size:12px;color:var(--ink-3);margin-right:3px}
.rlc{background:var(--surface);border:1px solid var(--rule);border-radius:999px;
     padding:3px 11px;font-size:12.5px;font-family:inherit;color:var(--ink-2);cursor:pointer;line-height:1.5}
.rlc:hover{border-color:var(--accent-line);color:var(--accent)}
.rlc[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);
     color:var(--accent-deep);font-weight:600}
.kwc{background:var(--surface);border:1px solid var(--rule);border-radius:999px;
     padding:2px 10px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.kwc:hover{border-color:var(--accent-line);color:var(--accent);background:var(--accent-soft)}
/* 평가를 고르기 전 — 여기서 화면이 끝난다 */
.pickfirst{padding:14px 2px 4px;font-size:13px;color:var(--ink-3)}
.empty-action{display:flex;align-items:center;gap:13px;padding:15px 16px;border:1px dashed var(--accent-line);
              border-radius:14px;background:color-mix(in srgb,var(--surface) 72%,transparent)}
.empty-action .mark{display:grid;place-items:center;flex:0 0 auto;width:34px;height:34px;border-radius:11px;
                    background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-weight:700}
.empty-action .copy{min-width:0;line-height:1.45}.empty-action .copy b{display:block;color:var(--ink);font-size:13.5px}
.empty-action .copy span{display:block;margin-top:3px;color:var(--ink-3);font-size:12px}
.empty-action .actions{margin-left:auto;display:flex;gap:7px;flex:0 0 auto}
.empty-action .mark .ic{width:19px;height:19px}
.prep-empty{min-height:136px;border-color:var(--rule-strong);background:var(--raise)}
.record-empty{margin-top:10px}
/* 수업 설계 — 성취기준 원문은 대조하는 글이라 자르지 않고 통째로 보인다 */
.dsg-std{margin-top:5px;padding:7px 10px;border-radius:9px;background:var(--raise);
         border:1px solid var(--rule);font-size:12.5px;line-height:1.6}
.dsg-std .mono{color:var(--accent);font-size:11.5px;margin-right:5px}
.dsg-fb{display:block;margin-top:3px;font-style:normal;color:var(--ink-3);font-size:12px}
/* 학습목표는 한 줄로 끝나지 않는다 — 쓰는 만큼 늘어난다 */
textarea.goal{width:100%;min-height:66px;font-size:13.5px;line-height:1.7;resize:none;overflow:hidden}
/* 활동 카드 — 표가 아니라 카드다. 교사가 고치는 것이 주 작업이라 늘 열려 있다 */
.fl{border:1px solid var(--rule);border-radius:12px;padding:11px 12px;margin-top:9px;background:var(--surface)}
.fl.nosee{border-color:var(--mid);background:color-mix(in srgb,var(--mid) 5%,var(--surface))}
.fl-head{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.fl-head select{flex:0 0 auto}.fl-head .nm{flex:1 1 180px;min-width:120px;font-weight:600}
.fl-head .mn{width:62px;text-align:right}
.fl-row{display:flex;gap:8px;margin-top:7px;align-items:flex-start}
.fl-row .lab{flex:0 0 34px;padding-top:7px;font-size:11.5px;color:var(--ink-3)}
.fl-row textarea,.fl-row input{flex:1;min-width:0}
.fl-row textarea{min-height:38px;font-size:12.5px;line-height:1.65;resize:none;overflow:hidden}
.fl-act{display:flex;gap:5px;justify-content:flex-end;margin-top:7px}
.fl-act button{padding:3px 9px;font-size:11.5px;min-height:0}
.fl-msg{margin-top:6px;font-size:11.5px;color:var(--mid)}
.fl-see{display:flex;flex-wrap:wrap;gap:5px;padding-top:2px}
.fl-see .chip{cursor:pointer}
.fl-see .chip:disabled{opacity:.35;cursor:not-allowed}
.fl-see .hookc[aria-pressed="true"]{background:var(--ink-3);border-color:var(--ink-3)}
.dsg-elem{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:9px 12px;margin-bottom:4px;
          border-radius:11px;background:var(--raise);border:1px solid var(--rule);font-size:13px}
.dsg-elem .lab{margin:0;flex:0 0 auto}.dsg-elem b{color:var(--ink)}
/* 평가 요소 → 관찰 관점은 위아래가 아니라 안팎이다. 선으로 매어 둔다 */
.dsg-name{font-size:14px;font-weight:650;color:var(--ink)}
.dsg-crit{margin-top:3px;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.dsg-sub{margin:9px 0 0 4px;padding-left:13px;border-left:2px solid var(--accent-line)}
.dsg-sub .lab{margin-bottom:5px}
.fl-sum{display:flex;align-items:center;gap:9px;margin-top:11px;padding:9px 12px;border-radius:11px;
        background:var(--raise);border:1px solid var(--rule);font-size:12.5px}
.fl-sum b{font-family:var(--mono);font-size:14px}
.fl-sum .over{color:var(--low)}.fl-sum .fit{color:var(--good)}
.hint.over{color:var(--low)}
.sh .fl-head .st{flex:1 1 200px;font-weight:600}
.sh-from{margin-top:5px;font-size:11.5px;color:var(--ink-3)}
.panel-sub{margin-top:12px;padding:12px 13px;border-radius:12px;
           border:1px solid var(--rule);background:var(--raise)}
.imgprev:not(:empty){margin-top:10px;padding:9px;border-radius:11px;background:var(--surface);
                     border:1px solid var(--rule)}
.imgprev img{display:block;max-width:100%;height:auto;border-radius:7px}
/* 손이 먼저다 — 막지 않는다. 자리를 보여 주고 판단은 교사가 한다 */
.hands{margin-top:11px;padding:12px 13px;border-radius:12px;border:1px solid var(--mid);
       background:color-mix(in srgb,var(--mid) 6%,var(--surface))}
.hands h4{margin:0 0 4px;font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:7px}
.hands h4 .ic{width:17px;height:17px;color:var(--mid)}
.hands p{margin:0 0 9px;font-size:12.5px;line-height:1.65;color:var(--ink-2)}
.hands label{display:flex;gap:7px;align-items:flex-start;margin-top:5px;font-size:12.5px;
             line-height:1.55;color:var(--ink-2);cursor:pointer}
.hands label input{margin-top:3px;flex:0 0 auto}
.hands .why{width:100%;margin-top:8px}
.hands .act{display:flex;gap:7px;justify-content:flex-end;margin-top:9px}
.hands.done{border-color:var(--rule);background:var(--raise)}
.hands.done h4 .ic{color:var(--ink-3)}
/* 고른 평가 — 무엇을 기록하는 중인지 한 줄로 */
.pickhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:10px;
          padding-bottom:9px;border-bottom:1px solid var(--rule)}
.pickhead .pl{font-size:13.5px;font-weight:600;color:var(--ink)}
.pickhead .pc{font-size:12px;color:var(--ink-3);min-width:0}
.pickhead .r{margin-left:auto}
.lvhead{font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);font-weight:600;margin-top:11px}
.lvwhy{font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.6;min-height:1.6em}
/* 「피드백」 — 판정 옆에 다음 걸음이 붙는다. 여기도 중성이다(위 §5 주석) */
.lvfb{display:block;margin-top:3px;color:var(--ink);font-weight:600}
.lvfb::before{content:"→ ";color:var(--ink-3);font-weight:400}
/* 수준 — 축(파랑)도 근거(살구)도 경고(의미색)도 아니다. 중성으로 남긴다.
   의미색·게이지·정렬을 여기 쓰면 §5 색 전용권이 무너진다. */
.lv{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:7px}
.lvc{background:var(--surface);border:1px solid var(--rule);border-radius:999px;
     padding:3px 12px;font-size:12px;color:var(--ink-2)}
.lvc:hover{border-color:var(--rule-strong);color:var(--ink)}
.lvc[aria-pressed="true"]{border-color:var(--rule-strong);color:var(--ink);font-weight:600;background:var(--raise)}
/* 복사한 자국 — 어디까지 넘겼는지 알려 준다 */
.foot .moved{font-size:11.5px;color:var(--good);background:var(--good-soft);border-radius:999px;padding:2px 9px;white-space:nowrap}
.progress-table .mvtag{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);background:var(--sink);border-radius:999px;padding:1px 8px}
.progress-table .mvtag.all{color:var(--good);background:var(--good-soft)}
.ph .sep{margin:0 6px;color:var(--rule-strong)}
.lvtag{font-size:11.5px;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;
       padding:1px 8px;white-space:nowrap}
.lvc:disabled{opacity:.35}
/* 결석·미제출은 수준이 아니다 — 칸을 갈라 두고 채워진 모양도 다르게 한다 */
.lvsep{width:1px;align-self:stretch;background:var(--rule);margin:0 4px}
.offc{background:none;border:1px dashed var(--rule-strong);border-radius:999px;
      padding:3px 12px;font-size:12px;color:var(--ink-3)}
.offc:hover{border-color:var(--ink-3);color:var(--ink-2)}
.offc[aria-pressed="true"]{border-style:solid;border-color:var(--ink-3);
      background:var(--sink);color:var(--ink);font-weight:600}

/* 관찰 목록 */
.memo{display:grid;grid-template-columns:42px 68px minmax(0,1fr) 22px;gap:10px;align-items:baseline;
      padding:6px 0 8px}
.memo .dt{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.memo .src{font-size:11.5px;color:var(--warm);background:var(--warm-soft);border:1px solid var(--warm-line);border-radius:999px;
           padding:1px 9px;justify-self:start;white-space:nowrap}
.memo .body{word-break:break-word;line-height:1.65}
.memo .body{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
/* 동그라미는 「무엇을 보고 썼는가」 하나에만 두른다. 이 도구가 관찰마다 묻는 것이고,
   기재요령이 근거로 인정하는 자료가 무엇인지 가르는 자리라서다.
   나머지는 색과 크기로만 갈린다 — 다 두르면 무엇이 중한지 알 수 없다. */
.memo .rtag{font-size:12px;color:var(--ink-3);white-space:nowrap}
.memo .rtag:after{content:"·";margin-left:6px;color:var(--rule-strong)}
.memo .lvtag{font-size:12px;font-weight:600;color:var(--ink-2);border:0;background:none;padding:0;white-space:nowrap}
.memo .gmark{font-style:normal;font-weight:700;margin-left:3px}
.memo .gmark.up{color:var(--good)}
.memo .gmark.down{color:var(--mid)}
.memo .gmark.flat{color:var(--ink-3)}
.memo .meta{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;margin-top:2px}
.memo .code{font-family:var(--mono);font-size:11px;color:var(--accent)}
.memo .code.legacy{color:var(--warm)}
.memo .code em{font-style:normal;font-size:10px;border:1px solid var(--warm-line);border-radius:999px;padding:0 5px}
.memo .stdinline{font-size:11.5px;color:var(--ink-3)}
.memo .obs{flex:1;min-width:0;line-height:1.6;color:var(--ink)}
.ic{width:15px;height:15px;flex:0 0 auto;vertical-align:-2px}
.kwai{display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:var(--on-accent);
      border:1px solid var(--accent);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600}
.kwai:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.ai-need{border-style:dashed!important;background:var(--surface)!important;color:var(--ink-3)!important;box-shadow:none!important}
.ai-need:hover{border-color:var(--accent)!important;color:var(--accent)!important}
.ai-need small{font-size:10px;font-weight:500;color:inherit}
.sentence-actions{gap:7px!important;align-items:center!important;flex-wrap:wrap}
.ai-actions{display:inline-flex;gap:6px;align-items:center}
.ai-action{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:6px 12px;
           border:1px solid var(--accent-line);border-radius:11px;background:linear-gradient(135deg,var(--accent-soft),var(--surface));
           color:var(--accent);font-size:12.5px;font-weight:650;box-shadow:0 4px 10px rgba(30,111,217,.10);
           transition:transform .14s,border-color .14s,box-shadow .14s,background .14s}
.ai-action.review{border-color:var(--rule-strong);background:var(--surface);color:var(--ink-2);box-shadow:none}
.ai-action:hover:not(:disabled){transform:translateY(-1px);border-color:var(--accent);box-shadow:0 7px 16px rgba(30,111,217,.14)}
.ai-action.review:hover:not(:disabled){color:var(--accent);background:var(--raise)}
.ai-action:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.ai-action .ic{width:15px;height:15px}.ai-action small{font-size:10px;font-weight:500}
.ai-connect-card{display:flex;align-items:center;gap:10px;margin:9px 0 2px;padding:10px 12px;border:1px dashed var(--accent-line);
                 border-radius:12px;background:var(--accent-soft);color:var(--ink-2);font-size:12.5px}
.ai-connect-card .ic{color:var(--accent)}.ai-connect-card .ghost{margin-left:auto;flex:0 0 auto}
.chip.std.legacy{border-color:var(--warm-line);background:var(--warm-soft);color:var(--warm)}
.slot.sub{font-size:11.5px;padding:4px 10px}
.log{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
.loghead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.loghead .link{margin-left:auto}
.logrow{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:baseline;
        padding:4px 0 8px;font-size:13px}
.logrow .dt{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.logrow .t{line-height:1.6}
.logrow .b{display:flex;gap:6px;opacity:0;transition:opacity .1s}
.logrow:hover .b,.logrow:focus-within .b{opacity:1}
.rub{display:flex;flex-direction:column;gap:13px}
.rrow2{display:grid;grid-template-columns:88px minmax(0,1fr);column-gap:6px;row-gap:4px}
.rrow2 .rfl{font-size:11.5px;color:var(--ink-3);align-self:center;text-align:right;padding-right:2px}
.rrow2 textarea{min-height:40px;height:40px;resize:none;overflow-y:hidden;white-space:pre-wrap;
                overflow-wrap:anywhere;line-height:1.55}
.rubbox{flex-basis:100%;margin-top:6px;font-size:12.5px}
.rubbox summary{color:var(--ink-3);font-size:12px}
.rubbox>div{padding-top:6px}
.rubbox p{margin:0 0 6px;color:var(--ink-2)}
.rline{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;padding:2px 0;color:var(--ink-2)}
.rline b{color:var(--accent);font-weight:600;font-size:12px}
.memo .task{font-size:11px;color:var(--ink-3);margin-right:6px}
.memo .clip{background:none;border:0;padding:0 0 0 6px;font-size:12px;line-height:1;opacity:.75}
.memo .clip:hover{opacity:1}
.memo .del{background:none;border:0;color:var(--ink-3);font-size:13px;padding:0;opacity:0}
.memo:hover .del{opacity:1}
.memo .del:hover{color:var(--low)}
.memo .mv{background:none;border:0;color:var(--ink-3);font-size:11.5px;padding:0 4px 0 0;opacity:0;white-space:nowrap}
.memo:hover .mv,.memo:focus-within .mv{opacity:1}
.memo .mv:hover{color:var(--accent)}
/* 산출물 나눠 담기 — 왼쪽에 사진(근거), 오른쪽에 번호. 요약은 건수만 센다 */
#adlg{width:min(940px,96vw)}
.abody{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0;max-height:64vh}
.ashot{padding:14px 16px;border-right:1px solid var(--rule);min-width:0;display:flex;flex-direction:column;gap:8px}
.apic{background:var(--sink);border:1px solid var(--rule);border-radius:8px;height:340px;
      display:flex;align-items:center;justify-content:center;overflow:hidden}
.apic img{max-width:100%;max-height:100%;object-fit:contain}
.apic .none{color:var(--ink-3);font-size:12.5px}
.ameta{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.aside{display:flex;flex-direction:column;min-width:0}
.aside .nogrid{flex:1;align-content:flex-start}
.ahint{padding:0 16px 12px;font-size:11.5px;color:var(--ink-3);line-height:1.6}
.nogrid button .got{font-family:var(--mono);font-size:10.5px;color:var(--accent)}
@media (max-width:760px){.abody{grid-template-columns:1fr}.ashot{border-right:0;border-bottom:1px solid var(--rule)}.apic{height:210px}}
/* 학생 고르기 격자 — 번호와 이름만. 수준은 여기 오지 않는다 */
.nogrid{display:flex;flex-wrap:wrap;gap:6px;padding:14px 16px;max-height:52vh;overflow-y:auto}
.nogrid button{display:inline-flex;gap:6px;align-items:baseline;background:var(--surface);
  border:1px solid var(--rule);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink-2)}
.nogrid button .no{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.nogrid button:hover{border-color:var(--accent-line);color:var(--accent)}
.nogrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);
  color:var(--accent);font-weight:600}
.nogrid button[aria-pressed="true"] .no{color:var(--accent)}
.nogrid button[disabled]{opacity:.4}
.empty{color:var(--ink-3);font-size:12.5px;padding:14px 0;text-align:center}
.empty b{display:block;color:var(--ink-2);font-weight:600;margin-bottom:2px}

/* 문장 */
textarea.draft{width:100%;min-height:132px;resize:vertical;font-size:15px;line-height:1.9}
/* 등급1 위반이 있으면 문장 칸 자체가 붉어진다 — 검사 목록까지 내려보지 않아도 보인다 */
textarea.draft.block{border:1.5px solid var(--low)}
.meter{display:flex;gap:14px;align-items:baseline;margin-top:7px;font-size:11.5px;color:var(--ink-3)}
.meter b{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);font-weight:600}

/* 검사 */
.scan{margin-top:12px}
.scan-head{display:flex;align-items:baseline;gap:10px;padding-bottom:7px}
.tally{font-family:var(--mono);font-size:12px}
.tally .b{color:var(--low);font-weight:700}
.tally .w{color:var(--mid);font-weight:700}
.tally .none{color:var(--good);font-weight:600;font-family:var(--sans);font-size:12.5px}
.f{border-top:1px solid var(--rule)}
.f summary{display:flex;align-items:baseline;gap:8px;padding:6px 2px;font-size:13px}
.f summary:hover{background:var(--raise)}
/* 위반·주의는 도로 표지다(§8-10·11) — 본문 아이콘(1.8)보다 굵고 색이 고정이다 */
.f .mk{font-size:9px;line-height:1.9;display:inline-flex;align-items:center}
.f .mk .ic,td.mk .ic{width:16px;height:16px;stroke-width:2;vertical-align:0}
.f.block .mk{color:var(--low)} .f.warn .mk{color:var(--mid)}
/* 검사 기준표는 같은 표지를 쓰는 범례다 */
td.mk{text-align:center;line-height:1} td.mk.block{color:var(--low)} td.mk.warn{color:var(--mid)}
.f .hit{font-family:var(--mono);font-size:12px;padding:0 4px;border-radius:2px}
.f.block .hit{background:var(--low-soft);color:var(--low)}
.f.warn .hit{background:var(--mid-soft);color:var(--mid)}
.f .to{color:var(--ink-2);font-size:12.5px}
.f .r{margin-left:auto;display:flex;gap:8px;align-items:baseline}
.f.done .mk{color:var(--good)}
.f.done .hit{background:var(--good-soft);color:var(--good)}
.f.done summary{opacity:.85}
.f .why{padding:2px 2px 9px 26px;font-size:12px;color:var(--ink-2)}
.f .basis{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.fix{background:var(--surface);border:1px solid var(--accent-line);color:var(--accent);
     border-radius:8px;padding:1px 8px;font-size:11.5px}

/* 게이트 */
.gate{margin-top:16px;background:var(--sink);border:1.5px solid var(--rule-strong);border-radius:8px;padding:16px 20px}
.gate .row{display:flex;flex-wrap:wrap;gap:6px 14px;margin:7px 0 10px}
.gate label{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-3);cursor:pointer}
.gate label.on{color:var(--ink)}
.gate input{accent-color:var(--accent)}
.gate .note{font-size:12.5px;color:var(--ink-2);margin:0 0 10px}
.gate .foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gate .msg{font-size:11.5px;color:var(--ink-3)}
.gate .msg.warn{color:var(--low)}

/* 짚어주기 */
.pt{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:baseline;
    padding:12px 16px;border-bottom:1px solid var(--rule);font-size:14px}
.pt:last-child{border-bottom:0}
.pt .mk{font-size:10px;line-height:1.7}
.pt.high .mk{color:var(--low)} .pt.mid .mk{color:var(--mid)} .pt.low .mk{color:var(--ink-3)}
.pt .who{font-size:12px;color:var(--ink-3);margin-top:1px}
.pt .go{white-space:nowrap}
.clear{padding:16px 14px;font-size:13px;color:var(--good);display:flex;gap:8px;align-items:baseline}
.clear span{color:var(--ink-3);font-size:12px}

/* 살펴보기 첫눈 요약 */
.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.summary-card{--tone:var(--accent);position:relative;min-width:0;padding:16px 17px 15px;border:1px solid var(--rule);
              border-radius:16px;background:var(--surface);box-shadow:var(--shadow-card);overflow:hidden}
.summary-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tone)}
.summary-card.evidence{--tone:var(--warm)}.summary-card.complete{--tone:var(--accent)}
.summary-card.attention{--tone:var(--mid)}.summary-card.attention.ok{--tone:var(--good)}
.summary-card.ethics{--tone:var(--mid)}.summary-card.ethics.ok{--tone:var(--good)}
.summary-label{font-size:12px;font-weight:600;color:var(--ink-2)}
.summary-value{display:block;margin-top:5px;font-family:var(--mono);font-size:25px;line-height:1.15;font-weight:700;color:var(--ink)}
.summary-meta{display:block;margin-top:5px;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 쓰기 전 확인 — 체크는 ui.ethics에 남는다. 확인해도 사라지지 않고 흐려질 뿐이다 */
.eth{list-style:none;margin:0;padding:0}
.eth li{border-bottom:1px solid var(--rule)}
.eth li:last-child{border-bottom:0}
.eth label{display:grid;grid-template-columns:16px minmax(0,1fr);gap:11px;align-items:start;
           padding:12px 16px;cursor:pointer;font-size:13.5px}
.eth input{margin:3px 0 0;accent-color:var(--accent)}
.eth b{font-weight:600}
.eth em{display:block;font-style:normal;font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.65}
.eth li.on b{color:var(--ink-3);font-weight:400}

/* 표 */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--rule)}
th{font-size:10.5px;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
/* 진행 표 — 글자 칩 대신 근거유형 아이콘, 퍼센트 대신 원형 게이지 */
.srcs{display:flex;gap:7px;align-items:center;color:var(--warm)}
.srcs .ic{width:14px;height:14px}
.srcs .tot{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:2px}
.gau{width:18px;height:18px;vertical-align:-4px}
/* 관찰이 3회 미만인 행 — 짚어주기 계열이므로 의미색을 쓴다 */
tr.thin td:first-child{box-shadow:inset 3px 0 0 var(--low)}
.tsum{padding:10px 20px;font-size:12.5px;color:var(--ink-2)}
/* 과제 행 펼침 — 루브릭 전문과 수준별 인원. 숫자는 무색이고 학생 단위로 세지 않는다 */
.trow{cursor:pointer}
.tdetail td{background:var(--raise);padding:10px 14px}
.tcount{margin-top:8px;font-size:12px;color:var(--ink-2)}
.stu{display:flex;gap:8px;align-items:baseline}
.stu .no{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
/* 행 hover에서만 드러나는 조작 버튼 */
tr .rowact{opacity:0;transition:opacity .1s}
tr:hover .rowact,tr:focus-within .rowact{opacity:1}
@media (prefers-reduced-motion:reduce){tr .rowact{transition:none}}
.muted{color:var(--ink-3);font-size:12.5px}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* 활동지·수업자료는 파일이 아니라 만드는 법으로 나간다 */
.promptbox{margin-top:12px;padding:11px 13px;border:1px solid var(--rule);border-radius:12px;background:var(--raise)}
.promptbox .prow{display:flex;align-items:center;gap:10px;padding:5px 0}
.promptbox .prow + .prow{border-top:1px solid var(--rule)}

             box-shadow:0 6px 20px rgba(31,79,132,.05)}

.setup-steps>span:not(:last-child)::after{content:"";height:1px;flex:1;min-width:10px;margin:0 10px;background:var(--rule-strong)}

                background:var(--accent-soft);color:var(--accent);font-size:11px}

/* 성취기준 창 */
dialog{border:1px solid var(--rule-strong);border-radius:16px;box-shadow:var(--shadow-pop);background:var(--surface);color:var(--ink);
       padding:0;width:min(700px,94vw);max-height:86vh}
/* 설계는 원문·증거·관점을 함께 놓고 하는 작업이다 — 그만큼 상이 넓어야 한다 */

.dbar{border-top:1px solid var(--rule);background:var(--raise)}

@media (max-width:640px){ .dbar-name{display:none} .dstep{padding:4px 7px;font-size:11.5px} }
.dtask{padding:12px 14px;border-bottom:1px solid var(--rule);background:var(--raise);
       max-height:66vh;overflow:auto}

.dtask .rl{width:100%}
.design-source{margin-bottom:10px;padding:11px 12px 0;border:1px solid var(--accent-line);border-radius:12px;
               background:linear-gradient(135deg,var(--accent-soft),var(--surface))}

          border-radius:8px;font-size:12.5px;line-height:1.7;color:var(--ink-2);max-height:132px;overflow-y:auto}

/* 고르는 중에도 고른 것이 눈앞에 남아야 한다 — 여러 개를 견주는 일이기 때문이다 */
#dlg-chosen{margin:0;padding:10px 14px 9px;flex:0 0 auto;max-height:154px;overflow:auto;
            border-bottom:1px solid var(--accent-line);background:var(--accent-soft)}

                padding:3px 11px;font-size:12px;color:var(--ink-2);display:inline-flex;gap:5px;align-items:center}

        border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600}

/* ══ 세특 문장 골격과 교과 역량 ══

                   "궁금한 점을 질문함","꼼꼼히 확인함","자신 있게 발표함","모둠에서 협력함","맡은 일을 책임짐",

const ROLES = ["이끎","기록","발표","도움 줌","도움 받음","질문","혼자 해냄"];
/* 초안에서 관찰 앞에 붙는 어구. 명사형 문장에 그대로 이어 붙는다 */
const ROLE_PHRASE = {

const BAND_OF = {1:"1~2",2:"1~2",3:"3~4",4:"3~4",5:"5~6",6:"5~6"};
const INTEGRATED = "통합교과", INTEGRATED_LABEL = "바른 생활·슬기로운 생활·즐거운 생활";
/* 진로 성취기준은 학년군이 갈리지 않는다 — 초등 6년이 한 벌이다.
   교과처럼 band()로 찾으면 언제나 빈 결과가 나오므로 조회를 여기로 모은다. */
const CAREER = "진로", BAND_FREE = {[CAREER]:"1~6"};
const stdAreas = (subj, g) => (STD[subj] || {})[BAND_FREE[subj] || g || band()] || [];

/* ── 코드 사전 ── */
const CODEMAP = {};
for(const subj of Object.keys(STD))
  for(const g of Object.keys(STD[subj]))
    for(const a of STD[subj][g])
      for(const [c,t] of a.s) CODEMAP[c] = {subject:subj, grade:g, area:a.a, text:t};

/* ══ 영역 → 키워드 (§10-2) ══
   STD의 영역명은 "듣기 · 말하기", KW는 "듣기·말하기"다. 정규화 없이 비교하면 전부 미스난다.
   사회·과학은 표기가 아니라 층위가 다르다 — STD는 단원, KW는 대영역. 그래서 아래 다리가 필요하다.
   자료(standards.compact.json)에 대영역 필드가 생기면 AREA_GROUP은 지운다. */
const normA = s => String(s).replace(/[\s·,]/g, "");
const AREA_GROUP = {
  사회: {"우리가사는곳":"지리","지도로만나는우리지역":"지리","다양한환경과삶의모습":"지리",
        "일상에서만나는과거":"역사","옛날과오늘날의생활모습":"역사","우리지역의문화유산":"역사",
        "사회변화와다양한문화":"일반사회","경제활동과지역간교류":"일반사회","민주주의와자치":"일반사회",
        "지역문제를해결하고지역을알리는노력":"일반사회",

        "세계의자연환경":"지리","지구촌사람들":"지리",
        "유적과유물로살펴본옛사람들의생활":"역사","달라지는시대변화하는생활모습":"역사",
        "식민통치와저항전쟁이바꾼사회와생활":"역사","평화통일을위한노력민주화와산업화":"역사",
        "법과인권의보장":"일반사회","민주주의와시민참여":"일반사회","시장경제와국가간거래":"일반사회"},
  과학: {"힘과우리생활":"운동과에너지","소리의성질":"운동과에너지","자석의이용":"운동과에너지",
        "물체와물질":"물질","물의상태변화":"물질","여러가지기체":"물질",
        "동물의생활":"생명","식물의생활":"생명","생물의한살이":"생명",
        "다양한생물과우리생활":"생명","생물과환경":"생명",
        "지구와바다":"지구와우주","땅의변화":"지구와우주","밤하늘관찰":"지구와우주",
        "감염병과건강한생활":"과학과사회","기후변화와우리생활":"과학과사회",
        "빛의성질":"운동과에너지","열과우리생활":"운동과에너지","물체의운동":"운동과에너지",

        "우리몸의구조와기능":"생명","식물의구조와기능":"생명",

};
/* 고른 성취기준에서 영역이 따라 나온다 — 영역은 고르는 것이 아니다 */
const dlgAreas = () => [...new Set([...(dlgState?.sel || [])].map(c => CODEMAP[c]?.area).filter(Boolean))];
/* 여러 교과를 담았을 때 이 과제가 어느 교과에 놓이는가.
   나갈 때 보던 교과가 아니라 담은 것에서 정한다 — 진로는 교과가 아니므로 교과가 있으면 그쪽을 따른다. */
const dlgSubjects = () => [...new Set([...(dlgState?.sel || [])].map(c => CODEMAP[c]?.subject).filter(Boolean))];
const mainSubject = () => { const s = dlgSubjects(); return s.find(x => x !== CAREER) || s[0] || dlgState?.subject; };
/* 1차 이름 일치 → 2차 AREA_GROUP → 3차 실패(missed로 돌려 화면에 알린다) */
function kwOfAreas(subject, areas){
  /* 진로는 학년군이 갈리지 않는다 — 성취기준과 같은 규칙으로 찾는다 */
  const blocks = (KW.subj[subject] || {})[BAND_FREE[subject] || band()] || [];
  if(!areas || !areas.length) return {blocks:blocks.slice(0,1), missed:[]};
  const map = AREA_GROUP[subject] || {}, wanted = new Set(), missed = [];
  for(const a of areas){
    const n = normA(a);
    if(blocks.some(b => normA(b.a) === n)){ wanted.add(n); continue; }
    const g = map[n];
    if(g && blocks.some(b => normA(b.a) === normA(g))){ wanted.add(normA(g)); continue; }
    missed.push(a);
  }
  const hit = blocks.filter(b => wanted.has(normA(b.a)));

function toNominal(s){
  const m = String(s).match(/^([\s\S]*?)([가-힣]+)다$/);
  if(!m) return null;
  const head = m[1], stem = m[2], last = stem.slice(-1), rest = stem.slice(0,-1);
  const j = last.charCodeAt(0) - 0xAC00;
  if(j < 0 || j > 11171) return null;
  const jong = j % 28;
  if(/[았었였겠]/.test(last)) return head + stem + "음";
  if(last === "는") return head + rest + "음";
  if(jong === 4)  return head + rest + String.fromCharCode(0xAC00 + j - 4 + 16);   // 종성 ㄴ → ㅁ
  if(jong === 0)  return head + rest + String.fromCharCode(0xAC00 + j + 16);       // 받침 없음 → ㅁ
  return head + stem + "음";
}

function copyText(txt){
  const legacy = () => {
    const ta = document.createElement("textarea");
    ta.value = txt;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){}
    ta.remove();
    return ok;
  };
  if(!navigator.clipboard?.writeText) return Promise.resolve(legacy());
  return Promise.race([
    navigator.clipboard.writeText(txt).then(() => true),
    new Promise(res => setTimeout(() => res(null), 1500))
  ]).catch(() => null).then(r => r === true ? true : legacy());
}

const FDB = "trecord.files", FSTORE = "f";

function fdb(){
  return new Promise((ok,no) => {
    if(_fdb) return ok(_fdb);
    if(!window.indexedDB) return no(new Error("이 브라우저는 파일 보관을 지원하지 않습니다."));
    const r = indexedDB.open(FDB, 1);
    r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains(FSTORE)) r.result.createObjectStore(FSTORE); };
    r.onsuccess = () => ok(_fdb = r.result);
    r.onerror = () => no(r.error || new Error("파일 보관함을 열지 못했습니다."));
  });

function ftx(mode, fn){
  return fdb().then(db => new Promise((ok,no) => {
    const tx = db.transaction(FSTORE, mode), st = tx.objectStore(FSTORE);
    let out; try{ out = fn(st); }catch(e){ return no(e); }
    tx.oncomplete = () => ok(out && out.result !== undefined ? out.result : out);
    tx.onerror = () => no(tx.error);
  }));
}

/* 이미지는 긴 변 1600px·품질 0.72로 줄인다. PDF 등은 그대로 둔다. */
async function shrink(file){
  if(!/^image\//.test(file.type) || !window.createImageBitmap) return file;
  try{
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if(sc === 1 && file.size < 400*1024) return file;
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width*sc); c.height = Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, "image/jpeg", 0.72));
    return (b && b.size < file.size) ? b : file;
  }catch(e){ return file; }
}

const AIKEY = KEY + ".ai";
/* 공용 연결 — 키는 프록시 서버에만 있고 앱에는 주소만 둔다.
   비워 두면 예전처럼 각자 키로만 동작한다. 본인 키가 있으면 언제나 그쪽이 우선이다
   (공용 한도와 무관하게 쓰고, 그 호출은 프록시를 거치지 않는다). */
const AI_PROXY = "https://proxy-vercel-red.vercel.app";
/* 기본은 한도가 가장 넉넉한 안정판이다 — lite 계열이 무료 한도가 크고,
   `-latest` 별칭은 구글이 안정판을 갈아 끼워도 이름이 살아 있어 어느 날 404가 나지 않는다. */
let AI = {key:"", model:"gemini-flash-lite-latest", agreed:false, models:null};
try{ Object.assign(AI, JSON.parse(localStorage.getItem(AIKEY) || "{}")); }catch(e){}
const aiShared = () => !AI.key && !!AI_PROXY;
const aiBase = () => aiShared() ? AI_PROXY.replace(/\/+$/,"") : "https://generativelanguage.googleapis.com";
/* 개발용 — 로컬에서 띄운 화면(127.0.0.1·localhost)에서도 공용 연결을 쓰려면
   콘솔에서 localStorage['trecord.dev'] = '토큰' 을 한 번 넣어 둔다.
   토큰은 프록시의 DEV_TOKEN과 같아야 하고, 배포된 주소에서는 쓰이지 않는다. */
const aiDev = () => {
  try{
    if(!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return "";
    return localStorage.getItem("trecord.dev") || "";
  }catch(e){ return ""; }
};
const aiHead = () => {
  if(AI.key) return {"x-goog-api-key":AI.key};
  const d = aiDev();
  return d ? {"x-dev-token":d} : {};
};
const aiOn = () => !!((AI.key || AI_PROXY) && AI.agreed);
function aiSave(){ try{ localStorage.setItem(AIKEY, JSON.stringify(AI)); }catch(e){} }
/* 기본 후보. 실제 목록은 ‘모델 목록 가져오기’로 키에서 직접 받아온다. */
const AI_MODELS = ["gemini-flash-lite-latest","gemini-flash-latest","gemini-3.5-flash","gemini-2.5-flash"];
const aiModelList = () => {
  const seen = [...(AI.models||[]), ...AI_MODELS, AI.model].filter(Boolean);
  return [...new Set(seen)].sort(modelRank);
};
/* 이름만으로는 무엇이 넉넉한지 알기 어렵다 — 한 마디씩 붙인다 */
const modelNote = n => /lite/.test(n) ? "한도 넉넉" : /pro/.test(n) ? "한도 적음 · 어려운 판단" : "";
async function aiFetchModels(){
  if(!AI.key && !AI_PROXY) throw new Error("먼저 키를 넣어 주세요.");
  let res;
  try{
    res = await fetch(aiBase() + "/v1beta/models?pageSize=200", {headers:aiHead()});
  }catch(e){
    throw new Error("바깥으로 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.");
  }
  if(!res.ok) throw new Error(res.status === 400 || res.status === 403
    ? "키가 올바르지 않거나 권한이 없습니다." : "목록을 받지 못했습니다 (" + res.status + ")");
  const j = await res.json();
  const names = (j.models||[])
    .filter(m => (m.supportedGenerationMethods||[]).includes("generateContent"))
    .map(m => String(m.name||"").replace(/^models\//,""))
    .filter(n => /gemini/.test(n) && !AI_DROP.test(n));
  if(!names.length) throw new Error("쓸 수 있는 모델이 없습니다.");
  names.sort(modelRank);
  AI.models = names; aiSave();
  return names;
}
/* 이 앱이 시키는 일은 글·사진·PDF를 읽고 글을 쓰는 것뿐이다.
   음성 합성·이미지 생성·로보틱스·컴퓨터 조작·실시간 대화 모델은 목록에 올리지 않는다.
   preview·exp는 예고 없이 사라지거나 동작이 바뀌므로 안정판만 남긴다.
   (실측 2026-08-03: 키가 주는 58개 중 generateContent 42개 → 이 규칙으로 12개) */
const AI_DROP = /embedding|aqa|tts|audio|image|robotics|computer|omni|live|vision|learnlm|gemma|customtools|preview|-exp|latest-\d|-\d{3}$/;
/* `-latest` 별칭이 맨 위 — 구글이 안정판을 갈아 끼워도 이름이 살아 있어 가장 오래 간다.
   그다음은 최신 세대순, 같은 세대면 lite → flash → pro(한도가 넉넉한 쪽이 먼저). */
const modelGen = n => /latest/.test(n) ? 999 : (parseFloat((String(n).match(/\d+(\.\d+)?/) || ["0"])[0]) || 0);
const modelTier = n => /lite/.test(n) ? 0 : /pro/.test(n) ? 2 : 1;
const modelRank = (a, b) => modelGen(b) - modelGen(a) || modelTier(a) - modelTier(b) || a.localeCompare(b);

async function aiCall(prompt, opt){
  opt = opt || {};
  if(!AI.key && !AI_PROXY) throw new Error("먼저 AI 연결 탭에서 키를 넣어 주세요.");
  const m = opt.model || AI.model || AI_MODELS[0];
  const cfg = {temperature:0.3, maxOutputTokens: opt.maxTokens || 8192};
  if(opt.json) cfg.responseMimeType = "application/json";   // 최신 모델은 생각 토큰을 쓰므로 여유 있게
  let res;
  try{
    res = await fetch(`${aiBase()}/v1beta/models/${m}:generateContent`, {
      method:"POST",
      headers:Object.assign({"Content-Type":"application/json"}, aiHead()),
      body:JSON.stringify({contents:[{parts:[{text:prompt}, ...(opt.parts||[])]}], generationConfig:cfg})
    });
  }catch(e){
    throw new Error("바깥으로 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.");
  }
  if(res.status === 400 || res.status === 401 || res.status === 403) throw new Error(aiShared()
    ? "공용 연결이 요청을 거절했습니다. AI 연결 탭에서 본인 키를 넣으면 이어서 쓸 수 있습니다."
    : "키가 올바르지 않거나 권한이 없습니다. 키를 다시 확인해 주세요.");
  if(res.status === 404) throw new Error(`‘${m}’ 모델을 찾지 못했습니다. AI 연결 탭에서 ‘모델 목록 가져오기’를 눌러 쓸 수 있는 이름을 받아오세요.`);
  if(res.status === 429) throw new Error(aiShared()
    ? "공용 연결이 오늘 한도에 닿았습니다. AI 연결 탭에서 본인 키를 넣으면 바로 이어서 쓸 수 있습니다."
    : "무료 사용 한도를 넘었습니다. 잠시 뒤 다시 시도해 주세요.");
  if(!res.ok) throw new Error("응답을 받지 못했습니다 (" + res.status + ")");
  const j = await res.json();
  const c = j?.candidates?.[0];
  const t = (c?.content?.parts || []).filter(p => !p.thought).map(p => p.text || "").join("");
  if(!t){
    if(c?.finishReason === "MAX_TOKENS") throw new Error("답이 길어 잘렸습니다. 관찰이 아주 많다면 몇 건만 두고 다시 시도해 주세요.");
    if(c?.finishReason === "SAFETY" || j?.promptFeedback?.blockReason) throw new Error("모델이 응답을 거부했습니다. 문장을 조금 바꿔 다시 시도해 주세요.");
    throw new Error("빈 응답이 왔습니다. 다시 시도해 주세요.");
  }
  return t;
}
/* 모델이 코드펜스를 두르거나 닫는 괄호를 하나 더 붙이는 일이 있어 너그럽게 읽는다. */
function looseJSON(raw){
  let s = String(raw).trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(fence) s = fence[1].trim();
  try{ return JSON.parse(s); }catch(e){}
  const start = s.search(/[{[]/);
  if(start < 0) return null;
  let depth = 0, inStr = false, esc2 = false;
  for(let i = start; i < s.length; i++){
    const c = s[i];
    if(inStr){ if(esc2) esc2 = false; else if(c === "\\") esc2 = true; else if(c === '"') inStr = false; continue; }
    if(c === '"') inStr = true;
    else if(c === "{" || c === "[") depth++;
    else if(c === "}" || c === "]"){ depth--;
      if(depth === 0){ try{ return JSON.parse(s.slice(start, i+1)); }catch(e){ return null; } } }
  }
  return null;
}
async function aiJSON(prompt, opt){
  const raw = await aiCall(prompt, Object.assign({json:true}, opt||{}));
  const v = looseJSON(raw);
  if(!v) throw new Error("응답을 이해하지 못했습니다. 다시 시도해 주세요.");
  return v;
}
/* 검사(RULES)와 같은 말을 해야 한다. 한쪽만 고치면 AI가 쓴 문장을 우리 검사가 막는다.
   특허가 그랬다 — 6학년 실과가 그것을 배우는데 여기서는 쓰지 말라고 하고 있었다. */
const AI_RULES = `기재 금지: 대회·경시·수상·입상, 어학시험·자격증·인증시험, 점수·등급·석차(PAPS 제외), 논문·출간, 특허·지식재산권 취득 실적(다만 특허를 배운 수업이라면 배운 일은 쓸 수 있다), 장학금·기부·해외활동, 국제기구명, 대학·기관·상호·강사명, 부모의 직업이나 지위, 질병명·가정환경. 상표나 앱 실명은 일반명사로 바꾼다. 명사형('~함','~음')으로 끝맺고 학생 이름이나 주어를 쓰지 않는다.`;
const student = id => S.students.find(s => s.id === id);
const sname = s => S.klass?.numbersOnly ? String(s.no) : (s.name || String(s.no));
const taskOf = n => S.tasks.find(t => t.id === n.taskId);

/* ══ 짚어주기 — 데이터에서 교사가 볼 지점을 찾아 순서대로 ══ */
function pointers(){
  const out = [], sl = slots(), N = S.students.length;
  if(!N) return out;
  const notesBy = id => notesOf(id);

  // 1. 등급 1 위반이 남은 문장
  const bad = [];
  for(const s of S.students) for(const x of sl){
    const d = S.drafts[dkey(s.id,x.key)];
    if(d && d.text.trim() && check(d.text).some(f => f.lv === "block"))
      bad.push({s, x});
  }
  if(bad.length) out.push({sev:"high", title:`기재 금지 표현이 남은 문장 ${bad.length}건`,
    who: bad.slice(0,6).map(b => `${sname(b.s)} ${b.x.label}`).join(" · ") + (bad.length>6?" 외":""),
    go: bad[0]});

  // 2. 관찰이 하나도 없는 학생
  const none = S.students.filter(s => notesBy(s.id).length === 0);
  if(none.length) out.push({sev:"high", title:`관찰이 한 건도 없는 학생 ${none.length}명`,
    who: none.map(sname).join(" · "), go:{s:none[0], x:sl[0]}});

  // 3. 인정 근거 자료가 없는 학생 (직접관찰만)
  const onlyDirect = S.students.filter(s => {
    const ns = notesBy(s.id);
    return ns.length > 0 && !ns.some(n => RECOGNIZED.includes(n.source));
  });
  if(onlyDirect.length) out.push({sev:"mid", title:`근거가 직접관찰뿐인 학생 ${onlyDirect.length}명`,
    who: onlyDirect.map(sname).join(" · ") + " — 수업산출물·자기평가서 등 인정 자료 5종 중 하나를 함께 남겨 두면 좋습니다",
    go:{s:onlyDirect[0], x:sl[0]}});

  // 4. 문장에 관찰에 없는 내용이 많은 경우(과장 위험)
  const risky = [];
  for(const s of S.students) for(const x of sl){
    const d = S.drafts[dkey(s.id,x.key)];
    if(!d || !d.text.trim()) continue;
    const pool = notesOf(s.id, x.key).map(n => n.text).join(" ");
    const words = [...new Set(d.text.replace(/[^가-힣\s]/g," ").split(/\s+/)
                    .map(w => w.replace(/(을|를|이|가|은|는|에|에서|으로|로|와|과|의|도|만|하며|하고|하여|함|음)$/,""))
                    .filter(w => w.length >= 2))];
    if(words.length < 4) continue;
    const miss = words.filter(w => !pool.includes(w));
    if(miss.length / words.length > 0.75) risky.push({s, x, r:Math.round(miss.length/words.length*100)});
  }
  if(risky.length) out.push({sev:"mid", title:`관찰에 없는 내용이 대부분인 문장 ${risky.length}건`,
    who: risky.slice(0,5).map(r => `${sname(r.s)} ${r.x.label}`).join(" · ") +
         " — 근거를 확인하거나 관찰을 먼저 담아 두세요", go:risky[0]});

  // 5. 축이 비어 있는 학생 (창체·행동특성)
  for(const k of ["cca:auto","behavior"]){
    const x = sl.find(v => v.key === k);
    const miss = S.students.filter(s => notesOf(s.id,k).length === 0);
    if(miss.length && miss.length < N) out.push({sev:"low", title:`${x.label} 관찰이 없는 학생 ${miss.length}명`,
      who: miss.map(sname).join(" · "), go:{s:miss[0], x}});
  }

  /* 6. 아직 평가를 설계하지 않은 교과 — 교과 단위까지만 센다.
     성취기준 611건 전수 커버리지 표는 만들지 않는다(초등은 전 기준 평가 의무가 없다). */
  const noPlan = sl.filter(x => x.kind === "subj" && !S.tasks.some(t => t.subject === x.subject));
  if(noPlan.length && noPlan.length < sl.length)
    out.push({sev:"mid", title:`평가를 아직 설계하지 않은 교과 ${noPlan.length}개`,
      who: noPlan.map(x => x.label).join(" · ") + " — 준비 탭 「평가 설계」에서 만들 수 있습니다", go:null});

  // 7. 관찰이 없는 교과
  const emptySubj = sl.filter(x => x.kind === "subj" && !S.notes.some(n => slotOf(n) === x.key));
  if(emptySubj.length && emptySubj.length < sl.length)
    out.push({sev:"low", title:`관찰이 한 건도 없는 교과 ${emptySubj.length}개`,
      who: emptySubj.map(x => x.label).join(" · "), go:{s:S.students[0], x:emptySubj[0]}});

  // 8. 남은 문장 칸
  const left = S.students.reduce((a,s) => a + sl.filter(x => !draftDone(s.id,x.key)).length, 0);
  if(left) out.push({sev:"low", title:`아직 확인이 끝나지 않은 문장 칸 ${left}개`,
    who:`전체 ${N*sl.length}칸 가운데 ${N*sl.length-left}칸 완료`, go:null});

  return out;
}

/* ══ 화면 ══ */
function render(){
  el("klass").innerHTML = S.classes.map(c =>
      `<option value="${c.id}"${c.id===S.curId?" selected":""}>${esc(klassName(c))} · ${c.students.length}명${c.klass.demo?" (예시)":""}</option>`).join("")
    + `<option value="__new">＋ 새 학급 만들기</option>`;
  el("klass").style.display = S.classes.length ? "" : "none";
  paintTabs();
  el("tab-ai").innerHTML = "AI 연결" + (aiOn() ? `<span class="dot" style="background:var(--good)"></span>` : "");
  const p = S.klass ? pointers().filter(x => x.sev !== "low").length : 0;
  el("tab-check").innerHTML = "살펴보기" + (p ? `<span class="dot"></span>` : "");
  const ready = !!(S.klass && S.classes.length);
  // 학급을 만들기 전에는 설계·기록·점검으로 갈 수 없다. 눌러도 안 되는 이유를 보이게 한다.
  for(const id of ["tab-design","tab-write","tab-check"]){
    el(id).disabled = !ready;
    el(id).title = ready ? "" : "먼저 준비 탭에서 우리 반을 등록해 주세요";
  }
  if(!ready && S.ui.tab !== "ai") S.ui.tab = "prep";
  paintTabs();
  /* 설계 화면을 벗어나면 띠도 걷는다 */
  const bar = el("dbar"); if(bar && S.ui.tab !== "design") bar.hidden = true;
  if(S.ui.tab === "ai"){ renderAI(); return; }
  if(!ready){ renderSetup(); return; }
  if(S.ui.tab === "prep") renderPrep();
  else if(S.ui.tab === "design") renderDesign();
  else if(S.ui.tab === "check") renderCheck();
  else renderWrite();
}
const TABS = ["prep","design","write","check","ai"];
const paintTabs = () => TABS.forEach(t =>
  el("tab-" + t).setAttribute("aria-selected", String(S.ui.tab === t)));

    if(l) setTimeout(()=>l.classList.toggle("on", l.querySelector("input").checked),0); };
  if(edit) el("f-cancel").onclick = () => render();
  el("f-save").onclick = () => {
    const c = collect();
    if(!c.students.length){ alert("학생을 한 명 이상 적어 주세요."); return; }
    if(!S.curId){                                   // 새 학급
      const nc = newClass(c.klass, c.students);
      S.classes.push(nc); activate(nc.id);
      S.ui.sid = S.students[0]?.id || null; S.ui.tab = "prep";
    } else {
      S.klass = c.klass;
      const old = new Map(S.students.map(s => [String(s.no), s]));
      S.students = c.students.map(s => { const p = old.get(String(s.no)); return p ? {id:p.id, no:s.no, name:s.name} : s; });
      if(!S.students.some(s => s.id === S.ui.sid)) S.ui.sid = S.students[0]?.id || null;
      S.ui.tab = "write";
    }
    save(); render();
  };
}
function collect(){
  const grade = +el("f-grade").value;
  const excluded = [...el("f-subj").querySelectorAll("input:checked")].map(i => i.value);
  const students = el("f-roster").value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map((line,i) => {
    const m = line.match(/^(\d+)[.)\s]*(.*)$/);
    const no = m ? +m[1] : i+1, name = (m ? m[2] : line).trim();
    return {id:uid(), no, name:name || String(no)};
  });
  // 반을 비워 두면 1반으로 본다 — 빈 값이면 화면 어디에도 반이 뜨지 않아 헷갈린다
  return {klass:{grade, room:el("f-room").value.trim() || "1", teacher:el("f-teacher").value.trim(),
                 excluded, numbersOnly:el("f-numbers").checked}, students};
}

/* ── 작성 ── */
function renderWrite(){
  if(!S.ui.sid) S.ui.sid = S.students[0]?.id || null;
  const sl = slots();
  if(!sl.some(x => x.key === S.ui.slot)) S.ui.slot = sl[0].key;
  el("main").innerHTML = `<div class="cols">
    <div class="panel roster-panel"><div class="ph"><h2>명렬표</h2><span class="r saved">${S.students.length}</span></div>
      <div class="roster" id="roster">${rosterHTML()}</div>
      <div class="addstu">
        <input type="text" id="stu-new" placeholder="이름 적고 Enter" autocomplete="off">
        <button class="ghost tip" id="stu-add" type="button" aria-label="학생 한 명 추가"
                data-tip="한 명 추가 — 이름을 적고 누르세요. ‘12 김ㅇㅇ’처럼 번호를 함께 적어도 됩니다">＋</button>
        <button class="ghost tip" id="stu-file-btn" type="button" aria-label="명렬표 파일로 추가"
                data-tip="명렬표 파일로 한꺼번에 추가 — txt·csv 파일을 고르거나, 엑셀에서 복사한 목록을 왼쪽 칸에 붙여넣어도 됩니다">＋＋</button>
        <input type="file" id="stu-file" accept=".txt,.csv,.tsv,text/plain" style="display:none">
      </div>
    </div>
    <div class="panel" id="detail">${detailHTML()}</div></div>`;
  el("roster").onclick = e => {
    const x = e.target.closest("[data-del-stu]");
    if(x){ e.stopPropagation(); removeStudent(x.dataset.delStu); return; }
    const b = e.target.closest(".rrow"); if(!b) return;
    S.ui.sid = b.dataset.id; pendingStd = []; pendingFile = null; _noteLevel = ""; save();
    el("roster").innerHTML = rosterHTML();
    el("detail").innerHTML = detailHTML(); bindDetail();
  };
  el("roster").onkeydown = e => {
    const b = e.target.closest(".rrow");
    if(!b || (e.key !== "Enter" && e.key !== " ")) return;
    if(e.target.matches("[data-del-stu]")) return;   // X는 button이라 스스로 처리한다
    e.preventDefault(); b.click();
  };
  const ni = el("stu-new");
  const addStudents = raw => {
    raw = (raw ?? ni.value).trim(); if(!raw) return;
    let next = S.students.reduce((m,s) => Math.max(m, +s.no||0), 0);
    const made = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
      const m = line.match(/^(\d+)\s*[.),\t]?\s*(.*)$/);
      let no, name;
      if(m && m[2]){ no = +m[1]; name = m[2].trim(); next = Math.max(next, no); }
      else { no = ++next; name = line.replace(/^[\d.),\t\s]+/,"").trim() || String(no); }
      return {id:uid(), no, name:name.split(/[,\t]/)[0].trim() || String(no)};
    }).filter(s => s.name && !/^(번호|이름|성명|연번|순번)$/.test(s.name));   // 머리글 줄은 거른다
    if(!made.length) return;
    S.students.push(...made);
    S.students.sort((a,b) => a.no - b.no);
    S.ui.sid = made[0].id; ni.value = ""; save(); renderWrite();
    const f = el("stu-new"); if(f) f.focus();
  };
  ni.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); addStudents(); } };
  ni.onpaste = e => { const t = (e.clipboardData||window.clipboardData).getData("text");
    if(t && /\r?\n/.test(t)){ e.preventDefault(); addStudents(t); } };
  el("stu-add").onclick = () => addStudents();
  el("stu-file-btn").onclick = () => el("stu-file").click();
  el("stu-file").onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = () => addStudents(String(fr.result));
    fr.readAsText(f, "utf-8");
    e.target.value = "";
  };
  bindDetail();
}
function rosterHTML(){
  const sl = slots(), D = today();
  return S.students.map(s => {
    const c = notesOf(s.id).length, done = sl.filter(x => draftDone(s.id,x.key)).length;
    /* 훑는 동안에는 「오늘 이 칸에 담았는가」만 표시한다 — 사실이지 수준이 아니다 */
    const hit = _sweep && S.notes.some(n => n.studentId === s.id && n.date === D && slotOf(n) === S.ui.slot);
    return `<div class="rrow" role="button" tabindex="0" data-id="${s.id}" aria-current="${s.id===S.ui.sid}">
      <span class="no">${esc(String(s.no).padStart(2,"0"))}</span><span>${esc(sname(s))}</span>
      <span class="cnt">${hit?`<span style="color:var(--accent)">●</span> `:""}${c||"·"}${done?` <span style="color:var(--good)">✓${done}</span>`:""}</span>
      <button class="x" type="button" data-del-stu="${s.id}"
              title="${esc(sname(s))} 지우기" aria-label="${esc(sname(s))} 지우기">×</button></div>`;
  }).join("");
}

/* 학생 지우기 — 담긴 것이 있으면 한 번 더 묻는다 */
function removeStudent(id){
  const s = student(id); if(!s) return;
  const n = notesOf(id).length;
  const w = Object.keys(S.drafts).filter(k => k.startsWith(id + "|") && (S.drafts[k].text||"").trim()).length;
  if(n || w){
    const what = [n ? `관찰 ${n}건` : "", w ? `문장 ${w}칸` : ""].filter(Boolean).join(" · ");
    if(!confirm(`${sname(s)} 학생에게 ${what}이 담겨 있습니다.\n학생과 함께 모두 지워지며 되돌릴 수 없습니다.\n\n정말 지울까요?`)) return;
  }
  S.notes = S.notes.filter(x => x.studentId !== id);
  Object.keys(S.drafts).forEach(k => { if(k.startsWith(id + "|")) delete S.drafts[k]; });
  S.tasks.forEach(t => { if(t.off) delete t.off[id]; });
  S.students = S.students.filter(x => x.id !== id);
  if(S.ui.sid === id) S.ui.sid = S.students[0]?.id || null;
  save(); sweepFiles(); renderWrite();
}

}
/* 교과 관찰 담기의 키워드 — 개발 단계에서 고른 관점이 맨 앞에 온다 (§10-3).
   영역 select와 AI 버튼은 평가 추가 창으로 갔다. 여기 남는 것은 재료(칩)뿐이다. */
/* 설계할 때 고른 관점이 있으면 그것만 내놓는다 — 개발한 대로 관찰하게 되는 고리다(§10-3).
   관점을 정해 둔 과제일수록 기록 화면이 깨끗해진다. 나머지 낱말은 「다른 낱말」 뒤에 있다. */
function subjKwWords(cur){
  const t = S.tasks.find(x => x.id === _taskId && x.subject === cur.subject);
  if(t?.kw?.length) return [...new Set(t.kw)];
  return (((KW.subj[cur.subject]||{})[band()] || []).slice(0,1)).flatMap(b => b.k);
}
/* 기본에서 빠진 낱말 — 그 과제 영역의 나머지와 공통 태도·성장 */
function moreKwWords(cur){
  const t = S.tasks.find(x => x.id === _taskId && x.subject === cur.subject);
  const areas = t ? [...new Set((t.standards||[]).map(c => CODEMAP[c]?.area).filter(Boolean))] : [];
  const blocks = t ? kwOfAreas(cur.subject, areas).blocks
                   : ((KW.subj[cur.subject]||{})[band()] || []);
  const base = new Set(subjKwWords(cur));
  return [...new Set([...blocks.flatMap(b => b.k), ...COMMON_KW.flatMap(b => b.k)])].filter(w => !base.has(w));
}
const commonKwWords = () => COMMON_KW.flatMap(b => b.k);
function baseKw(cur){
  if(cur.kind === "subj") return (KW.subj[cur.subject] || {})[band()] || [];
  if(cur.kind === "cca")  return KW.cca[cur.cca] || [];
  return KW.behavior || [];
}
function stdCut(code, n){
  const t = CODEMAP[code]?.text || "";
  return t.length > n ? t.slice(0, n) + "…" : t;
}
/* 이 칸 관찰들이 참조한 과제 루브릭의 수준명 — 없으면 통용 3수준 */
function modeLevel(ns){
  const c = {};
  for(const n of ns) if(n.level) c[n.level] = (c[n.level] || 0) + 1;
  let best = "", bn = 0;
  for(const k in c) if(c[k] > bn){ bn = c[k]; best = k; }
  return best;
}
/* 수준은 홀로 뜨지 않는다 — 언제나 서술어를 달고 다닌다 (§10-5 울타리) */
/* 성장 — 교사에게 묻지 않는다. 같은 과제의 루브릭 서열로만 읽는다.
   과제가 다르면 잣대가 달라 비교가 되지 않는다. 비교하는 척하지 않는다.
   값을 저장하지 않고 그때그때 센다 — 기록 하나를 지우면 판정도 함께 사라져야 한다.
   같은 날 여러 건이 있을 수 있어 날짜가 아니라 담긴 차례로 앞뒤를 가른다. */
function growthOf(n){
  if(!n || !n.level || !n.taskId) return "";
  const rb = (taskOfId(n.taskId)?.rubric || []);
  const rank = v => rb.findIndex(r => r.level === v);
  const now = rank(n.level);
  if(now < 0) return "";
  const i = S.notes.indexOf(n);
  for(let j = i - 1; j >= 0; j--){
    const m = S.notes[j];
    if(m.studentId !== n.studentId || m.taskId !== n.taskId || !m.level) continue;
    const was = rank(m.level);
    if(was < 0) continue;
    return now < was ? "up" : now > was ? "down" : "flat";
  }
  return "";
}
const GROWTH_LABEL = {up:"나아짐", flat:"유지", down:"낮아짐"};
function levelText(n){
  const t = taskOf(n);
  const r = (t?.rubric || []).find(x => x.level === n.level);
  return r ? r.text : "지금 루브릭에 없는 수준";
}
function taskStd(){ const t = S.tasks.find(x => x.id === _taskId); return t ? (t.standards||[]) : []; }
function taskLegacy(){ const t = S.tasks.find(x => x.id === _taskId); return t ? (t.legacy||[]) : []; }
function taskOfId(id){ return S.tasks.find(x => x.id === id); }

/* 검토 항목은 ‘검토를 돌린 그 문장’(rv.base)의 구간을 가리킨다.
   그래서 고치기는 hit 문자열을 찾아 바꾸지 않고, 받아들인 구간 교체(rv.edits)를
   모두 base에 겹쳐 다시 만든다 — 앞 항목을 고쳐 위치가 밀려도 뒤 항목이 엉키지 않는다. */
function aiSpan(rv, it){
  const at = it.hit ? rv.base.indexOf(it.hit) : -1;
  it.at = at; it.end = at < 0 ? -1 : at + it.hit.length;
}
function aiPatched(rv, extra){
  const es = (rv.edits || []).concat(extra ? [extra] : []).sort((a,b) => a.at - b.at);
  let out = "", p = 0;
  es.forEach(e => { out += rv.base.slice(p, e.at) + e.to; p = e.end; });
  return tidySentence(out + rv.base.slice(p));
}
/* fix가 대체 문구가 아니라 ‘(해당 부분 삭제)’ 같은 지시문이면 지우기로 본다 */
const aiDrop = it => !it.fix ||
  /^[\s(（'"‘“]*(해당\s*부분\s*)?(전체\s*)?(삭제|제거|빼기|생략)[^가-힣]*$/.test(it.fix.trim());
const squash = s => String(s).replace(/\s+/g, "");
function countIn(hay, ndl){
  if(!ndl) return 0;
  let n = 0, i = 0;
  while((i = hay.indexOf(ndl, i)) >= 0){ n++; i += ndl.length; }
  return n;
}
/* 지금 이 항목을 그대로 적용하면 안 되는 경우 — AI는 한 문장의 겹치는 부분을
   여러 항목으로 나눠 짚곤 한다. 잇달아 누르면 같은 구절이 두 번 들어간다.
   ① 앞서 고친 구간과 겹친다  ② 넣을 표현이 이미 문장에 있어 중복이 된다 */
function aiClash(rv, it){
  if(!(it.at >= 0)) return false;
  if((rv.edits || []).some(e => it.at < e.end && e.at < it.end)) return true;
  const to = aiDrop(it) ? "" : it.fix, sq = squash(to);
  if(sq.length < 8) return false;
  return countIn(squash(rv.cur), sq) >= 1 &&
         countIn(squash(aiPatched(rv, {at:it.at, end:it.end, to})), sq) > 1;
}
/* 교사가 문장을 손으로 고쳤으면(우리가 만든 것과 다르면) 기준 문장을 지금 것으로 다시 잡는다.
   옛 저장본에는 base가 없으므로 그것도 이 길로 들어온다. */
function aiSync(k){
  const rv = revOf(k), d = S.drafts[k];
  if(!rv || !d || rv.cur === d.text) return rv;
  rv.base = rv.cur = d.text; rv.edits = [];
  (rv.items || []).forEach(it => {
    if(it.state === "applied" || it.state === "ok" || it.state === "skip") return;
    aiSpan(rv, it);
    it.state = it.hit && it.at < 0 ? "gone" : "";
  });
  return rv;
}

/* AI 검토 결과 — 고치기·확인함으로 하나씩 닫아 나간다 */
function aiReviewHTML(k, text, ev){
  const rv = aiSync(k);
  if(!rv || rv.closed) return "";
  /* 검토한 뒤에 문장이나 근거가 바뀌었다면 그 사실을 숨기지 않는다 */
  const stale = rv.sig && rv.sig !== revSig(text, ev);
  const items = (rv.items||[]).map(it => {
    let state = it.state || "";
    if(!state && it.hit && !(it.at >= 0)) state = "gone";
    if(!state && aiClash(rv, it)) state = "clash";
    return Object.assign({}, it, {state});
  });
  const left = items.filter(i => !i.state).length;
  const clashes = items.filter(i => i.state === "clash").length;
  return `
  <div class="scan" id="ai-block">
    <div class="scan-head"><span class="lab">AI 검토</span>
      <span class="tally">${items.length
        ? (left ? `${left}건 남음`
          : clashes ? `${clashes}건은 다시 검토가 필요합니다`
          : `<span class="none">모두 처리했습니다</span>`)
        : `<span class="none">짚은 것 없음</span>`}${stale
        ? ` <span style="color:var(--low)">· 그 뒤 문장이 바뀌었습니다</span>` : ``}</span>
      <span class="r" style="margin-left:auto;display:flex;gap:8px">
        <button class="link" data-airedo="1" type="button">다시 검토</button>
        <button class="link" data-aiclose="1" type="button">닫기</button></span>
    </div>
    ${items.map((f,i)=>{
      const clash = f.state === "clash";
      const done = !!f.state && !clash;
      const badge = f.state === "applied" ? "고쳤음" : f.state === "ok" ? "선생님이 확인함"
                  : f.state === "skip" ? "넘김" : f.state === "gone" ? "문장에서 사라짐" : "";
      return `<details class="f ${done?"done":(f.level==="위반"?"block":"warn")}"${done?"":" open"}>
        <summary><span class="mk">${done?"✓":clash?"↻":(f.level==="위반"?"●":"▲")}</span>
          <span class="hit">${esc(f.hit||"")}</span>
          ${f.fix&&!done&&!clash?`<span class="to">→ ${esc(f.fix)}</span>`:""}
          ${done?`<span class="to" style="color:var(--good)">${badge}</span>`:""}
          ${clash?`<span class="to" style="color:var(--mid)">다시 검토가 필요합니다</span>`:""}
          <span class="r">${done?"":clash?`
            <button class="fix" type="button" data-aiskip="${i}" title="이 항목을 넘기고 목록에서 닫기">넘기기</button>`:`
            ${f.fix?`<button class="fix" type="button" data-aifix="${i}">이대로 고치기</button>`:""}
            <button class="fix" type="button" data-aiok="${i}" title="규정에 어긋나지 않는다고 판단해 그대로 두기">확인함</button>`}
            <span class="basis">AI 검토</span></span></summary>
        <div class="why">${esc(f.why||"")}${f.state==="ok"?`<br><span style="color:var(--good)">선생님이 확인해 그대로 두기로 한 항목입니다.</span>`:""}${
          clash?`<br><span style="color:var(--mid)">앞서 고친 부분과 같은 자리를 짚었거나, 넣을 표현이 이미 문장에 들어가 있습니다. 그대로 적용하면 같은 말이 두 번 들어갑니다 — 위의 「다시 검토」를 누르거나 문장을 직접 다듬어 주세요.</span>`:""}</div></details>`;
    }).join("")}
    ${rv.note?`<div class="hint">${esc(rv.note)}</div>`:""}
    <div class="hint">참고 의견입니다.${rv.at?` · ${esc(rv.at.slice(5).replace("-","/"))} 검토`:""}</div>
  </div>`;
}

function bindDetail(){
  const s = student(S.ui.sid); if(!s) return;
  const wrap = el("detail"), sl = slots(), cur = sl.find(x => x.key === S.ui.slot);

  el("slots").onclick = e => {
    const b = e.target.closest(".slot"); if(!b) return;
    const sl2 = slots();
    const key = b.dataset.slot || (sl2.find(x => x.kind === b.dataset.axis) || sl2[0]).key;
    S.ui.slot = key; pendingStd = []; pendingFile = null; _kwArea = 0; _taskId = "";
    _noteLevel = ""; _rubOpen = false;
    save(); repaint();
  };
  const ss = el("slot-sub");
  if(ss) ss.onchange = () => { S.ui.slot = ss.value; pendingStd = []; pendingFile = null;
                               _kwArea = 0; _taskId = ""; _noteLevel = ""; _rubOpen = false;
                               save(); repaint(); };

  el("s-name").onclick = () => {

/* 관찰 한 건을 짓는다. 학생만 다르고 나머지는 같다 —
   withLevel이 false면 수준을 붙이지 않는다(함께 담기에서 쓴다, §일괄의 경계). */
/* 한 개만 담기던 때의 기록도 그대로 읽는다 */
const rolesOf = n => n.roles || (n.role ? [n.role] : []);
/* 자리는 고정이다. 자주 쓰는 것을 앞으로 당겨 봤으나, 한 건 담을 때마다 셈이 달라져
   칩이 눈앞에서 뒤섞였다. 일곱 개뿐이라 찾기 어렵지 않다 — 자리가 늘 같은 편이 손에 익는다. */
function roleOrder(){ return ROLES; }
function buildNote(sid, text, cur, withLevel){
  const n = {id:uid(), studentId:sid, date:today(), source:_src, text, standards:[]};
  if(cur.kind === "subj"){
    n.axis = "subj"; n.subject = cur.subject;
    if(_taskId && S.tasks.find(t => t.id === _taskId && t.subject === cur.subject)) n.taskId = _taskId;
    n.standards = [...new Set([...taskStd(), ...pendingStd])];
    n.legacy = taskLegacy().slice();
    /* 수준은 그 과제 루브릭에 있는 값일 때만 붙는다 */
    const t = S.tasks.find(x => x.id === n.taskId);
    if(withLevel && _noteLevel && (t?.rubric || []).some(r => r.level === _noteLevel)) n.level = _noteLevel;
  } else if(cur.kind === "cca"){ n.axis = "cca"; n.cca = cur.cca; }
  else n.axis = "behavior";
  /* 역할은 그 아이가 그 장면에서 맡은 것이다. 수준과 같은 이유로 함께 담기에는 딸려가지 않는다 —
     한 클릭이 N명의 역할을 정하면 그중 N−1명은 보지 않고 정해진 것이다 */
  if(withLevel && _roles.length) n.roles = _roles.slice();
  return n;
}
function addNote(){
  const ti = el("c-text"); if(!ti) return;
  const text = ti.value.trim();
  /* 수준이나 산출물만 있어도 기록이다 — 평가 결과가 곧 기록이고 관찰 문장은 덧붙임이다 */
  if(!text && !_noteLevel && !pendingFile){ ti.focus(); return; }
  const cur = slots().find(x => x.key === S.ui.slot);
  const n = buildNote(S.ui.sid, text, cur, true);
  if(pendingFile) n.fileId = pendingFile.id;
  /* 수준은 한 건에 한 번이다 — 비우지 않으면 다음 학생에게 판정이 조용히 따라간다(§10-5) */
  S.notes.push(n); pendingStd = []; _noteLevel = ""; _roles = []; save();
  if(_sweep){ sweepNext(); return; }
  renderWrite(); el("c-text")?.focus({preventScroll:true});
}
/* 다음 학생으로. 명렬 끝에 닿으면 스스로 멈춘다 — 되돌아 처음부터 돌지 않는다 */
function sweepNext(){
  const i = S.students.findIndex(s => s.id === S.ui.sid);
  const next = S.students[i + 1];
  if(next){ S.ui.sid = next.id; _sweepMsg = ""; }
  else { _sweep = false; _sweepMsg = "한 바퀴 돌았습니다."; }
  pendingStd = []; pendingFile = null; _noteLevel = ""; save();
  renderWrite(); el("c-text")?.focus({preventScroll:true});
}
/* 함께 담기 — 같은 장면을 여럿이 실제로 겪었을 때. 사실은 복제할 수 있다.
   그러나 수준 판정은 복제하지 않는다: 한 클릭이 N명의 수준을 정하면
   그중 N−1명은 근거를 마주하지 않고 판정된 것이고, 그것이 채점 매트릭스의 최소 단위다. */
function addNoteMany(){
  const ti = el("c-text"); if(!ti) return;
  const text = ti.value.trim();
  if(!text && !pendingFile){ ti.focus(); return; }
  const cur = slots().find(x => x.key === S.ui.slot);
  const hadLevel = !!_noteLevel;
  _noteLevel = "";
  pickStudents({
    title:"누구에게 함께 담을까요", multi:true, preset:[S.ui.sid], okLabel:"담기",
    msg: hadLevel ? "수준은 함께 담기지 않습니다 — 담은 뒤 학생마다 붙이세요" : text.slice(0, 30),
    onOK(ids){
      if(!ids.length) return;
      ids.forEach(sid => {
        const n = buildNote(sid, text, cur, false);
        if(pendingFile) n.fileId = pendingFile.id;   // 같은 산출물을 함께 참조한다
        S.notes.push(n);
      });
      pendingStd = []; save(); renderWrite();
    }});
}

/* ══ 수업 설계 — 백워드 3단계 ══
   준비 탭에서 정한 루브릭을 활동으로 역산하는 자리다. 순서가 뒤집히지 않도록
