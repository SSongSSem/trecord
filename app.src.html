   활동 고르기가 다시 ‘재미있는 것’ 고르기로 돌아간다. */
let _dsgId = "";
/* 어느 프롬프트를 펴 두었나 — 확인하지 않고 복사하게 두지 않는다 */
let _promptOpen = "";

/* 초등 한 차시는 40분이다. 차시가 본디 단위이고 분은 거기서 나온다 —
   프로젝트 수업이면 차시가 얼마든지 늘 수 있으므로 위를 막지 않는다 */
const PERIOD_MIN = 40;
const periodsOf = d => Math.max(1, d.periods || Math.round((d.minutes || 40) / PERIOD_MIN) || 1);
const minutesOf = d => periodsOf(d) * PERIOD_MIN;

function ensureDesign(t){
  if(!t.design) t.design = {v:1, goal:"", periods:1, hands:null, flow:[],
    sheet:{goal:"", blocks:[]}, slides:[], images:[], notAssessed:[],
    reflect:{saw:"", why:"", next:""}, stale:{}, at:new Date().toISOString()};
  return t.design;
}
/* 관문은 하나다 — 활동 흐름을 짜면 지도안이 나온다.
   활동지와 수업자료는 이 도구가 만들지 않는다. 브라우저가 A4를 직접 그리고
   OOXML을 손으로 짜는 길은 품질 상한이 낮아, 지금은 '무엇을 어떻게 만들지'를
   프롬프트로 알려 주는 데까지만 한다. 만든 프롬프트는 지도안 끝에 함께 실린다. */
function designStage(d){
  return (d && (d.flow || []).length) ? 1 : 0;
}
const DSG_STEPS = ["지도안 설계", "완성"];
const DSG_STAGE = ["설계 전", "지도안까지"];
/* 수준 서술이 하나라도 있어야 역산이 된다. 이름과 코드만 있는 과제로는 못 짠다 */
const designable = t => (t.rubric || []).some(r => (r.text || "").trim());

function renderDesign(){
  const t = S.tasks.find(x => x.id === _dsgId);
  if(!t){ const b = el("dbar"); if(b) b.hidden = true; renderDesignList(); return; }
  const d = ensureDesign(t), stage = designStage(d);

  el("main").innerHTML = `<div class="stack">
    <div class="panel">
      <div class="ph"><h2>${esc(t.name)}</h2>
        <span class="r"><span class="muted">${esc(subjShort(t.subject))}${t.when?` · ${esc(t.when)}`:""}</span>
          <button class="ghost" id="d-back" type="button">목록</button></span></div>

    </div>

    <div class="panel">
      <div class="ph"><h2>역산할 재료</h2>
        <span class="r"><button class="ghost" id="d-editrub" type="button">준비 탭에서 고치기</button></span></div>
      <div class="pb">
        <div class="field"><span class="lab">성취기준</span>
          ${t.standards.length ? t.standards.map(c => `<div class="dsg-std">
            <span class="mono">${esc(c)}</span> ${esc(CODEMAP[c]?.text || "")}</div>`).join("")
            : `<div class="muted">성취기준이 걸려 있지 않습니다.</div>`}</div>
        <div class="field">
          <span class="lab">평가 요소</span>
          <div class="dsg-name">${esc(t.name || "(이름 없음)")}</div>
          ${t.criteria ? `<div class="dsg-crit">${esc(t.criteria)}</div>` : ``}
          <div class="dsg-sub">
            <span class="lab">관찰 관점 <span class="muted">— 위 요소를 한 층 잘게 쪼갠 것. 활동마다 이 가운데 무엇을 보는지 고릅니다</span></span>
            ${seeOpts(t).length ? `<div class="tags">${seeOpts(t).map(k =>
              `<span class="chip">${esc(k)}</span>`).join("")}</div>`
              : `<div style="color:var(--mid)">아직 없습니다 — 「준비 탭에서 고치기」에서 골라 주세요.</div>`}
          </div>
        </div>
        <div class="field" style="margin-bottom:0">
          <span class="lab">루브릭 — 활동은 이 수준들이 드러나게 짠다</span>
          ${(t.rubric||[]).map(r => `<div class="rline"><b>${esc(r.level)}</b><span>${esc(r.text)}${
            r.fb ? `<em class="dsg-fb">→ ${esc(r.fb)}</em>` : ``}</span></div>`).join("")}</div>
      </div>
    </div>

    <div class="panel">
      <div class="ph"><h2>이 차시</h2></div>
      <div class="pb">
        <div class="field">
          <span class="lab">학습목표 <span class="muted">— 주제를 얹은 문장은 여기에 씁니다</span></span>
          <textarea id="d-goal" class="goal"
            placeholder="예) 주변에서 만날 수 있는 직업인을 찾아, 매체를 고려하여 면담해 봅시다">${esc(d.goal||"")}</textarea>
          <div class="hint" id="d-goalmsg"></div>
        </div>
        <div class="field inline" style="margin-bottom:0">
          <span><span class="lab">차시</span><br>
            <input type="number" id="d-per" min="1" step="1" value="${periodsOf(d)}" style="width:76px">
            <span class="muted" id="d-permin">= ${minutesOf(d)}분</span></span>
        </div>
      </div>
    </div>

    <div class="panel" id="d-flowpanel"></div>

    <div class="panel" id="d-outpanel"></div>
  </div>`;

  el("d-back").onclick = () => { _dsgId = ""; renderDesign(); };
  el("d-editrub").onclick = () => openTask(t.subject, t, () => renderDesign());

  /* 재구성 문장이 성취기준 칸으로 새는 것을 막는 자리 — 새면 그대로
     평가 계획과 나이스 기록까지 흘러간다 */
  const goal = el("d-goal"), gmsg = el("d-goalmsg");
  const checkGoal = () => {
    gmsg.innerHTML = /\[\s*\d[가-힣]{1,4}\d{2}-\d{2}\s*\]/.test(goal.value)
      ? `<span style="color:var(--mid)">성취기준 코드가 들어 있습니다. 학습목표 칸에는 <b>학생에게 줄 문장</b>만 씁니다 — 코드와 원문은 위 재료 칸이 들고 있습니다.</span>`
      : ``;
  };
  goal.oninput = () => { checkGoal(); autoGrow(goal); };
  checkGoal(); autoGrow(goal);
  goal.onchange = () => { d.goal = goal.value.trim(); d.at = new Date().toISOString(); save(); };
  /* 차시가 바뀌면 합계 기준이 바뀐다 — 흐름을 다시 그린다 */
  const per = el("d-per");
  per.oninput = () => { el("d-permin").textContent = "= " + Math.max(1, +per.value || 1) * PERIOD_MIN + "분"; };
  per.onchange = () => {
    const v = Math.max(1, Math.round(+per.value || 1));
    per.value = v; d.periods = v; delete d.minutes;   // 옛 필드는 남기지 않는다
    el("d-permin").textContent = "= " + v * PERIOD_MIN + "분";
    save(); paintFlow(t, d);
  };
  paintFlow(t, d);
  paintOut(t, d);
  paintBar(t, d);
}

/* ── 관문① 활동 흐름 ── */
const PHASES = ["도입", "전개", "정리"];
const toLines = v => String(v).split("\n").map(s => s.trim()).filter(Boolean);
const autoGrow = x => { x.style.height = "auto"; x.style.height = (x.scrollHeight + 2) + "px"; };
/* 루브릭에 실제로 쓴 수준명만 고를 수 있게 한다 */
/* 활동이 보는 것은 관찰 관점이다. 한 장면에서 여러 관점을 볼 수 있으므로 여럿 담는다.
   수준(잘함·보통)이 아니다 — 한 활동에서 학생들이 그 수준으로 갈리는 것이지,
   활동이 어느 한 수준만 드러내지는 않는다. */
const seeOpts = t => (t.kw || []).filter(Boolean);
/* 옛 데이터는 sees가 루브릭 수준명 하나였다. 그 값은 관점이 아니므로 버리고 다시 고르게 한다 */
function seesOf(r){
  if(Array.isArray(r?.sees)) return r.sees.filter(Boolean);
  return r?.sees === "hook" ? ["hook"] : [];
}
/* 준비 탭에서 관점을 지우면 흐름이 가리킬 곳을 잃는다 — 남은 것만 인정한다 */
const seesLive = (r, opts) => seesOf(r).filter(k => k === "hook" || opts.includes(k));
const seeOK = (r, opts) => seesLive(r, opts).length > 0;

function paintFlow(t, d){
  const box = el("d-flowpanel"), rows = d.flow || [], lv = seeOpts(t);
  const sum = rows.reduce((a, r) => a + (+r.min || 0), 0);
  const nosee = rows.filter(r => !seeOK(r, lv)).length;
  const want = minutesOf(d);
  box.innerHTML = `
    <div class="ph"><h2>① 지도안 설계</h2>
      <span class="r">${rows.length ? `<button class="ghost" id="d-add" type="button">＋ 활동</button>
        ${flowWritten(rows, lv) && rows.some(r => hasBlank(r, lv))
          ? `<button class="ghost" id="d-fill" type="button">빈칸 채우기</button>` : ``}
        <button class="ghost" id="d-gen" type="button">AI로 흐름 만들기</button>` : ``}</span></div>
    <div class="pb">
      <div class="dsg-elem"><span class="lab">평가 요소</span>
        <b>${esc(t.name || "(이름 없음)")}</b>
        <span class="muted">└ 관점</span>${lv.length
          ? `<span class="muted">${esc(lv.join(" · "))}</span>`
          : `<span style="color:var(--mid)">없습니다 — 준비 탭에서 골라 주세요</span>`}</div>
      ${rows.length ? rows.map((r, i) => flowCard(r, i, lv, rows.length)).join("") + `
        <div class="fl-sum">
          <span>합계 <b class="${sum===want?"fit":(sum>want?"over":"")}">${sum}분</b>
            <span class="muted">/ ${want}분</span></span>
          ${sum!==want ? `<span class="muted">${sum>want?`${sum-want}분 넘습니다`:`${want-sum}분 남았습니다`}</span>` : ``}
          ${nosee ? `<span style="margin-left:auto;color:var(--mid)">지표 없는 활동 ${nosee}개</span>` : ``}
        </div>` + handsCard(d) : `<div class="empty-action">
        <span class="mark" aria-hidden="true">${ICON.flow()}</span>
        <span class="copy"><b>루브릭에서 활동을 역산합니다</b>
          <span>위 수준 서술이 드러나는 활동만 만들고, 어느 지표도 보지 않는 활동은 넣지 않습니다.</span></span>
        <span class="actions">
          <button class="primary" id="d-gen" type="button">AI로 흐름 만들기</button>
          <button class="ghost" id="d-add" type="button">직접 쓰기</button></span></div>
        ${aiOn() ? `` : `<div class="hint">AI로 만들려면 「AI 연결」이 필요합니다. 직접 써도 됩니다.</div>`}`}
      <div class="fl-msg" id="d-flowmsg" hidden></div>
    </div>`;
  bindFlow(t, d);
  /* 흐름이 바뀌면 프롬프트에 실릴 활동도 달라진다 */
  paintOut(t, d);
}


/* 파일 패널은 흐름·원고가 생길 때마다 다시 그린다 —
   한 번만 그리면 나중에 원고를 만들어도 버튼이 잠긴 채로 남는다 */
function paintOut(t, d){
  const box = el("d-outpanel"); if(!box) return;
  const hasFlow = (d.flow || []).length;
  box.innerHTML = `
    <div class="ph"><h2>② 완성</h2></div>
    <div class="pb">
      <div class="rowbtns">
        <button class="ghost" id="d-hwpx" type="button"${hasFlow?"":" disabled"}>지도안 한글파일</button>
      </div>
      <div class="hint" style="margin-top:8px">${hasFlow
        ? "한글에서 열어 고칠 수 있습니다. <b>활동지와 수업자료를 만드는 프롬프트가 지도안 끝에 함께 실립니다.</b>"
        : "활동 흐름을 먼저 만들어 주세요."}</div>
      ${hasFlow ? `<div class="promptbox">
        ${["sheet","deck"].map(k => `<div class="prow">
          <span class="pname">${esc(PROMPT_TITLES[k])}</span>
          <button class="ghost" type="button" data-see="${k}">${_promptOpen === k ? "접기" : "보기"}</button>
          <button class="ghost" type="button" data-copy="${k}">복사</button></div>
          ${_promptOpen === k
            ? `<pre class="ptext">${esc(k === "sheet" ? sheetPrompt(t, d) : deckPrompt(t, d))}</pre>`
            : ``}`).join("")}
        <div class="hint">쓰시는 AI에 그대로 넣으면 됩니다. 이 도구는 활동지·수업자료 파일을 만들지 않습니다 —
          글자가 한 자도 틀리면 안 되는 종이를 어설프게 그리는 것보다, 만드는 법을 정확히 적어 드리는 편이 낫습니다.</div>
      </div>` : ``}
      <div class="fl-msg" id="d-outmsg" hidden></div>
    </div>`;
  const hw = el("d-hwpx");
  if(hw) hw.onclick = () => saveHwpx(t, d, hw);
  box.querySelectorAll("[data-see]").forEach(b => b.onclick = () => {
    _promptOpen = _promptOpen === b.dataset.see ? "" : b.dataset.see;
    paintOut(t, d);
  });
  box.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => {
    const txt = b.dataset.copy === "sheet" ? sheetPrompt(t, d) : deckPrompt(t, d);
    /* 클립보드가 막히거나 멈추면 조용히 실패하지 않는다 — copyText가 옛 방식으로 한 번 더 해 본다 */
    const ok = await copyText(txt);
    const keep = b.textContent;
    b.textContent = ok ? "복사했습니다" : "복사가 안 됩니다";
    setTimeout(() => { b.textContent = keep; }, ok ? 1500 : 2500);
  });
}

/* ══ 활동지·수업자료 만들기 프롬프트 ══
   이 도구는 활동지와 수업자료를 만들지 않는다. 대신 무엇을 어떻게 만들지 적은 글을 준다.
   교사가 그대로 복사해 쓰던 AI에 넣으면 된다.

   규칙은 교육청 배포 실물을 조사한 결과 그대로다 — 활동지에는 성취기준 코드·차시·
   소요 시간·채점 기준이 9종 중 0건이었고, 수업자료는 96%가 표지에 성취기준을 싣는다.
   같은 수업이라도 학생이 손에 드는 종이와 교사가 띄우는 화면은 규칙이 반대다. */
const PROMPT_TITLES = {sheet:"활동지 만들 때 쓸 프롬프트", deck:"수업자료 만들 때 쓸 프롬프트"};

function promptHead(t, d){
  const codes = (t.standards || []).map(c => `[${c}] ${CODEMAP[c]?.text || ""}`).join("\n  ");
  return `초등학교 ${S.klass.grade}학년 ${subjShort(t.subject)} 수업이다.

[학습목표] ${d.goal || "(아직 쓰지 않음)"}
[성취기준]
  ${codes || "(없음)"}
[활동 흐름]
${(d.flow || []).map((x, i) => `  ${i + 1}. [${x.phase} ${x.min}분] ${x.name}`
  + ((x.asks || []).length ? `\n     발문: ${x.asks.join(" / ")}` : "")
  + ((x.steps || []).length ? `\n     하는 일: ${x.steps.join(" / ")}` : "")).join("\n") || "  (아직 없음)"}`;
}
function sheetPrompt(t, d){
  const opts = seeOpts(t);
  /* 학생이 손으로 무언가 하는 활동이면 칸이 된다. 관점이 아직 없다고 활동을 빠뜨리지 않는다 —
     관점은 무엇을 볼지 정하는 것이지, 학생이 할 일이 있는지 가리는 잣대가 아니다. */
  const live = (d.flow || []).filter(r =>
    seeOK(r, opts) || (r.asks || []).length || (r.steps || []).length);
  return `${promptHead(t, d)}
[관찰 관점] ${opts.join(" · ") || "(없음)"}

위 수업에서 학생이 손에 들고 연필로 쓰는 활동지를 만들어 줘.
칸은 다음 활동마다 하나씩, 이 순서 그대로.
${live.map((r, i) => `  ${i + 1}. ${r.name}`).join("\n") || "  (활동을 먼저 짜야 한다)"}

규칙
- 교사가 말로 할 것을 종이에 적지 않는다. 상황·배경·왜 하는지는 넣지 않는다.
  종이에 남는 글은 무엇을 하라는 지시와 판단을 묻는 물음뿐이다.
- 한 칸에서 활동을 시작하기 전에 읽는 글자는 지시와 물음을 합쳐 60자 안쪽이다.
  60자면 6학년이 10초 안에 읽는다.
- 한 문장에 한 가지만. 25자를 넘기면 자른다.
- 칸 제목은 아이가 하는 일로 적는다. 설계 의도를 이름으로 삼지 않는다.
- 물음은 결론을 심지 않는다. 어느 쪽을 골라도 채워지는 틀로 쓴다.
- 채점 기준·성취기준 코드·차시·소요 시간을 적지 않는다. 아이 종이에 없는 것들이다.
- 학생용 목표는 20자 안쪽으로 오늘 할 일만. 조건을 붙이지 않는다.
- 답 칸 줄 수는 ${S.klass.grade}학년이 3분 안에 채울 분량으로 정한다.
- 처음 나오는 어려운 말에는 괄호로 예를 붙인다.
- 전체 글자 수는 400자 안쪽으로 한다.

A4 한 장으로 인쇄할 수 있게 만들어 줘.`;
}
function deckPrompt(t, d){
  const rb = (t.rubric || []).filter(x => (x.text || "").trim());
  return `${promptHead(t, d)}
[학생이 볼 수준 서술 — 학생 말로 옮겨 한 장에 싣는다]
${rb.map(x => `  - ${x.level}: ${x.text}`).join("\n") || "  (없음)"}

위 수업에서 교사가 띄울 화면(슬라이드)을 만들어 줘.

규칙
- 표지에 성취기준 코드를 싣는다. 화면은 교사가 띄우는 것이라 활동지와 반대다.
- 차시와 소요 시간은 넣지 않는다. 아이를 재촉하는 글자가 된다.
- 한 장에 한 가지만. 제목과 본문을 합쳐 120자를 넘기지 않는다.
  실물 75%가 121자 안쪽이었다. 넘칠 것 같으면 장을 나누거나 발표자 노트로 내린다.
- 교사가 할 설명·근거·까닭은 화면이 아니라 발표자 노트에 적는다. 화면은 학생이 본다.
- 수준 서술은 학생 말로 바꿔 한 장 싣는다.
  ‘제한적으로 수행한다’ 같은 말을 아이에게 그대로 주지 않는다.
- 차례는 표지 → 학습문제 → 활동마다 발문과 안내 → 정리다.`;
}

/* ── 지도안 본문 ──
   수업 중에 펴 보는 나침반이다(lesson_plan_guide). 설계 해설은 넣지 않는다 */
function planBody(t, d, St){
  const P = [], rb = (t.rubric || []).filter(r => (r.text || "").trim());
  const opts = seeOpts(t), p = periodsOf(d);
  const line  = x => P.push(hwpP(x));
  const head  = x => { P.push(hwpP("")); P.push(hwpP(x, St.head)); };
  const bold  = x => P.push(hwpP(x, St.bold));

  P.push(hwpP(t.name || "수업 지도안", St.title, St.center));
  P.push(hwpP(klassLine(t, d), 0, St.center));

  head("평가 계획");
  bold(`평가 요소 : ${t.name || ""}`);
  if(t.criteria) line(`평가 내용 : ${t.criteria}`);
  line(`  └ 관찰 관점 : ${opts.length ? opts.join(" · ") : "(아직 없음)"}`);
  line("");
  line("성취기준");
  if(t.standards.length) t.standards.forEach(c => line(`  [${c}] ${CODEMAP[c]?.text || ""}`));
  else line("  (걸린 성취기준 없음)");
  line("");
  line(`학습목표 : ${d.goal || "(아직 쓰지 않음)"}`);
  line("");
  line("기준과 피드백");
  rb.forEach(r => { line(`  ${r.level} : ${r.text}`);
    if(r.fb) line(`      → ${r.fb}`); });
  if(!rb.length) line("  (수준 서술 없음)");
  line("");
  line("평가하지 않는 것");
  const na = (d.notAssessed || []).filter(Boolean);
  if(na.length) na.forEach(x => line(`  - ${x}`));
  else line("  - (수업 전에 적어 둘 것)");

  head(`교수·학습 과정  (${p}차시 · ${minutesOf(d)}분)`);
  (d.flow || []).forEach(r => {
    const k = seesLive(r, opts);
    const see = k.includes("hook") ? "동기 유발" : (k.length ? `관점 : ${k.join(" · ")}` : "관점 없음");
    bold(`[${r.phase} ${r.min}분] ${r.name}`);
    line(`   ${see}`);
    (r.asks  || []).forEach(a => line(`   • ${a}`));
    (r.steps || []).forEach(x => line(`   - ${x}`));
    if(r.aid) line(`   ▸ 못 따라올 때 : ${r.aid}`);
    line("");
  });
  if(!(d.flow || []).length) line("(활동을 아직 짜지 않았습니다)");

  if(d.hands && d.hands.gate && d.hands.gate !== "fix"){
    head("도구를 먼저 쓰는 까닭");
    line(`${HAND_WHY[d.hands.gate] || d.hands.gate}${d.hands.why ? ` — ${d.hands.why}` : ""}`);
  }

  head("수업 뒤 환류  (수업을 해 본 뒤 채운다)");
  line(`본 것   : ${d.reflect?.saw  || ""}`);
  line(`왜?     : ${d.reflect?.why  || ""}`);
  line(`다음엔  : ${d.reflect?.next || ""}`);

  /* 활동지와 수업자료는 이 도구가 만들지 않는다 — 만드는 법을 지도안 끝에 실어 보낸다.
     한글파일 하나만 들고 다니면 되도록, 따로 챙길 것을 만들지 않는다. */
  head("활동지·수업자료 만들기");
  line("아래 글을 그대로 복사해 쓰시는 AI에 넣으면 됩니다. 이 도구는 파일을 만들지 않습니다.");
  line("");
  bold(`▣ ${PROMPT_TITLES.sheet}`);
  sheetPrompt(t, d).split("\n").forEach(x => line(x));
  line("");
  bold(`▣ ${PROMPT_TITLES.deck}`);
  deckPrompt(t, d).split("\n").forEach(x => line(x));
  return P.join("");
}
const klassLine = (t, d) =>
  `${S.klass.grade}학년 ${S.klass.room || ""}반 · ${subjShort(t.subject)} · ${periodsOf(d)}차시(${minutesOf(d)}분)`;
const safeName = v => String(v || "지도안").replace(/[\/:*?"<>|]/g, "").trim().slice(0, 40) || "지도안";

async function saveHwpx(t, d, btn){
  const keep = btn.textContent; btn.disabled = true; btn.textContent = "…";
  try{
    const blob = await buildHwpx(St => planBody(t, d, St));

/* 도구가 먼저 오는 자리에서만 뜬다. 막지 않고 판단을 남기게 한다 —
   판정 단위는 도구가 아니라 조작이라 기계가 옳고 그름을 정할 수 없다 */
function handsCard(d){
  const g = handsGate(d.flow);
  if(!g || g.ok) return "";
  const h = d.hands;
  /* 판정한 뒤 흐름이 바뀌어 다른 활동이 첫 도구가 되었으면 다시 묻는다 */
  if(h && h.for === g.name) return `<div class="hands done">
    <h4>${ICON.hand()}손이 먼저다 — 판단을 남김</h4>
    <p><b>${esc(g.name)}</b> · ${esc(HAND_WHY[h.gate] || h.gate)}${h.why ? ` — ${esc(h.why)}` : ``}</p>
    <div class="act"><button class="ghost" id="h-redo" type="button">다시 보기</button></div></div>`;
  return `<div class="hands">
    <h4>${ICON.hand()}손이 먼저인가</h4>
    <p><b>${esc(g.name)}</b>이(가) 화면에서 시작합니다. 그 앞에 같은 일을 손으로 해 보는 활동이 없습니다.
      손으로 만져 본 적 없는 것을 화면으로 먼저 만나면, 아이는 만드는 사람이 아니라 고르는 사람이 됩니다.</p>
    ${Object.entries(HAND_WHY).map(([k, v], i) => `<label>
      <input type="radio" name="hgate" value="${k}"${i ? `` : ` checked`}><span>${esc(v)}</span></label>`).join("")}
    <input type="text" class="why" id="h-why" placeholder="무엇으로 대체하는지 · 축약형은 무엇인지 (골랐다면 적어 주세요)">
    <div class="act"><button class="ghost" id="h-ok" type="button">이 판단을 남깁니다</button></div>
  </div>`;
}

function flowCard(r, i, lv, n){

  return `<div class="fl${ok?"":" nosee"}" data-fi="${i}">
    <div class="fl-head">

    </div>
    <div class="fl-row"><span class="lab">관점</span>
      <div class="fl-see">
        ${lv.map(k => `<button type="button" class="chip kwc" data-see="${esc(k)}"
          aria-pressed="${cur.includes(k)}"${hook?` disabled`:``}>${esc(k)}</button>`).join("")}
        <button type="button" class="chip kwc hookc" data-see="hook"
          aria-pressed="${hook}">동기 유발</button>
      </div></div>
    <div class="fl-row"><span class="lab">발문</span>
      <textarea class="ak" placeholder="한 줄에 하나씩. 답이 갈리는 물음을 절반 이상">${esc((r.asks||[]).join("\n"))}</textarea></div>
    <div class="fl-row"><span class="lab">세부</span>
      <textarea class="st" placeholder="한 줄에 하나씩">${esc((r.steps||[]).join("\n"))}</textarea></div>
    <div class="fl-row"><span class="lab">처방</span>
      <input type="text" class="ad" value="${esc(r.aid||"")}" placeholder="못 따라오는 학생에게 줄 한 걸음"></div>
    ${ok?``:`<div class="fl-msg">어느 지표도 보지 않는 활동입니다 — 동기 유발이 아니면 빼세요.</div>`}
    <div class="fl-act">
      <button class="ghost" type="button" data-up="${i}"${i?"":" disabled"} aria-label="위로">↑</button>
      <button class="ghost" type="button" data-dn="${i}"${i<n-1?"":" disabled"} aria-label="아래로">↓</button>

function bindFlow(t, d){
  const box = el("d-flowpanel"), lv = seeOpts(t);
  /* 흐름을 통째로 새로 짠다. 교사가 적어 둔 것이 있을 때만 물어본다 —
     빈 카드만 있는 상태에서 확인을 받으면 아무것도 안 버리는데 겁을 주게 된다 */
  const gen = el("d-gen");
  if(gen) gen.onclick = () => {
    if(flowWritten(d.flow, lv) &&
       !confirm("지금 흐름을 버리고 새로 만듭니다.\n적어 둔 발문과 세부가 모두 사라집니다.")) return;
    genFlow(t, d, gen, false); };
  const fill = el("d-fill");
  if(fill) fill.onclick = () => genFlow(t, d, fill, true);
  const hok = el("h-ok");
  if(hok) hok.onclick = () => {
    const g = handsGate(d.flow); if(!g) return;
    const sel = box.querySelector("input[name=hgate]:checked");
    d.hands = {gate: sel ? sel.value : "fix", why: (el("h-why")?.value || "").trim(),
               for: g.name, at: new Date().toISOString()};
    save(); paintFlow(t, d); };
  const hredo = el("h-redo");
  if(hredo) hredo.onclick = () => { d.hands = null; save(); paintFlow(t, d); };
  const add = el("d-add");
  if(add) add.onclick = () => {
    (d.flow ||= []).push({phase: d.flow.length ? "전개" : "도입",
      name:"", min:5, asks:[], steps:[], sees:"", aid:""});
    save(); paintFlow(t, d); };

  box.querySelectorAll(".fl").forEach(card => {
    const r = d.flow[+card.dataset.fi], g = s => card.querySelector(s);
    g(".ph2").onchange = e => { r.phase = e.target.value; save(); };
    g(".nm").onchange = e => { r.name = e.target.value.trim(); save(); };
    /* 합계와 경고가 바뀌는 둘만 다시 그린다 — 글 칸은 다시 그리면 커서가 튄다 */
    g(".mn").onchange = e => { r.min = Math.max(0, +e.target.value || 0); save(); paintFlow(t, d); };
    /* 관점 토글. 동기 유발은 배타적이다 — 평가하지 않는 활동에 관점을 달 수 없다 */
    card.querySelectorAll("[data-see]").forEach(b => b.onclick = () => {
      const k = b.dataset.see, now = new Set(seesLive(r, lv));
      if(k === "hook"){ now.has("hook") ? now.delete("hook") : (now.clear(), now.add("hook")); }
      else { now.delete("hook"); now.has(k) ? now.delete(k) : now.add(k); }
      r.sees = [...now]; save(); paintFlow(t, d); });
    g(".ak").onchange = e => { r.asks = toLines(e.target.value); save(); };
    g(".st").onchange = e => { r.steps = toLines(e.target.value); save(); };
    g(".ad").onchange = e => { r.aid = e.target.value.trim(); save(); };
    card.querySelectorAll("textarea").forEach(x => { autoGrow(x); x.oninput = () => autoGrow(x); });
  });
  const swap = (i, j) => { const f = d.flow; [f[i], f[j]] = [f[j], f[i]]; save(); paintFlow(t, d); };
  box.querySelectorAll("[data-up]").forEach(b => b.onclick = () => swap(+b.dataset.up, +b.dataset.up - 1));
  box.querySelectorAll("[data-dn]").forEach(b => b.onclick = () => swap(+b.dataset.dn, +b.dataset.dn + 1));
  box.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
    const i = +b.dataset.rm;
    if(!confirm(`‘${d.flow[i].name || "이 활동"}’을 지웁니다.`)) return;
    d.flow.splice(i, 1); save(); paintFlow(t, d); });
}

/* 루브릭 → 활동. 규칙은 skill의 activity_design·backward_design에서 그대로 옮겨 온 것이다 */
/* 흐름은 활동마다 발문과 세부가 붙어 답이 길다. 기본 8192로는 도중에 잘리고,
   잘린 JSON은 부분만 복구돼 빈 배열로 보인다 — 그래서 여유를 준다 */
const aiJSON2 = (prompt, opt) => aiJSON(prompt, Object.assign({maxTokens:24576}, opt || {}));

/* 답에서 활동 배열을 찾아낸다. 한국어로 물었으니 키도 한국어로 오는 일이 잦고,
   배열만 덜렁 오기도 한다. 키 이름을 하나로 못 박아 두면 그때마다 빈손이 된다 */
function pickFlowArray(r){
  if(Array.isArray(r)) return r;
  if(!r || typeof r !== "object") return [];
  for(const k of ["flow","활동","활동흐름","흐름","수업흐름","activities","activity"])
    if(Array.isArray(r[k])) return r[k];
  /* 이름이 무엇이든 객체가 담긴 배열이 하나뿐이면 그것이다 */
  const arrs = Object.values(r).filter(v =>
    Array.isArray(v) && v.some(x => x && typeof x === "object" && !Array.isArray(x)));
  return arrs.length === 1 ? arrs[0] : [];
}
/* 여러 키 이름 가운데 값이 든 것을 고른다 */
function pickKey(x, ...keys){
  for(const k of keys){ const v = x?.[k]; if(v !== undefined && v !== null && v !== "") return v; }
  return undefined;
}
const asList = v => Array.isArray(v) ? v.map(s => String(s).trim()).filter(Boolean)
  : (typeof v === "string" && v.trim() ? toLines(v) : []);

/* 모델이 어떤 모양으로 보내오든 한 칸씩 걸러 담는다. 두 갈래가 같이 쓴다 */
function normFlowRow(x, lv){
  const ph = String(pickKey(x, "phase", "단계") || "");
  const raw = pickKey(x, "sees", "관점", "무엇을보나", "관찰", "지표");
  const cand = Array.isArray(raw) ? raw.map(v => String(v).trim())
    : (raw ? String(raw).split(/[,·]/).map(v => v.trim()) : []);
  return {
    phase: PHASES.includes(ph) ? ph : "전개",
    name:  String(pickKey(x, "name", "활동명", "활동", "이름") || "").trim(),
    min:   Math.max(0, Math.round(+pickKey(x, "min", "분", "시간", "소요시간") || 0)),
    asks:  asList(pickKey(x, "asks", "발문", "질문")),
    steps: asList(pickKey(x, "steps", "세부", "활동내용", "내용", "절차")),
    /* 과제에 걸어 둔 관점이 아니면 버린다 — 지어낸 지표를 그대로 들이지 않는다.
       동기 유발은 배타적이라 그것만 남긴다 */
    sees:  cand.includes("hook") ? ["hook"] : cand.filter(k => lv.includes(k)),
    aid:   String(pickKey(x, "aid", "처방", "도움", "미도달처방") || "").trim()
  };
}
/* 한 칸이라도 비어 있나 — 「빈칸 채우기」를 띄울지 정한다 */
const hasBlank = (r, opts) => !r.name || !r.min || !(r.asks||[]).length ||
  !(r.steps||[]).length || !seeOK(r, opts) || !r.aid;
/* 교사가 실제로 쓴 것이 하나라도 있나. 없으면 채울 빈칸이 아니라 빈 종이다 —
   그때는 카드 개수에 갇히지 않도록 새로 짠다(＋활동이 넣어 두는 기본 분은 쓴 것이 아니다) */
const flowWritten = (flow, opts) => (flow || []).some(r =>
  r.name || (r.asks||[]).length || (r.steps||[]).length || r.aid || seeOK(r, opts));

/* ── 손이 먼저다(§2-1) ──
   초등은 구체적 조작기에 걸쳐 있어, 손으로 만져 본 적 없는 것을 화면으로 먼저 만나면
   개념이 서지 않는다. 기계가 보는 것은 딱 하나 — 도구를 여는 그 시점에 같은 일을
   손으로 해 본 활동이 앞에 있는가. 판정 단위는 도구가 아니라 조작이므로,
   맞고 틀림은 기계가 정하지 않고 교사가 정한다. */
const DIGITAL = /스프레드시트|엑셀|구글\s*시트|프레젠테이션|파워포인트|키노트|한글\s*프로그램|앱|어플|프로그램|소프트웨어|태블릿|컴퓨터|노트북|크롬북|아이패드|패드|스마트폰|인공지능|AI|챗봇|생성형|검색|타이핑|자판|코딩|엔트리|스크래치|영상\s*(제작|편집|촬영)|녹음|온라인|웹\s*사이트|누리집|플랫폼|디지털|전자칠판|미러링|QR/i;
const isDigital = r => DIGITAL.test([r.name || "", ...(r.steps||[]), ...(r.asks||[])].join(" "));
/* 손 활동으로 치는 것은 지표를 보는 활동뿐이다 — 동기 유발만 앞에 둔 것은
   "같은 일을 해 봤다"가 아니다 */
function handsGate(flow){
  const rows = flow || [];
  const at = rows.findIndex(isDigital);
  if(at < 0) return null;
  const done = rows.slice(0, at).some(r => {
    const k = seesOf(r);
    return !isDigital(r) && k.length && !k.includes("hook"); });
  return {at, ok: done, name: rows[at].name || "이 활동"};
}
const HAND_WHY = {
  fix:   "흐름을 고치겠다",
  risk:  "위험하거나 민감해서 실물로 못 한다",
  scale: "교실 규모로 줄이면 개념이 사라진다",
  time:  "축약형도 시간에 들어가지 않는다"
};

/* 흐름 만들기 두 갈래.
   fill=false 새로 짠다 / fill=true 교사가 쓴 것은 그대로 두고 빈 칸만 채운다.
   두 번째가 기본 쓰임이다 — 교사가 아는 활동은 이미 손에 있고, 모르는 칸만 물으면 된다. */
async function genFlow(t, d, btn, fill){
  if(!aiOn()){ S.ui.tab = "ai"; save(); render(); return; }
  const msg = el("d-flowmsg");
  const keep = btn.textContent; btn.disabled = true; btn.textContent = "…";
  if(msg) msg.hidden = true;
  try{
    const rb = (t.rubric || []).filter(r => (r.text || "").trim());
    const lv = seeOpts(t);
    if(!lv.length) throw new Error("먼저 준비 탭에서 이 평가의 「관찰 관점」을 골라 주세요. 활동이 무엇을 보는지 댈 곳이 없습니다.");
    const p = periodsOf(d), want = minutesOf(d);
    const head = `[학습목표] ${d.goal || "(아직 정하지 않음 — 성취기준에서 끌어낸다)"}
[성취기준]
${t.standards.map(c => `- [${c}] ${CODEMAP[c]?.text || ""}`).join("\n") || "- (없음)"}
[평가 내용] ${t.criteria || "(없음)"}
[관찰 관점 — 활동은 이 가운데 무엇을 보는지 댈 수 있어야 한다]
${lv.map(k => `- ${k}`).join("\n")}
[수준 서술 — 활동의 어려움을 여기에 맞춘다]
${rb.map(x => `- ${x.level}: ${x.text}`).join("\n")}`;
    const rules = `- 활동마다 그 장면에서 교사가 관찰할 관점을 sees에 배열로 적는다. 한 활동에서 여럿을 볼 수 있다.
  고를 수 있는 관점은 이것뿐이다 — ${lv.join(" / ")}. 이 밖의 말을 지어내지 않는다.
  평가하지 않는 동기 유발 활동이면 sees를 ["hook"] 하나로 둔다.
- 어느 관점도 관찰할 수 없는 활동은 넣지 않는다. 재미있어도 넣지 않는다. 예외는 동기 유발 하나뿐이다.
- 손으로 해 볼 수 있는 일은 반드시 먼저 한다. 몸과 구체물로 해 보기 → 말과 기호로 옮기기 → 디지털 도구 순서다.
  도구는 손으로 이미 해 본 일을 반복하거나 완성할 때만 쓴다. 개념을 처음 만나는 자리에 두지 않는다.
- 발문(asks)은 답이 갈리는 물음을 절반 이상 넣는다. 예·아니오로 닫히는 물음만 늘어놓지 않는다.
- 세부(steps)는 교사가 그대로 따라 할 수 있는 동작으로 쓴다.
- 처방(aid)은 그 활동에서 못 따라오는 학생에게 줄 한 걸음이다. 한 번 빗대어 설명한 뒤 좁혀 준다.
- 단계(phase)는 도입·전개·정리 중 하나다.${p > 1 ? `
- ${p}차시 수업이므로 차시가 바뀌는 자리에서 정리와 도입이 다시 온다. 한 차시가 40분을 넘지 않게 나눈다.` : ``}`;

    if(fill){
      /* 교사가 이미 쓴 것을 그대로 보여 준다. 빈 칸이 어디인지 모델이 봐야 한다 */
      const cur = (d.flow || []).map((r, i) => ({i, phase:r.phase||"", name:r.name||"",
        min:+r.min||0, asks:r.asks||[], steps:r.steps||[],
        sees:seesLive(r, lv), aid:r.aid||""}));
      const r = await aiJSON2(`한국 초등학교 ${S.klass.grade}학년 ${subjShort(t.subject)} ${p}차시(${want}분) 수업이다.
아래는 교사가 짜다 만 활동 흐름이다. **빈 칸만 채운다.**

${head}

[현재 흐름 — 빈 칸이 채울 자리다]
${JSON.stringify(cur)}

규칙
- 이미 적혀 있는 값은 고치지 않는다. 받은 그대로 돌려준다. 빈 값("" · 0 · [])만 채운다.
- i를 그대로 돌려준다. 활동을 새로 만들거나 지우거나 순서를 바꾸지 않는다.
- 이미 적힌 활동 이름과 발문을 읽고, 그 활동에 실제로 맞는 내용으로 빈 칸을 채운다.
- 분(min)이 비어 있는 활동에만 분을 넣되, 전체 합이 ${want}에 가깝게 한다.
${rules}

아래 모양 그대로, 키 이름을 번역하지 말고 영문 그대로 쓴다. JSON만 출력한다:
{"flow":[{"i":0,"phase":"도입","name":"활동 이름","min":5,"asks":["발문"],"steps":["세부"],"sees":["hook"],"aid":""}]}`);

      const by = new Map();
      pickFlowArray(r).forEach((x, k) => {
        /* i를 빠뜨리고 순서대로만 보내는 일이 있다 — 그때는 온 순서를 자리로 본다 */
        const at = Number.isInteger(x?.i) ? x.i : (Number.isInteger(+x?.i) ? +x.i : k);
        if(at >= 0 && at < (d.flow || []).length) by.set(at, normFlowRow(x, lv)); });
      if(!by.size){ console.warn("[흐름] 이해하지 못한 응답:", r);
        throw new Error("채울 내용을 받지 못했습니다. 다시 시도해 주세요."); }
      /* 교사가 쓴 값이 언제나 이긴다. 모델의 답은 빈 자리에만 들어간다 */
      d.flow = d.flow.map((r0, i) => {
        const x = by.get(i) || {};
        return {
          phase: r0.phase || x.phase || "전개",
          name:  r0.name  || x.name  || "",
          min:   (+r0.min || 0) || x.min || 0,
          asks:  (r0.asks  || []).length ? r0.asks  : (x.asks  || []),
          steps: (r0.steps || []).length ? r0.steps : (x.steps || []),
          sees:  seeOK(r0, lv) ? seesLive(r0, lv) : (x.sees || []),
          aid:   r0.aid || x.aid || ""
        };
      });
    } else {
      const r = await aiJSON2(`한국 초등학교 ${S.klass.grade}학년 ${subjShort(t.subject)} ${p}차시(${want}분) 수업의 활동 흐름을 짠다.

${head}

규칙
${rules}
- 분(min)의 합이 정확히 ${want}가 되게 한다.

아래 모양 그대로, 키 이름을 번역하지 말고 영문 그대로 쓴다. JSON만 출력한다:
{"flow":[{"phase":"도입","name":"활동 이름","min":5,"asks":["발문"],"steps":["세부"],"sees":["hook"],"aid":""}]}`);

      const made = pickFlowArray(r).map(x => normFlowRow(x, lv)).filter(x => x.name);
      if(!made.length){
        /* 무엇이 왔는지 콘솔에 남긴다 — 이 갈래는 화면에 보일 것이 없어 진단이 막힌다 */
        console.warn("[흐름] 이해하지 못한 응답:", r);
        throw new Error("활동을 만들지 못했습니다. 다시 시도해 주세요. (F12 콘솔에 받은 답이 남습니다)");
      }
      d.flow = made;
    }
    d.at = new Date().toISOString(); save(); paintFlow(t, d);
  }catch(e){
    btn.disabled = false; btn.textContent = keep;
    const m = el("d-flowmsg");
    if(m){ m.hidden = false; m.style.color = "var(--low)"; m.textContent = e.message; }
  }
}

function paintBar(t, d){
  const bar = el("dbar"); if(!bar) return;
  const stage = designStage(d);
  const to = ["d-flowpanel", "d-outpanel"];
  bar.hidden = false;
  bar.innerHTML = `<div class="dbar-in">
    <button class="dbar-back" id="dbar-back" type="button" aria-label="목록으로">◀</button>
    <b class="dbar-name">${esc(t.name || "")}</b>
    <span class="dbar-steps">${DSG_STEPS.map((x, i) => `
      <button type="button" class="dstep${i < stage ? " done" : ""}${i === stage ? " now" : ""}"
        data-go="${to[i]}"><i>${i < stage ? "✓" : i + 1}</i>${x}</button>`).join("")}</span>
  </div>`;
  el("dbar-back").onclick = () => { _dsgId = ""; renderDesign(); };
  bar.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    const p = el(b.dataset.go);
    if(p) p.scrollIntoView({behavior:"smooth", block:"start"}); });
}

/* ── 2015 개정 코드 → 2022 개정 성취기준 추정 ── */
function bigrams(t){
  const x = String(t).replace(/[^가-힣0-9a-zA-Z]/g, "");
  const m = new Map();
  for(let i = 0; i < x.length - 1; i++){
    const g = x.slice(i, i+2);
    m.set(g, (m.get(g)||0) + 1);
  }
  return m;
}
function simText(a, b){
  const A = bigrams(a), B = bigrams(b);
  if(!A.size || !B.size) return 0;
  let dot = 0, na = 0, nb = 0;
  for(const [g,v] of A){ na += v*v; if(B.has(g)) dot += v * B.get(g); }
  for(const v of B.values()) nb += v*v;
  return dot / Math.sqrt(na*nb);
}
/* 교과·학년군 안에서 가장 비슷한 성취기준을 찾는다 */
function guessStd(text, subject, n){
  const areas = stdAreas(subject);
  const cand = [];
  for(const a of areas) for(const [c,t] of a.s) cand.push({code:c, text:t, score:simText(text, t)});
  cand.sort((x,y) => y.score - x.score);
  return cand.slice(0, n || 1);
}

/* ── 한글 문서(HWPX) 읽기 ──
   HWPX는 ZIP 안에 XML이다. 외부 라이브러리를 쓸 수 없으므로(외부 요청 금지) 중앙 디렉터리를
   직접 훑고 브라우저 기본 DecompressionStream("deflate-raw")으로 푼다. */
async function unzip(buf, want){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eo = -1;
  for(let i = u8.length - 22; i >= 0 && i > u8.length - 22 - 65536; i--)
    if(dv.getUint32(i, true) === 0x06054b50){ eo = i; break; }
  if(eo < 0) throw new Error("압축 구조를 읽지 못했습니다. HWPX 파일이 맞는지 확인해 주세요.");
  const n = dv.getUint16(eo + 10, true);
  let p = dv.getUint32(eo + 16, true);
  const out = {}, td = new TextDecoder();
  for(let i = 0; i < n; i++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = td.decode(u8.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + elen + clen;
    if(!want(name)) continue;
    const lnlen = dv.getUint16(lho + 26, true), lelen = dv.getUint16(lho + 28, true);
    const raw = u8.slice(lho + 30 + lnlen + lelen, lho + 30 + lnlen + lelen + csize);
    if(method === 0) out[name] = raw;
    else if(method === 8) out[name] = new Uint8Array(await new Response(
      new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    else throw new Error("이 파일의 압축 방식은 지원하지 않습니다.");
  }
  return out;
}
/* ══ 압축해 내보내기 — unzip()의 짝 ══ */
let _crcT = null;
function crc32(u8){
  if(!_crcT){ _crcT = new Uint32Array(256);
    for(let n = 0; n < 256; n++){ let c = n;
      for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      _crcT[n] = c >>> 0; } }
  let crc = 0xFFFFFFFF;
  for(let i = 0; i < u8.length; i++) crc = _crcT[(crc ^ u8[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
const b64bytes = b64 => { const bin = atob(b64), u = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };

/* files: [{name, data:Uint8Array, store}] — store면 압축하지 않는다.
   시각을 고정값으로 둔다. 같은 내용이면 같은 파일이 나오는 편이 낫다 */
const ZIP_TIME = 0, ZIP_DATE = ((2026 - 1980) << 9) | (1 << 5) | 1;
async function zip(files, mime){
  const enc = new TextEncoder(), parts = [], central = [];
  let off = 0;
  for(const f of files){
    const nm = enc.encode(f.name), crc = crc32(f.data);
    let body = f.data, method = 0;
    if(!f.store){
      body = new Uint8Array(await new Response(new Blob([f.data]).stream()
        .pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());
      method = 8;
    }
    const lh = new Uint8Array(30 + nm.length), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0, true);
    lv.setUint16(8, method, true); lv.setUint16(10, ZIP_TIME, true); lv.setUint16(12, ZIP_DATE, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, body.length, true); lv.setUint32(22, f.data.length, true);
    lv.setUint16(26, nm.length, true); lv.setUint16(28, 0, true);
    lh.set(nm, 30);
    parts.push(lh, body);

    const ch = new Uint8Array(46 + nm.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true); cv.setUint16(10, method, true);
    cv.setUint16(12, ZIP_TIME, true); cv.setUint16(14, ZIP_DATE, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, body.length, true); cv.setUint32(24, f.data.length, true);
    cv.setUint16(28, nm.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
    cv.setUint32(42, off, true);
    ch.set(nm, 46);
    central.push(ch);
    off += lh.length + body.length;
  }
  const csize = central.reduce((a, c) => a + c.length, 0);
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, csize, true); ev.setUint32(16, off, true); ev.setUint16(20, 0, true);
  return new Blob([...parts, ...central, eo], {type: mime || "application/zip"});
}

/* 골격을 풀어 본문만 갈아 끼운다. mimetype은 무압축으로 맨 앞에 둔다 —
   ZIP 안에서 그 자리에 있어야 한글이 형식을 알아본다 */
/* 골격에는 굵은 글씨도 가운데 정렬도 없다 — 글자가 죄다 10pt 민짜라 제목과
   본문이 구별되지 않는다. 골격 파일은 그대로 두고 필요한 모양을 여기서 만든다.
   0번(본문)은 골격 것을 그대로 쓴다 */
function withStyles(header){
  const cp = header.match(/<hh:charPr id="0"[\s\S]*?<\/hh:charPr>/);
  const pp = header.match(/<hh:paraPr id="0"[\s\S]*?<\/hh:paraPr>/);
  const cm = header.match(/<hh:charProperties itemCnt="(\d+)">/);
  const pm = header.match(/<hh:paraProperties itemCnt="(\d+)">/);
  if(!cp || !pp || !cm || !pm) return {xml: header, S:{title:0, head:0, bold:0, center:0}};
  const cNext = Math.max(...[...header.matchAll(/<hh:charPr id="(\d+)"/g)].map(m => +m[1])) + 1;
  const pNext = Math.max(...[...header.matchAll(/<hh:paraPr id="(\d+)"/g)].map(m => +m[1])) + 1;
  /* 굵게는 밑줄 앞자리에 온다 — 한글이 낸 문서가 그 자리에 둔다 */
  const mkC = (id, h, bold) => cp[0]
    .replace('<hh:charPr id="0"', `<hh:charPr id="${id}"`)
    .replace(/height="\d+"/, `height="${h}"`)
    .replace("<hh:underline", (bold ? "<hh:bold/>" : "") + "<hh:underline");
  const mkP = (id, al) => pp[0]
    .replace('<hh:paraPr id="0"', `<hh:paraPr id="${id}"`)
    .replace(/horizontal="[A-Z_]+"/, `horizontal="${al}"`);
  const S = {title: cNext, head: cNext + 1, bold: cNext + 2, ul: cNext + 3, center: pNext};
  const xml = header
    .replace(cm[0], `<hh:charProperties itemCnt="${+cm[1] + 4}">`)
    .replace("</hh:charProperties>",
      mkC(S.title, 1800, true) + mkC(S.head, 1200, true) + mkC(S.bold, 1000, true) +
      /* 학생이 쓰는 칸 — 빈 줄에 밑줄만 그어 둔다 */
      mkC(S.ul, 1000, false).replace(/<hh:underline type="NONE"/, '<hh:underline type="BOTTOM"') +
      "</hh:charProperties>")
    .replace(pm[0], `<hh:paraProperties itemCnt="${+pm[1] + 1}">`)
    .replace("</hh:paraProperties>", mkP(S.center, "CENTER") + "</hh:paraProperties>");
  return {xml, S};
}

/* body는 글자·문단 모양 id를 받아 XML을 돌려주는 함수다.
   mimetype은 무압축으로 맨 앞에 둔다 — 그 자리에 있어야 한글이 형식을 알아본다 */
async function buildHwpx(body){
  if(!HWPX_SKEL) throw new Error("문서 골격이 빠져 있습니다. 빌드를 다시 해 주세요.");
  const all = await unzip(b64bytes(HWPX_SKEL).buffer, () => true);
  const key = "Contents/section0.xml", hkey = "Contents/header.xml";
  if(!all[key] || !all[hkey]) throw new Error("문서 골격이 온전하지 않습니다.");
  const td = new TextDecoder(), te = new TextEncoder();
  const st = withStyles(td.decode(all[hkey]));
  all[hkey] = te.encode(st.xml);
  const sec = td.decode(all[key]);
  if(!sec.includes("</hs:sec>")) throw new Error("문서 골격의 본문을 찾지 못했습니다.");
  const xml = typeof body === "function" ? body(st.S) : body;
  /* 골격의 첫 문단에 쪽 설정(secPr)이 들어 있으므로 그것을 남기고 뒤에 붙인다 */
  all[key] = te.encode(sec.replace("</hs:sec>", xml + "</hs:sec>"));
  const names = Object.keys(all);
  return zip([{name:"mimetype", data:all["mimetype"], store:true},
    ...names.filter(n => n !== "mimetype").map(n => ({name:n, data:all[n]}))],
    "application/hwp+zip");
}
const xesc = v => String(v == null ? "" : v)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
/* 문단 하나. cp는 글자 모양, pp는 문단 모양 — 안 주면 골격의 기본(0번)이다 */
const hwpP = (txt, cp, pp) =>
  `<hp:p id="0" paraPrIDRef="${pp || 0}" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0">` +
  `<hp:run charPrIDRef="${cp || 0}"><hp:t>${xesc(txt)}</hp:t></hp:run></hp:p>`;

function saveBlob(blob, name){
  const u = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);

/* 문단은 한 줄, 표는 한 행을 탭으로 이어 붙인다 — readPlan()이 셀 위치로 읽을 수 있게 */
function hwpxLines(root){
  const out = [], kids = e => [...e.children];
  const deep = (e, ln) => [...e.getElementsByTagName("*")].filter(x => x.localName === ln);
  const textOf = e => deep(e, "t").map(x => x.textContent).join("").replace(/\s+/g, " ").trim();
  (function walk(node){
    for(const e of kids(node)){
      const ln = e.localName;
      if(ln === "tbl"){
        for(const tr of deep(e, "tr")){
          const cells = kids(tr).filter(x => x.localName === "tc").map(textOf);
          if(cells.some(Boolean)) out.push(cells.join("\t"));
        }
      } else if(ln === "p" && !deep(e, "tbl").length){
        const t = textOf(e); if(t) out.push(t);
      } else walk(e);
    }
  })(root);
  return out;
}
async function hwpxText(file){
  const parts = await unzip(await file.arrayBuffer(), n => /^Contents\/section\d+\.xml$/i.test(n));
  const names = Object.keys(parts).sort();
  if(!names.length) throw new Error("본문을 찾지 못했습니다. HWPX 파일이 맞는지 확인해 주세요.");
  const td = new TextDecoder("utf-8"), lines = [];
  for(const nm of names){
    const doc = new DOMParser().parseFromString(td.decode(parts[nm]), "application/xml");
    if(doc.querySelector("parsererror")) throw new Error("본문 XML을 읽지 못했습니다.");
    lines.push(...hwpxLines(doc.documentElement));
  }
  return lines.join("\n");
}

/* ── 평가 문서 읽기 ── */
const CODE_RE = /\[?([246][가-힣]{1,2}\d{2}-\d{2})\]?/g;
function readPlan(text){
  const lines = text.split(/\r?\n/), rows = [], seen = new Set(), notes = [];
  for(const raw of lines){
    const line = raw.trim(); if(!line) continue;
    CODE_RE.lastIndex = 0;
    const codes = [...new Set([...line.matchAll(CODE_RE)].map(m => m[1]))];
    if(!codes.length) continue;
    // 표는 보통 [교과 | 평가과제 | 성취기준 | 평가기준] 순서다. 셀 위치로 읽는다.
    const cells = line.split(/\s*[|\t]\s*/).map(c => c.trim()).filter(Boolean);
    const hasCode = c => { CODE_RE.lastIndex = 0; return CODE_RE.test(c); };
    const ci = cells.findIndex(hasCode);
    const si = cells.findIndex(c => allSubjects().some(s => s === c || subjShort(s) === c || s.startsWith(c)));
    let name = "", criteria = "";
    if(ci > 0){
      const before = cells.slice(0, ci).filter((c,i) => i !== si && !hasCode(c));
      name = before[before.length-1] || "";
      criteria = cells.slice(ci+1).filter(c => !hasCode(c)).join(" ");
    }
    if(!name && cells.length === 1)
      name = line.replace(CODE_RE,"").replace(/^[\s·\-–—.\d)]+/,"").replace(/\s{2,}/g," ").trim();
    if(!name) name = cells.filter((c,i) => i !== si && !hasCode(c))[0] || "";
    if(name.length > 60) name = name.slice(0,60) + "…";
    const known = codes.filter(c => CODEMAP[c]);
    const subj = (si >= 0 ? allSubjects().find(s => s === cells[si] || subjShort(s) === cells[si] || s.startsWith(cells[si])) : "")
                 || (known.length ? CODEMAP[known[0]].subject : "");
    rows.push({name, codes, subject:subj, criteria, pick:true});
    for(const c of codes){
      if(!CODEMAP[c]) notes.push({sev:"mid", t:`2022 개정에 없는 코드 ${c}`, d:"2015 개정 코드이거나 오타일 수 있습니다. 아래 표에서 추정 성취기준을 확인하세요"});
      else{
        if(!BAND_FREE[CODEMAP[c].subject] && CODEMAP[c].grade !== band())
          notes.push({sev:"mid", t:`${c}는 ${CODEMAP[c].grade}학년군`, d:`우리 반은 ${band()}학년군입니다`});
        if((S.klass.excluded||[]).includes(CODEMAP[c].subject)) notes.push({sev:"low", t:`${c}는 전담으로 뺀 ${subjShort(CODEMAP[c].subject)}`, d:"기록은 전담 교사가 입력합니다"});
        if(seen.has(c)) notes.push({sev:"low", t:`${c}가 여러 줄에 있습니다`, d:"같은 성취기준을 여러 과제가 나눠 쓰는지 확인하세요"});
        seen.add(c);
      }
    }
  }
  // 같은 지적은 한 번만
  const uniq = [], keys = new Set();
  for(const n of notes){ const k = n.t; if(!keys.has(k)){ keys.add(k); uniq.push(n); } }
  return {rows, notes:uniq, found:seen.size};
}
/* 코드가 있어도 뜻이 다를 수 있다 — 평가기준 문장과의 닮은 정도로 판정한다.
   ─ 2026-08-03 실측(5학년 2학기 학교 평가계획, 표본 23줄·정답 라벨 대조) ─
   닮은 정도만으로 '같은 뜻'을 가려낼 수는 없었다. 코드가 2022에도 있는 16건 중 실제로 뜻이
   같은 4건의 유사도가 0·18·18·40%였다. 0%가 둘이다 — 평가기준 문장이 성취기준과 어휘를
   거의 공유하지 않기 때문이다. 그래서 SIM_OK(0.45)는 한 건도 통과하지 못했고, 어떤 임계를
   잡아도 같은 뜻과 다른 뜻이 갈리지 않는다. 낮은 유사도는 '다르다'는 증거가 아니다.
   → 판정하지 않고 확인을 청한다. 화면 문구도 단정에서 물음으로 바꾼다.
   자동 채택 임계 0.30은 유지한다 — 0.25로 낮추면 대응 자체가 없는 줄까지 채택되기 시작했다.
   보여 줄 후보의 하한(SIM_LOW)만 0.15에서 0.10으로 내린다. 0.15에서는 후보가 한 줄도 없는
   과제가 20건 중 4건이었고 정답 노출이 15건이었는데, 0.10에서 각각 1건·16건이 된다.
   0.05까지 더 내려도 노출은 늘지 않고 잡음만 붙었다. */
const SIM_OK = 0.45, SIM_LOW = 0.10, SIM_AUTO = 0.30;
function fillGuesses(rows){
  rows.forEach(r => {
    const q = [r.name, r.criteria].filter(Boolean).join(" ");
    r.q = q;
    const checked = (r.codes||[]).map(c => {
      const t = CODEMAP[c]?.text || "";
      return {code:c, exists:!!t, sim:t ? simText(q, t) : 0};
    });
    r.known = checked.filter(x => x.exists && x.sim >= SIM_OK).map(x => x.code);
    r.doubt = checked.filter(x => !r.known.includes(x.code));
    /* 1위만 보이면 적중이 65%지만 셋을 보이면 80%다(같은 실측) — 고르는 것은 교사다 */
    r.guess = (r.subject && r.doubt.length) ? guessStd(q, r.subject, 3).filter(g => g.score > SIM_LOW) : [];
    r.pickGuess = r.pickGuess || (r.guess.length && r.guess[0].score >= SIM_AUTO ? [r.guess[0].code] : []);
    r.manual = r.manual || [];
  });
  return rows;
}
function rowCodes(r){
  const out = (r.known||[]).slice();
  (r.pickGuess||[]).forEach(c => out.push(c));
  (r.manual||[]).forEach(c => out.push(c));
  return [...new Set(out)];
}

  /* 닮은 글자로는 닿지 않는 짝이 있다 — 실측에서 「광복을 위하여 힘쓴 인물」과 정답인
     「일제의 식민 통치와 이에 대한 저항」은 겹치는 두 글자가 하나도 없었다. 뜻으로 이어야 한다.
     교과마다 한 번씩만 부르고, 후보 목록도 그 교과 학년군으로 좁혀 넣는다. */
  async function matchByAI(btn){
    const todo = upload.rows.map((r,i) => ({r,i})).filter(x => x.r.subject && (x.r.doubt||[]).length);
    if(!todo.length) return;
    const bySubj = {};
    todo.forEach(x => (bySubj[x.r.subject] = bySubj[x.r.subject] || []).push(x));
    btn.disabled = true; btn.textContent = "맞추는 중…";
    const msg = el("up-msg"); if(msg) msg.textContent = "";
    let hit = 0, fail = [];
    for(const [subject, list] of Object.entries(bySubj)){
      const pool = [];
      for(const a of stdAreas(subject)) for(const [c,t] of a.s) pool.push(`${c} ${t}`);
      if(!pool.length) continue;
      const ask = list.map((x,k) => `${k}. 과제: ${x.r.name}\n   평가기준: ${(x.r.criteria||"").slice(0,160)}\n   문서에 적힌 2015 코드: ${(x.r.doubt||[]).map(d=>d.code).join(", ")||"없음"}`).join("\n");
      try{
        const v = await aiJSON(
`2015 개정 교육과정으로 쓰인 평가 계획을 2022 개정 성취기준에 잇는 일이다.

아래는 2022 개정 ${subject} ${band()}학년군 성취기준 전체다. 여기 있는 코드만 쓸 수 있다.
${pool.join("\n")}

다음 평가과제 각각에 해당하는 성취기준을 최대 2개 고른다.
${ask}

주의
- 글자가 닮은 것이 아니라 뜻이 이어지는 것을 고른다. 인물 이름이나 사건 이름이 2022 문장에 없어도, 그 내용을 담은 성취기준이 있으면 그것이 답이다.
- 2022 개정에서 빠진 내용이면 codes를 빈 배열로 둔다. 억지로 채우지 않는다.
- why는 한 문장으로 짧게.

JSON만 출력한다: {"picks":[{"i":0,"codes":["6사06-01"],"why":"..."}]}`);
        const arr = Array.isArray(v?.picks) ? v.picks : (Array.isArray(v) ? v : []);
        for(const p of arr){
          const x = list[+p.i]; if(!x) continue;
          const codes = (p.codes||[]).filter(c => CODEMAP[c] && pool.some(s => s.startsWith(c + " ")));
          if(!codes.length) continue;
          const g = x.r.guess || (x.r.guess = []);
          codes.forEach(c => { if(!g.some(y => y.code === c)) g.unshift({code:c, score:simText(x.r.q||"", CODEMAP[c].text||""), byAI:true}); });
          x.r.pickGuess = [...new Set([...(x.r.pickGuess||[]), ...codes])];
          x.r.aiWhy = p.why || "";
          hit++;
        }
      }catch(e){ fail.push(`${subject} — ${e.message}`); }
    }
    paintUpload(true);
    /* 교과별로 따로 부르므로 한 교과가 실패해도 나머지는 살아 있다 — 둘 다 알린다 */
    const m2 = el("up-msg");
    if(m2) m2.textContent = [
      hit ? `${hit}줄을 다시 골랐습니다. 체크된 것을 확인해 주세요.` : "",
      fail.length ? `${fail.length}개 교과는 못 했습니다 — ${fail[0]}` : ""
    ].filter(Boolean).join("  ") || "AI도 해당하는 성취기준을 찾지 못했습니다. 「직접 고르기」를 써 주세요.";
  }
}

/* ── 산출물 보기 ── */
let _furl = null;
async function openFile(id){
  const d = el("fdlg"), body = el("fdlg-body");
  el("fdlg-name").textContent = "산출물"; el("fdlg-size").textContent = "";
  body.innerHTML = `<div class="empty">여는 중…</div>`;
  d.showModal();
  try{
    const rec = await fileGet(id);
    if(!rec) throw new Error("보관된 파일을 찾지 못했습니다. 다른 기기에서 담았거나 백업을 사진 없이 불러왔을 수 있습니다.");
    if(_furl) URL.revokeObjectURL(_furl);
    _furl = URL.createObjectURL(rec.blob);
    el("fdlg-name").textContent = rec.name || "산출물";
    el("fdlg-size").textContent = `${kb(rec.size||rec.blob.size)} · ${rec.at||""}`;
    /* 담을 때 AI가 읽어 둔 것이 있으면 그대로 보여준다 — 다시 부르지 않는다 */
    const rd = rec.read;
    body.innerHTML = (/^image\//.test(rec.type)
      ? `<img src="${_furl}" alt="${esc(rec.name||"산출물")}">`
      : `<embed src="${_furl}" type="${esc(rec.type||"application/pdf")}" style="width:100%;height:70vh">`)
      + (rd ? `
        <div class="scan" style="margin-top:10px">
          <div class="scan-head"><span class="lab">담을 때 사진에서 읽은 것</span>
            <span class="tally">${rd.at?esc(rd.at.slice(5).replace("-","/")):""}</span></div>
          ${(rd.memos||[]).map(m=>`<div class="pt mid" style="padding:7px 0;border-bottom:1px solid var(--rule)">
              <span class="mk">·</span><span>${esc(m)}</span></div>`).join("")}
          ${(rd.points||[]).length?`<div class="hint" style="margin-top:8px">${rd.points.map(p=>"· "+esc(p)).join("<br>")}</div>`:""}
          ${rd.text?`<details class="help"><summary>옮겨 적은 글 보기</summary><div style="white-space:pre-wrap">${esc(rd.text)}</div></details>`:""}
        </div>` : ``);
    el("fdlg-save").onclick = () => {
      const a = document.createElement("a");
      a.href = _furl; a.download = rec.name || "산출물"; a.click();
    };
  }catch(e){ body.innerHTML = `<div class="empty" style="color:var(--low)">${esc(e.message)}</div>`; }
}
el("fdlg-close").onclick = () => el("fdlg").close();
el("fdlg").addEventListener("close", () => { if(_furl){ URL.revokeObjectURL(_furl); _furl = null; } });

/* ── 산출물 나눠 담기 ──
   사진을 크게 띄우고 번호를 누르면 그 학생의 관찰로 담기고 다음 장으로 넘어간다.
   번호를 누르는 즉시 노트가 생기므로 중간에 닫아도 담은 것은 남는다.
   수준 칩을 여기 두는 것은 근거(사진)가 같은 화면에 있어서다 — 명단만 보고 판정하는
   화면은 만들지 않는다(§일괄의 경계 규칙 1). */
let assign = null, _aurl = null;
async function openAssign(files){
  const cur = slots().find(x => x.key === S.ui.slot);
  assign = {items:[], i:0, cur, made:[], level:""};
  el("adlg-cnt").textContent = `${files.length}장 줄이는 중…`;
  el("adlg-pic").innerHTML = `<span class="none">받는 중…</span>`;
  el("adlg-grid").innerHTML = ""; el("adlg-sum").textContent = "";
  el("adlg").showModal();
  for(const f of files){
    if(f.size > 25 * 1024 * 1024) continue;
    try{
      const blob = await shrink(f), id = uid();
      await filePut(id, {blob, name:f.name, type:blob.type || f.type, size:blob.size, at:today()});
      assign.items.push({id, name:f.name, size:blob.size, blob, noteId:null});
      el("adlg-cnt").textContent = `${assign.items.length}/${files.length}장 준비`;
    }catch(e){}
  }
  if(!assign.items.length){ el("adlg-pic").innerHTML = `<span class="none">받지 못했습니다</span>`; return; }
  paintAssign();
}
function paintAssign(){
  const a = assign; if(!a) return;
  const it = a.items[a.i];
  el("adlg-cnt").textContent = `${a.i + 1} / ${a.items.length}장`;
  if(_aurl){ URL.revokeObjectURL(_aurl); _aurl = null; }
  if(it && /^image\//.test(it.blob.type || "")){
    _aurl = URL.createObjectURL(it.blob);
    el("adlg-pic").innerHTML = `<img src="${_aurl}" alt="">`;
  } else el("adlg-pic").innerHTML = `<span class="none">${it ? esc(it.name) : "남은 장이 없습니다"}</span>`;
  el("adlg-meta").textContent = it ? `${it.name} · ${kb(it.size)}` : "";
  el("adlg-text").value = "";
  /* 수준은 장마다 새로 고른다 — 앞 장의 판정이 따라가지 않게 */
  a.level = "";
  const t = S.tasks.find(x => x.id === _taskId && a.cur?.kind === "subj");
  el("adlg-lv").innerHTML = (t?.rubric || []).map(r =>
    `<button class="lvc" type="button" data-alv="${esc(r.level)}" title="${esc(r.text)}" aria-pressed="false">${esc(r.level)}</button>`).join("");
  const got = {};
  a.made.forEach(m => { got[m.sid] = (got[m.sid] || 0) + 1; });
  el("adlg-grid").innerHTML = S.students.map(s =>
    `<button type="button" data-asid="${s.id}">
      <span class="no">${esc(String(s.no).padStart(2,"0"))}</span>${S.klass.numbersOnly?"":esc(s.name||"")}
      ${got[s.id]?`<span class="got">${got[s.id]}</span>`:""}</button>`).join("");
  const none = S.students.filter(s => !got[s.id]).length;
  el("adlg-msg").textContent = it ? "번호를 누르면 그 학생에게 담기고 다음 장으로 넘어갑니다"
                                  : "남은 장이 없습니다 — 마치기를 누르세요";
  el("adlg-sum").textContent = `담은 것 ${a.made.length}장 · 아직 없는 학생 ${none}명`;
  el("adlg-skip").disabled = !it; el("adlg-drop").disabled = !it;
}
el("adlg-lv").onclick = e => {
  const b = e.target.closest("[data-alv]"); if(!b || !assign) return;
  assign.level = assign.level === b.dataset.alv ? "" : b.dataset.alv;
  el("adlg-lv").querySelectorAll("[data-alv]").forEach(x =>
    x.setAttribute("aria-pressed", String(x.dataset.alv === assign.level)));
};
el("adlg-grid").onclick = e => {
  const b = e.target.closest("[data-asid]"); if(!b || !assign) return;
  const a = assign, it = a.items[a.i]; if(!it) return;
  const text = el("adlg-text").value.trim();
  const keep = _noteLevel; _noteLevel = a.level;
  const n = buildNote(b.dataset.asid, text, a.cur, true);
  _noteLevel = keep;
  n.fileId = it.id;
  S.notes.push(n); it.noteId = n.id;
  a.made.push({sid:b.dataset.asid, fileId:it.id, noteId:n.id});
  a.items.splice(a.i, 1);
  if(a.i >= a.items.length) a.i = Math.max(0, a.items.length - 1);
  save(); paintAssign();
};
el("adlg-skip").onclick = () => { const a = assign; if(!a || a.items.length < 2) return;
  a.i = (a.i + 1) % a.items.length; paintAssign(); };
el("adlg-drop").onclick = async () => {
  const a = assign, it = a?.items[a.i]; if(!it) return;
  a.items.splice(a.i, 1);
  if(a.i >= a.items.length) a.i = Math.max(0, a.items.length - 1);
  try{ await fileDel(it.id); }catch(e){}
  paintAssign();
};
el("adlg-done").onclick = async () => {
  const a = assign;
  if(a?.items.length && !confirm(`아직 나누지 않은 ${a.items.length}장이 있습니다.\n그 장들은 지워집니다. 마칠까요?`)) return;
  for(const it of (a?.items || [])){ try{ await fileDel(it.id); }catch(e){} }
  el("adlg").close();
};
el("adlg").addEventListener("close", () => {
  if(_aurl){ URL.revokeObjectURL(_aurl); _aurl = null; }
  assign = null; renderWrite();
});

/* ── 학생 고르기 창 ──
   옮기기(단일)와 함께 담기(다중)가 함께 쓴다. 수준은 이 창에 들어오지 않는다. */
let sdlgState = null;
function pickStudents({title, multi, preset, exclude, okLabel, msg, allowEmpty, onOK}){
  sdlgState = {multi:!!multi, sel:new Set(preset||[]), exclude:new Set(exclude||[]),
               allowEmpty:!!allowEmpty, onOK};
  el("sdlg-title").textContent = title;
  el("sdlg-msg").textContent = msg || "";
  el("sdlg-all").hidden = !multi;
  el("sdlg-ok").textContent = okLabel || "고르기";
  paintSdlg(okLabel);
  el("sdlg").showModal();
}
function paintSdlg(okLabel){
  const st = sdlgState;
  el("sdlg-grid").innerHTML = S.students.map(s => {
    const off = st.exclude.has(s.id);
    return `<button type="button" data-sid="${s.id}" aria-pressed="${st.sel.has(s.id)}"${off?" disabled":""}>
      <span class="no">${esc(String(s.no).padStart(2,"0"))}</span>${S.klass.numbersOnly?"":esc(s.name||"")}</button>`;
  }).join("") || `<div class="empty">학생이 없습니다</div>`;
  el("sdlg-cnt").textContent = st.multi ? (st.sel.size ? `${st.sel.size}명 선택` : "") : "";
  el("sdlg-ok").disabled = !st.sel.size && !st.allowEmpty;
  if(st.multi && okLabel !== undefined && !st.allowEmpty)
    el("sdlg-ok").textContent = st.sel.size ? `${st.sel.size}명에게 담기` : (okLabel || "담기");
}
el("sdlg-grid").onclick = e => {
  const b = e.target.closest("[data-sid]"); if(!b || b.disabled) return;
  const st = sdlgState, id = b.dataset.sid;
  if(st.multi){ st.sel.has(id) ? st.sel.delete(id) : st.sel.add(id); paintSdlg(""); }
  else { st.sel = new Set([id]); el("sdlg").close(); st.onOK([id]); }
};
el("sdlg-all").onclick = () => {
  const st = sdlgState;
  const all = S.students.filter(s => !st.exclude.has(s.id)).map(s => s.id);
  st.sel = st.sel.size === all.length ? new Set() : new Set(all);
  paintSdlg("");
};
el("sdlg-cancel").onclick = () => el("sdlg").close();
el("sdlg-ok").onclick = () => { const st = sdlgState; el("sdlg").close(); st.onOK([...st.sel]); };

/* ── 성취기준 창 ── */
function openTask(subject, task, onOK){
  openStd(subject, task ? task.standards : [], null, {task, onSave(v){
    if(task){
      Object.assign(task, {name:v.name, criteria:v.criteria, standards:v.codes, rubric:v.rubric,
                           kw:v.kw, sources:v.sources, when:v.when, targets:v.targets,
                           axis:v.axis, subject:v.subject});
      save(); onOK(task.id);
    } else {
      const t = {id:uid(), name:v.name, subject:v.subject, standards:v.codes, criteria:v.criteria,
                 rubric:v.rubric, kw:v.kw, sources:v.sources, when:v.when, targets:v.targets,
                 axis:v.axis, legacy:[], off:{}};
      S.tasks.push(t); save(); onOK(t.id);
    }
  }});
}
/* 평가 추가 창 — 1단계 성취기준 고르기 → 2단계 과제 다듬기 (§10-2).
   taskMode 없는 호출(관찰의 성취기준 태그, 가져오기의 직접 고르기)은 1단계만 쓴다. */
function openStd(subject, selected, onOK, taskMode){
  dlgState = {subject, sel:new Set(selected), onOK, taskMode,
              step: (taskMode && taskMode.task) ? 2 : 1,
              kw:new Set(taskMode?.task?.kw || []),
              /* 올라온 낱말은 꺼도 목록에 남는다 — 껐다고 지우면 다시 부르는 수밖에 없다 */
              kwPool:new Set(taskMode?.task?.kw || []),
              /* 평가 요소 갈래 — 창을 닫으면 사라진다. 남는 것은 이어 붙인 한 줄뿐이다 */
              elem:{pool:{}, sel:new Set(), adding:null},
              src:new Set(taskMode?.task?.sources || []),
              /* 빈 배열은 「우리 반 전체」다 — 기본이 전원이므로 빈칸을 강요하지 않는다 */
              targets:(taskMode?.task?.targets || []).slice(),
              axis:taskMode?.task?.axis || "", msg:""};
  const subjSel = el("dlg-subj"), q = el("dlg-q"), rubBox = el("dlg-rub");
  const growRubricField = field => {
    if(!field?.matches?.(".rt,.rf")) return;
    field.style.height = "auto";
    field.style.height = Math.max(field.scrollHeight, 40) + "px";
  };
  const growRubric = () => rubBox.querySelectorAll(".rt,.rf").forEach(growRubricField);

  /* ── 교육부 성취수준으로 수준 서술 채우기 ──
     성취기준을 고르면 그 기준의 A·B·C가 빈칸으로 들어간다. 적힌 칸은 건드리지 않는다
     (「뼈대 만들기」와 같은 규칙). 채운 뒤에는 접어 둔다 — 세 수준을 펼쳐 두면
     읽을 것이 300자 넘게 쌓이고, 교사가 지금 할 일은 읽기가 아니라 고르기다. */
  function paintOfficial(){
    const box = el("dlg-official");
    if(!box || box.hidden) return;
    const more = [...dlgState.sel].filter(c => LV[c]).length - 1;
    const names = [...rubBox.querySelectorAll(".rl")].map(i => i.value.trim()).filter(Boolean);
    const state = dlgState.officialClean ? "교육부 성취수준으로 채웠습니다"
                : dlgState.mine          ? "교육부 성취수준에 내 평가요소를 얹었습니다"
                :                          "교육부 성취수준을 고쳐 썼습니다";
    box.innerHTML =
      `<span class="offmark${dlgState.officialClean ? "" : " edited"}">${state}</span>`
      + `<span class="offlv">${esc(names.join(" · "))}</span>`
      + (more > 0 && dlgState.officialClean
          ? `<span class="offmore">첫 성취기준 기준입니다 — 나머지 ${more}건은 확인해 주세요</span>` : "")
      + `<span class="r">`
      + (dlgState.officialClean ? ""
          : `<button class="link" id="dlg-revert" type="button">되돌리기</button>`)
      + `<button class="link" id="dlg-rubtog" type="button">${rubBox.hidden ? "보기" : "접기"}</button>`
      + `</span>`;
    el("dlg-rubtog").onclick = () => {
      rubBox.hidden = !rubBox.hidden;
      if(!rubBox.hidden) requestAnimationFrame(growRubric);
      paintOfficial();
    };
    const rv = el("dlg-revert"); if(rv) rv.onclick = revertOfficial;
  }
  function fillOfficialRubric(){
    const box = el("dlg-official");
    if(!box) return;
    const codes = [...dlgState.sel].filter(c => LV[c]);
    const key = codes[0] || "";
    if(!key){ box.hidden = true; rubBox.hidden = false; return; }
    /* 고른 성취기준이 그대로면 다시 채우지 않는다 — 교사가 지운 칸을 되살리면 안 된다 */
    if(dlgState.officialFor === key){ paintOfficial(); return; }
    dlgState.officialFor = key;
    const src = LV[key];
    let filled = 0;
    [...rubBox.querySelectorAll(".rrow2")].forEach((row, i) => {
      const t = row.querySelector(".rt");
      if(!t.value.trim() && src[i]){ t.value = src[i]; growRubricField(t); filled++; }
    });
    if(!filled){ box.hidden = true; rubBox.hidden = false; return; }
    dlgState.officialClean = true;
    box.hidden = false;
    rubBox.hidden = true;          /* 채웠으면 접는다 */
    paintOfficial();
  }
  subjSel.innerHTML = subjects().map(s=>`<option value="${esc(s)}"${s===subject?" selected":""}>${esc(subjShort(s))}</option>`).join("");
  subjSel.onchange = () => {
    /* 교과를 넘나들어도 고른 것은 지우지 않는다 — 담은 것은 담긴 채로 둔다.
       뺄 때는 위의 고른 목록에서 ×로 뺀다. 교과 전환이 몰래 빼 가지 않는다. */
    dlgState.subject = subjSel.value;
    /* 교과를 바꿨는데 앞의 검색어가 남아 목록이 비면, 성취기준이 없는 줄 안다 */
    q.value = "";
    dlgState.msg = "";
    /* 관찰 낱말도 지우지 않는다 — 성취기준을 여러 교과에서 담는데 낱말만 교과마다 날아가면
       교과를 오갈 때마다 처음부터 다시 고르게 된다 */
    paintDlg();
  };
  q.value = ""; q.oninput = paintDlg;

  if(taskMode){
    el("dlg-name").value = taskMode.task?.name || "";
    el("dlg-crit").value = taskMode.task?.criteria || "";
    el("dlg-when").value = taskMode.task?.when || "";
    const rb = taskMode.task?.rubric || [];
    [...rubBox.querySelectorAll(".rrow2")].forEach((row,i) => {
      row.querySelector(".rl").value = rb[i]?.level ?? ["잘함","보통","노력요함"][i];
      row.querySelector(".rt").value = rb[i]?.text ?? "";
      row.querySelector(".rf").value = rb[i]?.fb ?? "";
    });
    el("dlg-name").oninput = () => { const b = el("dlg-mine"); if(b) b.disabled = !skelKey(); };
    let lt = null;
    rubBox.oninput = e => {
      growRubricField(e.target);
      /* 한 글자라도 손대면 더는 '교육부 성취수준 그대로'가 아니다 */
      if(dlgState.officialClean && e.target.matches(".rt,.rl")){
        dlgState.officialClean = false; paintOfficial();
      }
      clearTimeout(lt); lt = setTimeout(paintLint, 450);
    };
  }

  el("dlg-cancel").onclick = () => el("dlg").close();
  el("dlg-next").onclick = () => { dlgState.step = 2; dlgState.msg = ""; paintDlg(); el("dlg-name").focus(); };
  el("dlg-back").onclick = () => { dlgState.step = 1; dlgState.msg = ""; paintDlg(); };
  el("dlg-ok").onclick = () => {
    if(dlgState.taskMode){
      const name = el("dlg-name").value.trim();
      if(!name){ el("dlg-name").focus(); return; }
      /* 「피드백」은 비어 있어도 된다 — 빈 칸은 아예 담지 않아 v3 데이터와 모양이 같다 */
      const rubric = [...rubBox.querySelectorAll(".rrow2")]
        .map(row => { const fb = row.querySelector(".rf").value.trim();
          return {level:row.querySelector(".rl").value.trim(),
                  text:row.querySelector(".rt").value.trim(), ...(fb ? {fb} : {})}; })
        .filter(r => r.level && r.text);
      dlgState.taskMode.onSave({name, criteria:el("dlg-crit").value.trim(), codes:[...dlgState.sel],
                                subject:mainSubject(),
                                rubric, kw:[...dlgState.kw], sources:[...dlgState.src],
                                when:el("dlg-when").value.trim(), targets:dlgState.targets.slice(),
                                axis:dlgState.axis});
    } else dlgState.onOK([...dlgState.sel]);
    el("dlg").close();
  };
  /* 고른 목록에서 바로 뺀다 — 뺄 것을 다시 찾아 들어가게 하지 않는다 */
  el("dlg-chosen").onclick = e => { const b = e.target.closest("[data-drop]"); if(!b) return;
    dlgState.sel.delete(b.dataset.drop); dlgState.msg = ""; paintDlg(); };
  el("dlg-body").onclick = e => { const r = e.target.closest(".srow"); if(!r) return;
    const c = r.dataset.code;
    dlgState.sel.has(c) ? dlgState.sel.delete(c) : dlgState.sel.add(c);
    dlgState.msg = ""; paintDlg(); };
  /* 고를 때마다 이어 붙여 평가 요소 한 줄을 만든다.
     다 꺼도 입력칸은 비우지 않는다 — 손으로 쓴 것이 있을 수 있다 */
  const elemToName = () => { const j = joinElem();
    if(j){ const n = el("dlg-name"); n.value = j; n.dispatchEvent(new Event("input",{bubbles:true})); } };
  el("dlg-elem").onclick = e => {
    const add = e.target.closest("[data-add]");
    if(add){ dlgState.elem.adding = add.dataset.add; paintElem(); return; }
    const b = e.target.closest("[data-el]"); if(!b) return;
    const w = b.dataset.el, sel = dlgState.elem.sel;
    sel.has(w) ? sel.delete(w) : sel.add(w);
    elemToName(); paintElem(); };
  /* 직접 적은 것도 고른 것과 같이 다룬다 — 적는 순간 켜진다 */
  el("dlg-elem").onkeydown = e => {
    const inp = e.target.closest(".elnew"); if(!inp) return;
    if(e.key === "Escape"){ dlgState.elem.adding = null; paintElem(); return; }
    if(e.key !== "Enter") return;
    e.preventDefault();
    const w = inp.value.trim(), c = inp.dataset.cat, {pool, sel} = dlgState.elem;
    if(w){
      pool[c] = pool[c] || [];
      if(!pool[c].includes(w)) pool[c].push(w);
      sel.add(w); elemToName();
    }
    dlgState.elem.adding = null; paintElem(); };
  el("dlg-kw").onclick = e => { const b = e.target.closest("[data-kw]"); if(!b) return;
    const w = b.dataset.kw;
    dlgState.kw.has(w) ? dlgState.kw.delete(w) : dlgState.kw.add(w);
    paintKw(); };
  /* 교육부 성취수준이 들어온 뒤로 「빈칸만 채우기」는 아무 일도 하지 않는다 — 빈칸이 없다.
     그래서 기준을 바꾼다: 교육부 것 그대로인 칸은 내 것으로 바꾸고, 내가 고쳐 쓴 칸은 놔둔다. */
  function untouchedCell(t, i){
    const src = ((LV[dlgState.officialFor] || [])[i] || "").trim();
    const v = t.value.trim();
    return !v || (!!src && v === src);
  }
  /* 「내 평가요소 반영」 — 교육부 성취수준(정본) 위에 우리 반 평가요소를 얹는다.
     AI가 있으면 둘을 합쳐 다시 쓰고, 없으면 잣대를 골라 뼈대 문장으로 쓴다. */
  function openMine(){
    if(aiOn()) return aiRubric();
    const m = el("dlg-skelmenu");
    if(!m.hidden){ m.hidden = true; return; }
    const k = skelKey();
    m.innerHTML = `<div class="skelhead">수준을 무엇으로 가를까요</div>`
      + SKEL.map((s,i)=>`<button class="skelopt" type="button" data-skel="${i}">
      <b>${esc(s.axis)}</b><span>${esc(s.hint)} — ${esc(s.t[0](k))}</span></button>`).join("");
    m.hidden = false;
    m.querySelectorAll("[data-skel]").forEach(b => b.onclick = () => {
      const s = SKEL[+b.dataset.skel], kk = skelKey();
      [...rubBox.querySelectorAll(".rrow2")].forEach((row,i) => {
        const t = row.querySelector(".rt");
        if(untouchedCell(t, i) && s.t[i]){ t.value = s.t[i](kk); growRubricField(t); }
      });
      dlgState.axis = s.axis;
      dlgState.officialClean = false; dlgState.mine = true;
      m.hidden = true; paintOfficial(); paintLint();
    });
  }
  /* 얹은 것을 물릴 길을 함께 둔다 — 되돌릴 수 없으면 눌러 보지 못한다 */
  function revertOfficial(){
    const src = LV[dlgState.officialFor] || [];
    [...rubBox.querySelectorAll(".rrow2")].forEach((row,i) => {
      const t = row.querySelector(".rt");
      if(src[i]){ t.value = src[i]; growRubricField(t); }
    });
    dlgState.officialClean = true; dlgState.mine = false;
    el("dlg-skelmenu").hidden = true;
    paintOfficial(); paintLint();
  }
  paintDlg(); el("dlg").showModal(); requestAnimationFrame(growRubric);

  /* 평가 요소가 비면 첫 성취기준 원문을 명사형으로 바꿔 뼈대의 핵으로 쓴다 */
  function skelKey(){
    const n = el("dlg-name").value.trim();
    if(n) return n;
    const first = [...dlgState.sel][0];
    const t = CODEMAP[first]?.text;
    return t ? (toNominal(String(t).replace(/\.\s*$/,"")) || "") : "";
  }
  function stdTexts(){ return [...dlgState.sel].map(c => CODEMAP[c]?.text).filter(Boolean); }

  function paintDlg(){
    const tm = dlgState.taskMode, one = !tm || dlgState.step === 1;
    el("dlg-title").textContent = tm ? (tm.task ? "평가 고치기" : "평가 설계") : "성취기준 고르기";
    const steps = el("dlg-steps");
    steps.hidden = !tm;
    if(tm) steps.querySelectorAll("[data-dstep]").forEach(s => {
      const on = +s.dataset.dstep === dlgState.step;
      on ? s.setAttribute("aria-current","step") : s.removeAttribute("aria-current");
    });
    subjSel.hidden = !one; q.hidden = !one; el("dlg-cnt").hidden = !one; el("dlg-body").hidden = !one;
    el("dlg-chosen").hidden = !one || !dlgState.sel.size;
    el("dlg-task").hidden = !tm || one;
    el("dlg-back").hidden = !tm || one;
    el("dlg-next").hidden = !tm || !one;
    el("dlg-ok").hidden = !!tm && one;
    el("dlg-next").textContent = "선택하고 다음";
    el("dlg-ok").textContent = tm ? (tm.task ? "변경 저장" : "평가 설계 저장") : "담기";
    if(one) paintList();
    else { paintTask(); requestAnimationFrame(growRubric); }
  }
  function paintList(){
    el("dlg-sel").style.color = "";
    const qq = q.value.trim();
    const areas = stdAreas(dlgState.subject);
    let n = 0;
    const html = areas.map(a => {
      const rows = a.s.filter(([c,t]) => !qq || c.includes(qq) || t.includes(qq));
      n += rows.length;
      return rows.length ? `<div class="ahead">${esc(a.n?a.n+" · ":"")}${esc(a.a)}</div>` +
        rows.map(([c,t])=>`<button class="srow" type="button" data-code="${esc(c)}" data-on="${dlgState.sel.has(c)?1:0}">
          <span class="mk">${dlgState.sel.has(c)?"✓":"＋"}</span><span class="code">${esc(c)}</span><span>${esc(t)}</span></button>`).join("") : "";
    }).join("");
    el("dlg-body").innerHTML = html || `<div class="empty">찾는 성취기준이 없습니다</div>`;
    /* 교과를 넘나들며 고르는 동안에도 고른 것이 눈앞에 남아야 한다.
       목록 안의 ✓만으로는 다른 교과로 넘어간 순간 보이지 않는다. */
    const picked = [...dlgState.sel], box = el("dlg-chosen");
    box.hidden = !picked.length;
    box.innerHTML = `<div class="chosen-label">선택한 성취기준 <span>${picked.length}</span></div>` + picked.map(c =>
      `<div class="one"><span class="c">${esc(c)}</span><span>${esc(CODEMAP[c]?.text || "원문을 찾지 못했습니다")}</span>`
      + `<button class="x" type="button" data-drop="${esc(c)}" title="빼기" aria-label="${esc(c)} 빼기">×</button></div>`).join("");
    el("dlg-cnt").textContent = n + "건";
    el("dlg-sel").innerHTML = (dlgState.msg ? `<span style="color:var(--mid)">${esc(dlgState.msg)}</span> · ` : "")
      + (dlgState.sel.size ? `${dlgState.sel.size}건 선택` : "");
    el("dlg-next").disabled = !dlgState.sel.size;
  }
  function paintTask(){
    el("dlg-sel").style.color = "";
    const codes = [...dlgState.sel];
    /* 담은 것이 여러 교과에 걸치면 그대로 보여 준다 — 어디에 놓일지는 맨 앞 교과가 정한다 */
    const subs = dlgSubjects();
    el("dlg-picked").innerHTML =
      `<span class="subj">${esc((subs.length ? subs : [dlgState.subject]).map(subjShort).join(" · "))}</span>`
      + codes.map(c=>`<span class="chip std" title="${esc(CODEMAP[c]?.text||"")}"><b>${esc(c)}</b>${esc(stdCut(c,22))}</span>`).join("")
      + (dlgAreas().length
          ? dlgAreas().map(a=>`<span class="abadge">${esc(a)}</span>`).join("")
          : `<span class="abadge none">영역 없음</span>`);
    /* 평가 요소·루브릭을 쓰는 내내 원문이 눈앞에 있어야 '이 과제가 이 기준을 재는가'를 판단한다 */
    el("dlg-full").innerHTML = codes.map(c =>
      `<div class="one"><span class="c">${esc(c)}</span><span>${esc(CODEMAP[c]?.text || "원문을 찾지 못했습니다")}</span></div>`).join("");
    el("dlg-sel").textContent = codes.length ? `성취기준 ${codes.length}건` : "";
    fillOfficialRubric();
    paintSrc(); paintWho();
    /* AI 기능은 연결 전에도 숨기지 않는다 — 사라진 기능처럼 보이면 연결할 이유도 찾지 못한다. */
    const air = aiOn(), need = air ? "" : ` ai-need`;
    const needText = air ? "" : `<small>연결 필요</small>`;
    el("dlg-elai-slot").innerHTML =
      `<button class="kwai${need}" id="dlg-elai" type="button">${ICON.spark()}AI 추천${needText}</button>`;
    el("dlg-kwai-slot").innerHTML =
      `<button class="kwai${need}" id="dlg-kwai" type="button">${ICON.spark()}AI 추천${needText}</button>`;
    /* 수준 서술은 교육부 성취수준이 이미 채워 둔다. 여기 버튼이 하는 일은
       그 위에 우리 반 평가요소를 얹는 것이다 — AI가 있으면 합쳐 다시 쓰고,
       없으면 잣대를 골라 뼈대 문장으로 쓴다. 그래서 연결 없이도 눌린다. */
    el("dlg-mine-slot").innerHTML =
      `<button class="ghost" id="dlg-mine" type="button">${air ? ICON.spark() : ""}내 평가요소 반영</button>`;
    const needAI = () => {
      const msg = el("dlg-sel");
      msg.textContent = "AI 연결 탭에서 전송 안내에 동의하고 연결을 확인해 주세요";
      msg.style.color = "var(--mid)";
    };
    const eai = el("dlg-elai"); if(eai) eai.onclick = air ? aiElements : needAI;
    const kai = el("dlg-kwai"); if(kai) kai.onclick = air ? aiKeywords : needAI;
    const mn = el("dlg-mine");
    if(mn){ mn.disabled = !skelKey(); mn.onclick = openMine; }
    paintElem(); paintKw(); paintLint();
  }
  /* 증거 계획 — 관찰 한 번으로 판정하는 평가를 설계 시점에 거른다.
     짚어주기의 「근거가 직접관찰뿐인 학생」은 사후 경보인데, 이 줄은 같은 점검을 앞으로 당긴다.
     고른 것이 없어도 담기는 눌린다 — 설계를 강제하는 잠금은 만들지 않는다(§10-2). */
  function paintSrc(){
    el("dlg-src").innerHTML = SOURCES.map(v =>
      `<button type="button" data-src="${esc(v)}" aria-pressed="${dlgState.src.has(v)}"
        >${ICON[SRC_ICON[v]] ? ICON[SRC_ICON[v]]() : ""}${esc(v)}</button>`).join("");
    const n = dlgState.src.size, direct = n === 1 && dlgState.src.has("직접관찰");
    el("dlg-srcmsg").textContent = !n ? "고르지 않아도 됩니다"
      : direct ? "직접관찰 하나뿐입니다 — 남는 자료가 있으면 함께 고르세요"
               : `${n}가지`;
    el("dlg-src").querySelectorAll("[data-src]").forEach(b => b.onclick = () => {
      const v = b.dataset.src;
      dlgState.src.has(v) ? dlgState.src.delete(v) : dlgState.src.add(v);
      paintSrc();
    });
  }
  /* 대상 — 비워 두면 우리 반 전체다. 일부만 고른 경우에만 명단이 생긴다 */
  function paintWho(){
    const t = dlgState.targets, n = t.length;
    el("dlg-whotxt").textContent = !n ? "우리 반 전체"
      : `${n}명 — ` + S.students.filter(s => t.includes(s.id))
          .map(s => String(s.no).padStart(2,"0")).join(" ");
    el("dlg-who").textContent = n ? "다시 고르기" : "일부만 고르기";
  }
  el("dlg-who").onclick = () => pickStudents({
    title:"이 평가를 누구에게", multi:true, preset:dlgState.targets, okLabel:"정하기",
    msg:"비워서 정하면 우리 반 전체가 됩니다", allowEmpty:true,
    onOK(ids){ dlgState.targets = ids.length === S.students.length ? [] : ids; paintWho(); }});

  /* 평가 요소를 갈래로 고른다 — 빈칸을 마주보는 대신 고르고, 고른 것이 이어져 한 줄이 된다.
     세 갈래는 비어 있어도 늘 보인다. 성취기준에 없어도 가르치면서 보는 것이 있고,
     그것을 적을 자리가 없으면 교사는 결국 아무 데나 적는다. ＋로 직접 적는다. */
  function paintElem(){
    const {pool, sel, adding} = dlgState.elem;
    el("dlg-elem").innerHTML = ELEM_CATS.map(c => {
      const chips = (pool[c]||[]).map(w=>`<button class="kwc" type="button" data-el="${esc(w)}"
          aria-pressed="${sel.has(w)}">${esc(w)}</button>`).join("");
      const tail = adding === c
        ? `<input type="text" class="elnew" data-cat="${esc(c)}" maxlength="24" placeholder="적고 Enter">`
        : `<button class="kwc add" type="button" data-add="${esc(c)}" title="${esc(c)}에 직접 적기">＋</button>`;
      return `<div class="elrow"><span class="elcat">${esc(c)}</span><div class="kwchips">${chips}${tail}</div></div>`;
    }).join("");
    const inp = el("dlg-elem").querySelector(".elnew"); if(inp) inp.focus();
  }
  function joinElem(){
    const {pool, sel} = dlgState.elem, out = [];
    for(const c of ELEM_CATS) for(const w of (pool[c]||[])) if(sel.has(w)) out.push(w);
    return out.join(" · ");
  }
  /* 고른 성취기준에서 나온 평가 요소.
     교육부 성취수준 서술(A·B·C)에서 뽑은 것이라 이 성취기준을 재는 말이다.
     교과·학년군 단위 낱말보다 앞에 온다 — 같은 자리를 두고 다투면 좁은 쪽이 이긴다. */
  function stdPoints(){
    const out = [];
    for(const c of dlgState.sel) for(const w of (PT[c] || [])) if(!out.includes(w)) out.push(w);
    return out;
  }
  function paintKw(){
    const r = kwOfAreas(mainSubject(), dlgAreas());
    /* 자리를 지킨다 — 고른 것을 앞으로 당기면 눌러 놓고도 누른 것인지 눈이 잃는다.
       켜짐은 색으로 이미 보인다. 순서는 기본 낱말 → 올라온 낱말 → 그 밖의 것. */
    const all = [...new Set([...r.blocks.flatMap(b => b.k), ...(dlgState.kwPool||[]), ...dlgState.kw])];
    /* 성취기준에서 나온 말과 이미 고른 말은 앞에 편다. 나머지는 접어 둔다 —
       스무 개를 한꺼번에 펴 두면 고르는 일이 읽는 일이 된다. */
    const head = [...new Set([...stdPoints(), ...dlgState.kw])];
    const rest = all.filter(w => !head.includes(w));
    const chip = w => `<button class="kwc" type="button" data-kw="${esc(w)}"
      aria-pressed="${dlgState.kw.has(w)}">${esc(w)}</button>`;
    el("dlg-kw").innerHTML = (head.length || rest.length)
      ? head.map(chip).join("")
        + (rest.length
            ? `<button class="kwtog" id="dlg-kwmore" type="button" aria-expanded="${!!dlgState.kwMore}"
                 >다른 낱말<span class="cnt">${rest.length}</span></button>`
              + (dlgState.kwMore ? rest.map(chip).join("") : "")
            : "")
      : `<span class="muted">이 영역의 키워드가 없습니다</span>`;
    const mo = el("dlg-kwmore");
    if(mo) mo.onclick = () => { dlgState.kwMore = !dlgState.kwMore; paintKw(); };
    /* 평가 요소 칸이 비어 있으면 이 성취기준의 첫 관점을 예로 보인다 — 채우지는 않는다 */
    const nm = el("dlg-name"), first = stdPoints()[0];
    if(nm && first && !nm.value.trim()) nm.placeholder = `예) ${first}`;
    /* 조용히 실패하지 않는다 */
    const m = el("dlg-kwmsg");
    if(!r.missed.length) m.innerHTML = "";
    else if(r.blocks.length && dlgAreas().length > r.missed.length)
      m.innerHTML = `<div class="dmsg">‘${esc(r.missed.slice(0,2).join("’ · ‘"))}’${r.missed.length>2?` 외 ${r.missed.length-2}건`:""} 영역의 키워드 갈래를 찾지 못했습니다.</div>`;

/* ── 표(CSV) 내보내기 ──
   백업(JSON)과 목적이 다르다. 백업은 기기를 옮기는 것이고, 표는 엑셀에서 보고 옮겨 적는 것이다.
   되돌려 읽지 않으므로 사람이 읽기 좋은 값(코드가 아니라 이름)으로 쓴다. */
function csvCell(v){
  const s = String(v ?? "").replace(/\r?\n/g, " ");        /* 줄바꿈은 칸을 깨므로 공백으로 */
  return /[",;\t]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function csvDown(rows, tail){
  if(rows.length < 2){ alert("내보낼 내용이 아직 없습니다."); return; }
  /* 엑셀은 BOM이 없으면 UTF-8을 알아보지 못해 한글이 깨진다 */
  const blob = new Blob(["\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n")],
                        {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `trecord-${S.klass?.grade||""}학년${S.klass?.room||""}반-${tail}-${today()}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function importJSON(file){
  if(!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(d.schema !== "trecord.v3") throw new Error("이 도구에서 내보낸 파일이 아닙니다");
      if(!confirm("지금 화면의 기록을 파일 내용으로 바꿉니다. 계속할까요?")) return;
      const files = d.files; delete d.files;
      adopt(d, "check");
      save(); render();
      if(files) (async () => {
        try{
          for(const [id, f] of Object.entries(files)){
            const bin = atob(f.data), arr = new Uint8Array(bin.length);
            for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            const blob = new Blob([arr], {type:f.type || "image/jpeg"});
            await filePut(id, {blob, name:f.name, type:f.type, size:blob.size, at:f.at});
          }
          fileStat();
        }catch(e){}
      })();
    }catch(err){ alert("열지 못했습니다 — " + err.message); }
  };
  fr.readAsText(file);
}

function syncThemeButton(){
  const b = el("btn-theme"); if(!b) return;
  const mode = document.documentElement.getAttribute("data-theme") || "auto";
  const label = mode === "dark" ? "어둡게" : mode === "light" ? "밝게" : "자동";
  const icon = mode === "dark" ? "☾" : mode === "light" ? "☼" : "◐";
  b.querySelector(".theme-icon").textContent = icon;
  b.querySelector(".theme-label").textContent = label;
  b.title = `화면 테마: ${label} · 눌러서 바꾸기`;
  b.setAttribute("aria-label", b.title);
}
el("btn-theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
  next ? document.documentElement.setAttribute("data-theme", next) : document.documentElement.removeAttribute("data-theme");
  try{ localStorage.setItem(KEY+".theme", next); }catch(e){}
  syncThemeButton();
};
try{ const t = localStorage.getItem(KEY+".theme"); if(t) document.documentElement.setAttribute("data-theme", t); }catch(e){}
syncThemeButton();
