  try{
    const rec = await fileGet(id);
    if(!rec) throw new Error("보관된 파일을 찾지 못했습니다. 다른 기기에서 담았거나 백업을 사진 없이 불러왔을 수 있습니다.");
    if(_furl) URL.revokeObjectURL(_furl);
    _furl = URL.createObjectURL(rec.blob);
    el("fdlg-name").textContent = rec.name || "산출물";
    el("fdlg-size").textContent = `${kb(rec.size||rec.blob.size)} · ${rec.at||""}`;
    body.innerHTML = /^image\//.test(rec.type)
      ? `<img src="${_furl}" alt="${esc(rec.name||"산출물")}">`
      : `<embed src="${_furl}" type="${esc(rec.type||"application/pdf")}" style="width:100%;height:70vh">`;
    el("fdlg-save").onclick = () => {
      const a = document.createElement("a");
      a.href = _furl; a.download = rec.name || "산출물"; a.click();
    };
  }catch(e){ body.innerHTML = `<div class="empty" style="color:var(--low)">${esc(e.message)}</div>`; }
}
el("fdlg-close").onclick = () => el("fdlg").close();
el("fdlg").addEventListener("close", () => { if(_furl){ URL.revokeObjectURL(_furl); _furl = null; } });

/* ── 산출물 나눠 담기 ──
   사진을 크게 띄우고 번호를 누르면 그 학생의 관찰로 담기고 다음 장으로 넘어간다.
   번호를 누르는 즉시 노트가 생기므로 중간에 닫아도 담은 것은 남는다.
   수준 칩을 여기 두는 것은 근거(사진)가 같은 화면에 있어서다 — 명단만 보고 판정하는
   화면은 만들지 않는다(§일괄의 경계 규칙 1). */
let assign = null, _aurl = null;
async function openAssign(files){
  const cur = slots().find(x => x.key === S.ui.slot);
  assign = {items:[], i:0, cur, made:[], level:""};
  el("adlg-cnt").textContent = `${files.length}장 줄이는 중…`;
  el("adlg-pic").innerHTML = `<span class="none">받는 중…</span>`;
  el("adlg-grid").innerHTML = ""; el("adlg-sum").textContent = "";
  el("adlg").showModal();
  for(const f of files){
    if(f.size > 25 * 1024 * 1024) continue;
    try{
      const blob = await shrink(f), id = uid();
      await filePut(id, {blob, name:f.name, type:blob.type || f.type, size:blob.size, at:today()});
      assign.items.push({id, name:f.name, size:blob.size, blob, noteId:null});
      el("adlg-cnt").textContent = `${assign.items.length}/${files.length}장 준비`;
    }catch(e){}
  }
  if(!assign.items.length){ el("adlg-pic").innerHTML = `<span class="none">받지 못했습니다</span>`; return; }
  paintAssign();
}
function paintAssign(){
  const a = assign; if(!a) return;
  const it = a.items[a.i];
  el("adlg-cnt").textContent = `${a.i + 1} / ${a.items.length}장`;
  if(_aurl){ URL.revokeObjectURL(_aurl); _aurl = null; }
  if(it && /^image\//.test(it.blob.type || "")){
    _aurl = URL.createObjectURL(it.blob);
    el("adlg-pic").innerHTML = `<img src="${_aurl}" alt="">`;
  } else el("adlg-pic").innerHTML = `<span class="none">${it ? esc(it.name) : "남은 장이 없습니다"}</span>`;
  el("adlg-meta").textContent = it ? `${it.name} · ${kb(it.size)}` : "";
  el("adlg-text").value = "";
  /* 수준은 장마다 새로 고른다 — 앞 장의 판정이 따라가지 않게 */
  a.level = "";
  const t = S.tasks.find(x => x.id === _taskId && a.cur?.kind === "subj");
  el("adlg-lv").innerHTML = (t?.rubric || []).map(r =>
    `<button class="lvc" type="button" data-alv="${esc(r.level)}" title="${esc(r.text)}" aria-pressed="false">${esc(r.level)}</button>`).join("");
  const got = {};
  a.made.forEach(m => { got[m.sid] = (got[m.sid] || 0) + 1; });
  el("adlg-grid").innerHTML = S.students.map(s =>
    `<button type="button" data-asid="${s.id}">
      <span class="no">${esc(String(s.no).padStart(2,"0"))}</span>${S.klass.numbersOnly?"":esc(s.name||"")}
      ${got[s.id]?`<span class="got">${got[s.id]}</span>`:""}</button>`).join("");
  const none = S.students.filter(s => !got[s.id]).length;
  el("adlg-msg").textContent = it ? "번호를 누르면 그 학생에게 담기고 다음 장으로 넘어갑니다"
                                  : "남은 장이 없습니다 — 마치기를 누르세요";
  el("adlg-sum").textContent = `담은 것 ${a.made.length}장 · 아직 없는 학생 ${none}명`;
  el("adlg-skip").disabled = !it; el("adlg-drop").disabled = !it;
}
el("adlg-lv").onclick = e => {
  const b = e.target.closest("[data-alv]"); if(!b || !assign) return;
  assign.level = assign.level === b.dataset.alv ? "" : b.dataset.alv;
  el("adlg-lv").querySelectorAll("[data-alv]").forEach(x =>
    x.setAttribute("aria-pressed", String(x.dataset.alv === assign.level)));
};
el("adlg-grid").onclick = e => {
  const b = e.target.closest("[data-asid]"); if(!b || !assign) return;
  const a = assign, it = a.items[a.i]; if(!it) return;
  const text = el("adlg-text").value.trim();
  const keep = _noteLevel; _noteLevel = a.level;
  const n = buildNote(b.dataset.asid, text, a.cur, true);
  _noteLevel = keep;
  n.fileId = it.id;
  S.notes.push(n); it.noteId = n.id;
  a.made.push({sid:b.dataset.asid, fileId:it.id, noteId:n.id});
  a.items.splice(a.i, 1);
  if(a.i >= a.items.length) a.i = Math.max(0, a.items.length - 1);
  save(); paintAssign();
};
el("adlg-skip").onclick = () => { const a = assign; if(!a || a.items.length < 2) return;
  a.i = (a.i + 1) % a.items.length; paintAssign(); };
el("adlg-drop").onclick = async () => {
  const a = assign, it = a?.items[a.i]; if(!it) return;
  a.items.splice(a.i, 1);
  if(a.i >= a.items.length) a.i = Math.max(0, a.items.length - 1);
  try{ await fileDel(it.id); }catch(e){}
  paintAssign();
};
el("adlg-done").onclick = async () => {
  const a = assign;
  if(a?.items.length && !confirm(`아직 나누지 않은 ${a.items.length}장이 있습니다.\n그 장들은 지워집니다. 마칠까요?`)) return;
  for(const it of (a?.items || [])){ try{ await fileDel(it.id); }catch(e){} }
  el("adlg").close();
};
el("adlg").addEventListener("close", () => {
  if(_aurl){ URL.revokeObjectURL(_aurl); _aurl = null; }
  assign = null; renderWrite();
});

/* ── 학생 고르기 창 ──
   옮기기(단일)와 함께 담기(다중)가 함께 쓴다. 수준은 이 창에 들어오지 않는다. */
let sdlgState = null;
function pickStudents({title, multi, preset, exclude, okLabel, msg, allowEmpty, onOK}){
  sdlgState = {multi:!!multi, sel:new Set(preset||[]), exclude:new Set(exclude||[]),
               allowEmpty:!!allowEmpty, onOK};
  el("sdlg-title").textContent = title;
  el("sdlg-msg").textContent = msg || "";
  el("sdlg-all").hidden = !multi;
  el("sdlg-ok").textContent = okLabel || "고르기";
  paintSdlg(okLabel);
  el("sdlg").showModal();
}
function paintSdlg(okLabel){
  const st = sdlgState;
  el("sdlg-grid").innerHTML = S.students.map(s => {
    const off = st.exclude.has(s.id);
    return `<button type="button" data-sid="${s.id}" aria-pressed="${st.sel.has(s.id)}"${off?" disabled":""}>
      <span class="no">${esc(String(s.no).padStart(2,"0"))}</span>${S.klass.numbersOnly?"":esc(s.name||"")}</button>`;
  }).join("") || `<div class="empty">학생이 없습니다</div>`;
  el("sdlg-cnt").textContent = st.multi ? (st.sel.size ? `${st.sel.size}명 선택` : "") : "";
  el("sdlg-ok").disabled = !st.sel.size && !st.allowEmpty;
  if(st.multi && okLabel !== undefined && !st.allowEmpty)
    el("sdlg-ok").textContent = st.sel.size ? `${st.sel.size}명에게 담기` : (okLabel || "담기");
}
el("sdlg-grid").onclick = e => {
  const b = e.target.closest("[data-sid]"); if(!b || b.disabled) return;
  const st = sdlgState, id = b.dataset.sid;
  if(st.multi){ st.sel.has(id) ? st.sel.delete(id) : st.sel.add(id); paintSdlg(""); }
  else { st.sel = new Set([id]); el("sdlg").close(); st.onOK([id]); }
};
el("sdlg-all").onclick = () => {
  const st = sdlgState;
  const all = S.students.filter(s => !st.exclude.has(s.id)).map(s => s.id);
  st.sel = st.sel.size === all.length ? new Set() : new Set(all);
  paintSdlg("");
};
el("sdlg-cancel").onclick = () => el("sdlg").close();
el("sdlg-ok").onclick = () => { const st = sdlgState; el("sdlg").close(); st.onOK([...st.sel]); };

/* ── 성취기준 창 ── */
function openTask(subject, task, onOK){
  openStd(subject, task ? task.standards : [], null, {task, onSave(v){
    if(task){
      Object.assign(task, {name:v.name, criteria:v.criteria, standards:v.codes, rubric:v.rubric,
                           kw:v.kw, sources:v.sources, when:v.when, targets:v.targets,
                           axis:v.axis, subject:dlgState.subject});
      save(); onOK(task.id);
    } else {
      const t = {id:uid(), name:v.name, subject:dlgState.subject, standards:v.codes, criteria:v.criteria,
                 rubric:v.rubric, kw:v.kw, sources:v.sources, when:v.when, targets:v.targets,
                 axis:v.axis, legacy:[], off:{}};
      S.tasks.push(t); save(); onOK(t.id);
    }
  }});
}
/* 평가 추가 창 — 1단계 성취기준 고르기 → 2단계 과제 다듬기 (§10-2).
   taskMode 없는 호출(관찰의 성취기준 태그, 가져오기의 직접 고르기)은 1단계만 쓴다. */
function openStd(subject, selected, onOK, taskMode){
  dlgState = {subject, sel:new Set(selected), onOK, taskMode,
              step: (taskMode && taskMode.task) ? 2 : 1,
              kw:new Set(taskMode?.task?.kw || []), src:new Set(taskMode?.task?.sources || []),
              /* 빈 배열은 「우리 반 전체」다 — 기본이 전원이므로 빈칸을 강요하지 않는다 */
              targets:(taskMode?.task?.targets || []).slice(),
              axis:taskMode?.task?.axis || "", msg:""};
  const subjSel = el("dlg-subj"), q = el("dlg-q"), rubBox = el("dlg-rub");
  subjSel.innerHTML = subjects().map(s=>`<option value="${esc(s)}"${s===subject?" selected":""}>${esc(subjShort(s))}</option>`).join("");
  subjSel.onchange = () => {
    /* 다른 교과의 코드는 남겨 둘 수 없다 — 뺀 것을 숨기지 않는다 */
    const before = dlgState.sel.size;
    dlgState.subject = subjSel.value;
    for(const c of [...dlgState.sel]) if(CODEMAP[c]?.subject !== subjSel.value) dlgState.sel.delete(c);
    const dropped = before - dlgState.sel.size;
    dlgState.msg = dropped ? `다른 교과의 성취기준 ${dropped}건을 뺐습니다` : "";
    dlgState.kw = new Set(); paintDlg();
  };
  q.value = ""; q.oninput = paintDlg;

  if(taskMode){
    el("dlg-name").value = taskMode.task?.name || "";
    el("dlg-crit").value = taskMode.task?.criteria || "";
    el("dlg-when").value = taskMode.task?.when || "";
    const rb = taskMode.task?.rubric || [];
    [...rubBox.querySelectorAll(".rrow2")].forEach((row,i) => {
      row.querySelector(".rl").value = rb[i]?.level ?? ["잘함","보통","노력요함"][i];
      row.querySelector(".rt").value = rb[i]?.text ?? "";
    });
    el("dlg-name").oninput = () => { el("dlg-skel").disabled = !skelKey(); };
    let lt = null;
    rubBox.oninput = () => { clearTimeout(lt); lt = setTimeout(paintLint, 450); };
  }

  el("dlg-cancel").onclick = () => el("dlg").close();
  el("dlg-next").onclick = () => { dlgState.step = 2; dlgState.msg = ""; paintDlg(); el("dlg-name").focus(); };
  el("dlg-back").onclick = () => { dlgState.step = 1; dlgState.msg = ""; paintDlg(); };
  el("dlg-ok").onclick = () => {
    if(dlgState.taskMode){
      const name = el("dlg-name").value.trim();
      if(!name){ el("dlg-name").focus(); return; }
      const rubric = [...rubBox.querySelectorAll(".rrow2")]
        .map(row => ({level:row.querySelector(".rl").value.trim(), text:row.querySelector(".rt").value.trim()}))
        .filter(r => r.level && r.text);
      dlgState.taskMode.onSave({name, criteria:el("dlg-crit").value.trim(), codes:[...dlgState.sel],
                                rubric, kw:[...dlgState.kw], sources:[...dlgState.src],
                                when:el("dlg-when").value.trim(), targets:dlgState.targets.slice(),
                                axis:dlgState.axis});
    } else dlgState.onOK([...dlgState.sel]);
    el("dlg").close();
  };
  el("dlg-body").onclick = e => { const r = e.target.closest(".srow"); if(!r) return;
    const c = r.dataset.code;
    dlgState.sel.has(c) ? dlgState.sel.delete(c) : dlgState.sel.add(c);
    dlgState.msg = ""; paintDlg(); };
  el("dlg-kw").onclick = e => { const b = e.target.closest("[data-kw]"); if(!b) return;
    const w = b.dataset.kw;
    dlgState.kw.has(w) ? dlgState.kw.delete(w) : dlgState.kw.add(w);
    paintKw(); };
  el("dlg-skel").onclick = () => {
    const m = el("dlg-skelmenu");
    if(!m.hidden){ m.hidden = true; return; }
    const k = skelKey();
    m.innerHTML = SKEL.map((s,i)=>`<button class="skelopt" type="button" data-skel="${i}">
      <b>${esc(s.axis)}</b><span>${esc(s.hint)} — ${esc(s.t[0](k))}</span></button>`).join("");
    m.hidden = false;
    m.querySelectorAll("[data-skel]").forEach(b => b.onclick = () => {
      const s = SKEL[+b.dataset.skel], kk = skelKey();
      /* 빈칸만 채운다 — 적힌 칸은 건드리지 않는다 */
      [...rubBox.querySelectorAll(".rrow2")].forEach((row,i) => {
        const t = row.querySelector(".rt");
        if(!t.value.trim() && s.t[i]) t.value = s.t[i](kk);
      });
      dlgState.axis = s.axis; m.hidden = true; paintLint();
    });
  };
  paintDlg(); el("dlg").showModal();

  /* 평가 요소가 비면 첫 성취기준 원문을 명사형으로 바꿔 뼈대의 핵으로 쓴다 */
  function skelKey(){
    const n = el("dlg-name").value.trim();
    if(n) return n;
    const first = [...dlgState.sel][0];
    const t = CODEMAP[first]?.text;
    return t ? (toNominal(String(t).replace(/\.\s*$/,"")) || "") : "";
  }
  function stdTexts(){ return [...dlgState.sel].map(c => CODEMAP[c]?.text).filter(Boolean); }

  function paintDlg(){
    const tm = dlgState.taskMode, one = !tm || dlgState.step === 1;
    el("dlg-title").textContent = tm ? (tm.task ? "평가 고치기" : "평가 설계") : "성취기준 고르기";
    subjSel.hidden = !one; q.hidden = !one; el("dlg-cnt").hidden = !one; el("dlg-body").hidden = !one;
    el("dlg-task").hidden = !tm || one;
    el("dlg-back").hidden = !tm || one;
    el("dlg-next").hidden = !tm || !one;
    el("dlg-ok").hidden = !!tm && one;
    if(one) paintList(); else paintTask();
  }
  function paintList(){
    const qq = q.value.trim();
    const areas = (STD[dlgState.subject]||{})[band()] || [];
    let n = 0;
    const html = areas.map(a => {
      const rows = a.s.filter(([c,t]) => !qq || c.includes(qq) || t.includes(qq));
      n += rows.length;
      return rows.length ? `<div class="ahead">${esc(a.n?a.n+" · ":"")}${esc(a.a)}</div>` +
        rows.map(([c,t])=>`<button class="srow" type="button" data-code="${esc(c)}" data-on="${dlgState.sel.has(c)?1:0}">
          <span class="mk">${dlgState.sel.has(c)?"✓":"＋"}</span><span class="code">${esc(c)}</span><span>${esc(t)}</span></button>`).join("") : "";
    }).join("");
    el("dlg-body").innerHTML = html || `<div class="empty">찾는 성취기준이 없습니다</div>`;
    el("dlg-cnt").textContent = n + "건";
    el("dlg-sel").innerHTML = (dlgState.msg ? `<span style="color:var(--mid)">${esc(dlgState.msg)}</span> · ` : "")
      + (dlgState.sel.size ? `${dlgState.sel.size}건 선택` : "");
    el("dlg-next").disabled = !dlgState.sel.size;
  }
  function paintTask(){
    const codes = [...dlgState.sel];
    el("dlg-picked").innerHTML =
      `<span class="subj">${esc(subjShort(dlgState.subject))}</span>`
      + codes.map(c=>`<span class="chip std" title="${esc(CODEMAP[c]?.text||"")}"><b>${esc(c)}</b>${esc(stdCut(c,22))}</span>`).join("")
      + (dlgAreas().length
          ? dlgAreas().map(a=>`<span class="abadge">${esc(a)}</span>`).join("")
          : `<span class="abadge none">영역 없음</span>`);
    /* 평가 요소·루브릭을 쓰는 내내 원문이 눈앞에 있어야 '이 과제가 이 기준을 재는가'를 판단한다 */
    el("dlg-full").innerHTML = codes.map(c =>
      `<div class="one"><span class="c">${esc(c)}</span><span>${esc(CODEMAP[c]?.text || "원문을 찾지 못했습니다")}</span></div>`).join("");
    el("dlg-sel").textContent = codes.length ? `성취기준 ${codes.length}건` : "";
    el("dlg-skel").disabled = !skelKey();
    paintSrc(); paintWho();
    /* AI 버튼 둘은 연결돼 있을 때만 */
    el("dlg-kwai-slot").innerHTML = aiOn()
      ? `<button class="kwai" id="dlg-kwai" type="button">${ICON.spark()}AI 추천</button>` : "";
    el("dlg-airub-slot").innerHTML = aiOn()
      ? `<button class="ghost" id="dlg-airub" type="button">AI 초안</button>` : "";
    const kai = el("dlg-kwai"); if(kai) kai.onclick = aiKeywords;
    const arb = el("dlg-airub"); if(arb) arb.onclick = aiRubric;
    paintKw(); paintLint();
  }
  /* 증거 계획 — 관찰 한 번으로 판정하는 평가를 설계 시점에 거른다.
     짚어주기의 「근거가 직접관찰뿐인 학생」은 사후 경보인데, 이 줄은 같은 점검을 앞으로 당긴다.
     고른 것이 없어도 담기는 눌린다 — 설계를 강제하는 잠금은 만들지 않는다(§10-2). */
  function paintSrc(){
    el("dlg-src").innerHTML = SOURCES.map(v =>
      `<button type="button" data-src="${esc(v)}" aria-pressed="${dlgState.src.has(v)}"
        >${ICON[SRC_ICON[v]] ? ICON[SRC_ICON[v]]() : ""}${esc(v)}</button>`).join("");
    const n = dlgState.src.size, direct = n === 1 && dlgState.src.has("직접관찰");
    el("dlg-srcmsg").textContent = !n ? "고르지 않아도 됩니다"
      : direct ? "직접관찰 하나뿐입니다 — 남는 자료가 있으면 함께 고르세요"
               : `${n}가지`;
    el("dlg-src").querySelectorAll("[data-src]").forEach(b => b.onclick = () => {
      const v = b.dataset.src;
      dlgState.src.has(v) ? dlgState.src.delete(v) : dlgState.src.add(v);
      paintSrc();
    });
  }
  /* 대상 — 비워 두면 우리 반 전체다. 일부만 고른 경우에만 명단이 생긴다 */
  function paintWho(){
    const t = dlgState.targets, n = t.length;
    el("dlg-whotxt").textContent = !n ? "우리 반 전체"
      : `${n}명 — ` + S.students.filter(s => t.includes(s.id))
          .map(s => String(s.no).padStart(2,"0")).join(" ");
    el("dlg-who").textContent = n ? "다시 고르기" : "일부만 고르기";
  }
  el("dlg-who").onclick = () => pickStudents({
    title:"이 평가를 누구에게", multi:true, preset:dlgState.targets, okLabel:"정하기",
    msg:"비워서 정하면 우리 반 전체가 됩니다", allowEmpty:true,
    onOK(ids){ dlgState.targets = ids.length === S.students.length ? [] : ids; paintWho(); }});

  function paintKw(){
    const r = kwOfAreas(dlgState.subject, dlgAreas());
    const words = [...new Set([...dlgState.kw, ...r.blocks.flatMap(b => b.k)])];
    el("dlg-kw").innerHTML = words.map(w=>`<button class="kwc" type="button" data-kw="${esc(w)}"
      aria-pressed="${dlgState.kw.has(w)}">${esc(w)}</button>`).join("")
      || `<span class="muted">이 영역의 키워드가 없습니다</span>`;
    /* 조용히 실패하지 않는다 */
    const m = el("dlg-kwmsg");
    if(!r.missed.length) m.innerHTML = "";
    else if(r.blocks.length && dlgAreas().length > r.missed.length)
      m.innerHTML = `<div class="dmsg">‘${esc(r.missed.slice(0,2).join("’ · ‘"))}’${r.missed.length>2?` 외 ${r.missed.length-2}건`:""} 영역의 키워드 갈래를 찾지 못했습니다.</div>`;
    else
      m.innerHTML = `<div class="dmsg">이 영역의 키워드 갈래를 찾지 못해 ${esc(subjShort(dlgState.subject))} 전체 키워드를 보입니다.</div>`;
  }
  function paintLint(){
    const rows = [...rubBox.querySelectorAll(".rrow2")]
      .map(row => ({level:row.querySelector(".rl").value.trim(), text:row.querySelector(".rt").value.trim()}));
    const fs = rubricLint(rows, stdTexts());
    el("dlg-lint").innerHTML = fs.map(f=>`<details class="f warn">
      <summary><span class="mk">▲</span><span class="hit">${esc(f.hit)}</span>
        <span class="r"><span class="basis">루브릭 점검</span></span></summary>
      <div class="why">${esc(f.why)}</div></details>`).join("");
  }

  async function aiKeywords(){
    const b = el("dlg-kwai"); b.disabled = true; b.textContent = "…";
    const codes = [...dlgState.sel];
    const name = el("dlg-name").value.trim(), crit = el("dlg-crit").value.trim();
    try{
      const r = await aiJSON(`한국 초등학교 ${S.klass.grade}학년 ${dlgState.subject} 수업에서 교사가 관찰 기록에 쓸 키워드를 뽑는다.
${codes.length ? "성취기준:\n" + codes.map(c => `- [${c}] ${CODEMAP[c]?.text||""}`).join("\n") : "영역: " + dlgAreas().join(" · ")}
${name ? "평가과제: " + name + (crit ? " / 평가기준: " + crit : "") : ""}
지식·기능·태도 세 갈래로 각각 6개씩, 교사가 관찰한 사실을 적을 때 쓰는 짧은 명사구로 쓴다(예: 중심 문장 찾기, 근거 들어 설명하기).
점수·등급·대회·상표명은 넣지 않는다.
JSON만 출력한다: {"지식":["..."],"기능":["..."],"태도":["..."]}`);
      const got = ["지식","기능","태도"].flatMap(k => (r[k]||[]).map(String)).filter(Boolean);
      got.forEach(w => dlgState.kw.add(w));
      paintKw();
      el("dlg-kwmsg").innerHTML = `<div class="dmsg">AI가 ${got.length}개를 더했습니다. 필요 없는 것은 눌러서 끄세요.</div>`;
    }catch(e){ el("dlg-kwmsg").innerHTML = `<div class="dmsg" style="color:var(--low)">${esc(e.message)}</div>`; }
    const b2 = el("dlg-kwai"); if(b2){ b2.disabled = false; b2.innerHTML = ICON.spark() + "AI 추천"; }
  }
  async function aiRubric(){
    const b = el("dlg-airub"); b.disabled = true; b.textContent = "…";
    const rows = [...rubBox.querySelectorAll(".rrow2")];
    const levels = rows.map(r => r.querySelector(".rl").value.trim() || "수준");
    try{
      const r = await aiJSON(`한국 초등학교 ${S.klass.grade}학년 ${dlgState.subject} 평가과제의 ${levels.length}수준 루브릭을 쓴다.
평가 요소: ${el("dlg-name").value.trim()} / 평가 내용: ${el("dlg-crit").value.trim()}
성취기준:
${[...dlgState.sel].map(c => `- [${c}] ${CODEMAP[c]?.text||""}`).join("\n") || "- (없음)"}
수준을 가르는 기준: ${dlgState.axis || "자립도"}
각 수준은 한 문장이고 '~함'으로 끝낸다. 세 문장은 같은 행동을 다루며 정도만 다르다.
성취기준 문장을 그대로 옮겨 적지 않는다. 점수·백분율·석차를 쓰지 않는다.
'${levels[levels.length-1]}'은 못하는 것의 나열이 아니라 어떤 도움에서 무엇을 해내는지로 쓴다.
JSON만 출력한다: {${levels.map(l=>`"${l}":"…"`).join(",")}}`);
      /* 뼈대와 같은 규칙 — 빈칸만 채운다 */
      rows.forEach((row,i) => {
        const t = row.querySelector(".rt"), v = r[levels[i]];
        if(!t.value.trim() && v) t.value = String(v).trim();
      });
      paintLint();
    }catch(e){ el("dlg-lint").innerHTML = `<div class="dmsg" style="color:var(--low)">${esc(e.message)}</div>`; }
    const b2 = el("dlg-airub"); if(b2){ b2.disabled = false; b2.textContent = "AI 초안"; }
  }
}

/* ── 데이터 ── */
async function exportJSON(){
  const withFiles = el("ex-files")?.checked;
  const data = Object.assign({}, S, {exportedAt:new Date().toISOString()});
  if(withFiles){
    const btn = el("ex"); if(btn){ btn.disabled = true; btn.textContent = "사진을 담는 중…"; }
    try{
      const keys = await fileKeys(), all = await fileAll(), files = {};
      for(let i = 0; i < keys.length; i++){
        const rec = all[i];
        files[keys[i]] = {name:rec.name, type:rec.type, at:rec.at, size:rec.size,
          data: await new Promise(ok => { const fr = new FileReader();
            fr.onload = () => ok(String(fr.result).split(",")[1]); fr.readAsDataURL(rec.blob); })};
      }
      data.files = files;
    }catch(e){}
    const btn2 = el("ex"); if(btn2){ btn2.disabled = false; btn2.textContent = "백업 내려받기"; }
  }
  const blob = new Blob([JSON.stringify(data, null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `trecord-${S.klass?.grade||""}학년${S.klass?.room||""}반-${today()}${withFiles?"-사진포함":""}.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
/* ── 표(CSV) 내보내기 ──
   백업(JSON)과 목적이 다르다. 백업은 기기를 옮기는 것이고, 표는 엑셀에서 보고 옮겨 적는 것이다.
   되돌려 읽지 않으므로 사람이 읽기 좋은 값(코드가 아니라 이름)으로 쓴다. */
function csvCell(v){
  const s = String(v ?? "").replace(/\r?\n/g, " ");        /* 줄바꿈은 칸을 깨므로 공백으로 */
  return /[",;\t]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function csvDown(rows, tail){
  if(rows.length < 2){ alert("내보낼 내용이 아직 없습니다."); return; }
  /* 엑셀은 BOM이 없으면 UTF-8을 알아보지 못해 한글이 깨진다 */
  const blob = new Blob(["\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n")],
                        {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `trecord-${S.klass?.grade||""}학년${S.klass?.room||""}반-${tail}-${today()}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportSentenceCSV(){
  const sl = slots(), rows = [["번호","이름","항목","문장","글자수(바이트)","확인","담긴 근거"]];
  for(const s of S.students) for(const x of sl){
    const t = (S.drafts[dkey(s.id, x.key)]?.text || "").trim();
    if(!t) continue;                                        /* 빈 칸까지 내보내면 표가 빈 행으로 덮인다 */
    rows.push([s.no, s.name || "", x.label, t, bytes(t),
               draftDone(s.id, x.key) ? "완료" : "미완", notesOf(s.id, x.key).length]);
  }
  csvDown(rows, "문장");
}
function exportNoteCSV(){
  const AX = {subj:"교과", cca:"창체", behavior:"행동특성"};
  const stu = id => S.students.find(s => s.id === id);
  const rows = [["번호","이름","날짜","축","교과·창체","평가과제","성취기준","2015 코드","수준","근거유형","내용","사진"]];
  const sorted = S.notes.slice().sort((a,b) =>
    (stu(a.studentId)?.no ?? 999) - (stu(b.studentId)?.no ?? 999) ||
    String(a.date||"").localeCompare(String(b.date||"")));
  for(const n of sorted){
    const s = stu(n.studentId); if(!s) continue;
    rows.push([s.no, s.name || "", n.date || "", AX[n.axis] || "",
               n.axis === "subj" ? (n.subject || "") : n.axis === "cca" ? (CCA[n.cca]?.label || "") : "",
               S.tasks.find(t => t.id === n.taskId)?.name || "",
               (n.standards||[]).join(" "), (n.legacy||[]).join(" "),
               n.level || "", n.source || "", n.text || "", n.fileId ? "있음" : ""]);
  }
  csvDown(rows, "관찰");
}
async function fileStat(){
  const box = el("fstat"); if(!box) return;
  try{
    const all = await fileAll();
    const n = all.length, sum = all.reduce((a,r) => a + (r.size || r.blob?.size || 0), 0);
    box.textContent = n ? `— 지금 보관된 산출물 ${n}개, 모두 ${kb(sum)}` : "— 아직 보관된 산출물이 없습니다";
  }catch(e){ box.textContent = ""; }
}
function importJSON(file){
  if(!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(d.schema !== "trecord.v3") throw new Error("이 도구에서 내보낸 파일이 아닙니다");
      if(!confirm("지금 화면의 기록을 파일 내용으로 바꿉니다. 계속할까요?")) return;
      const files = d.files; delete d.files;
      adopt(d, "check");
      save(); render();
      if(files) (async () => {
        try{
          for(const [id, f] of Object.entries(files)){
            const bin = atob(f.data), arr = new Uint8Array(bin.length);
            for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            const blob = new Blob([arr], {type:f.type || "image/jpeg"});
            await filePut(id, {blob, name:f.name, type:f.type, size:blob.size, at:f.at});
          }
          fileStat();
        }catch(e){}
      })();
    }catch(err){ alert("열지 못했습니다 — " + err.message); }
  };
  fr.readAsText(file);
}
function seedClasses(){
  const NAMES = ["김하준","이서연","박도윤","최지우","정시우","강하은","조은우","윤수아","장민준","임지호",
                 "오예린","한서준","신아윤","권태오","황유나","문가온","서주원","배시윤","노하율","안리안"];
  stashActive();
  for(let g = 1; g <= 6; g++){
    const pool = NAMES.slice().sort(() => Math.random() - 0.5).slice(0, 10);
    const c = newClass({grade:g, room:String(1 + Math.floor(Math.random()*4)), teacher:"",
                        excluded:[], numbersOnly:false, demo:true},
                       pool.map((n,i) => ({id:uid(), no:i+1, name:n})));
    S.classes.push(c);
  }
  save(); render();
}
function removeClass(id){
  const c = S.classes.find(x => x.id === id); if(!c) return;
  const n = (c.notes||[]).length, w = Object.keys(c.drafts||{}).length;
  if(!confirm(`${klassName(c)} 학급을 지웁니다.` + (n||w ? `\n관찰 ${n}건과 문장 ${w}칸도 함께 사라집니다.` : "") + "\n되돌릴 수 없습니다.")) return;
  S.classes = S.classes.filter(x => x.id !== id);
  activate(S.classes[0]?.id || null);
  S.ui.sid = S.students[0]?.id || null;
  save(); render();
}
